<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <title>Academy OPS 🧪 تجريبي</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <meta charset="utf-8">
  <meta name="theme-color" content="#0b6e7f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #14181f; --muted: #667085; --line: #e3e6eb; --soft: #f0f2f5;
  --accent: #0b6e7f; --accent-ink: #ffffff; --accent-soft: #e2f1f3;
  --good: #15803d; --good-soft: #e3f5e8; --warn: #b45309; --warn-soft: #fdf1dc;
  --bad: #c62828; --bad-soft: #fde6e6; --orange: #d9580f; --orange-soft: #fde9dc;
  --off: #8a94a3; --off-soft: #eceef1; --owner: #6d28d9; --owner-soft: #efe7fd;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --card: #171b21; --ink: #e8ebef; --muted: #9aa4b2; --line: #2a303a; --soft: #1e232b;
    --accent: #3fb6c8; --accent-ink: #081418; --accent-soft: #123138;
    --good: #4ade80; --good-soft: #13301f; --warn: #f5b454; --warn-soft: #3a2a10;
    --bad: #f87171; --bad-soft: #3a1616; --orange: #fb923c; --orange-soft: #3a2110;
    --off: #7c8696; --off-soft: #22272f; --owner: #b48cff; --owner-soft: #2a1d47;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body { font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; font-size: 15px; line-height: 1.6;
  -webkit-text-size-adjust: 100%; overflow-x: hidden; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { display: flex; min-height: 100vh; }
main { flex: 1; min-width: 0; padding: 12px 16px calc(var(--nav-h) + 24px); max-width: 1100px; margin: 0 auto; width: 100%; }

/* ─── التنقل: شريط سفلي على الجوال، جانبي على الكومبيوتر ─── */
nav.bottom { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--card);
  border-top: 1px solid var(--line); display: flex; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
nav.bottom button { flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font-size: 11.5px; color: var(--muted); cursor: pointer; position: relative; min-width: 0; }
nav.bottom button.on { color: var(--accent); font-weight: 600; }
nav.bottom svg { width: 22px; height: 22px; }
.dot { position: absolute; top: 8px; inset-inline-end: calc(50% - 20px); min-width: 17px; height: 17px; border-radius: 9px;
  background: var(--bad); color: #fff; font-size: 10.5px; line-height: 17px; padding: 0 4px; text-align: center; }
nav.side { display: none; }
@media (min-width: 900px) {
  nav.bottom { display: none; }
  nav.side { display: block; width: 220px; flex-shrink: 0; background: var(--card); border-inline-start: 1px solid var(--line);
    padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav.side .brand { font-weight: 700; padding: 4px 10px 14px; }
  nav.side button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: start; background: none; border: 0;
    padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--ink); position: relative; }
  nav.side button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav.side .dot { position: static; margin-inline-start: auto; }
  main { padding-bottom: 32px; }
}

/* ─── المؤشر الشمالي ─── */
.north { background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.north .n { font-size: 34px; font-weight: 700; line-height: 1; }
.north .l { font-size: 13px; opacity: .92; }
.north .side-stats { font-size: 12.5px; text-align: end; opacity: .92; }

h1 { font-size: 20px; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h2 { font-size: 15.5px; margin: 18px 0 8px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
  margin-bottom: 10px; box-shadow: var(--shadow); overflow-wrap: anywhere; }
.card.click { cursor: pointer; }
.card.click:active { transform: scale(.995); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12.5px; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px;
  background: var(--soft); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.owner { background: var(--owner-soft); color: var(--owner); border-color: transparent; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; flex: 1; min-width: 120px; }
.stat .v { font-size: 22px; font-weight: 700; }
.stat .k { font-size: 12px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--card); padding: 9px 14px; border-radius: 11px; cursor: pointer;
  font-weight: 500; min-height: 40px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { background: var(--good); color: #fff; border-color: var(--good); }
.btn.bad { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btns .btn { flex: 1 1 auto; }

input[type=text], input[type=number], input[type=date], input[type=url], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 11px; }
textarea { min-height: 150px; resize: vertical; line-height: 1.7; }
textarea.mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; direction: auto; }
label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
.quote { background: var(--soft); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; }
.toast { position: fixed; bottom: calc(var(--nav-h) + 14px); left: 16px; right: 16px; margin: auto; max-width: 480px;
  background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 12px; z-index: 60; text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast.err { background: var(--bad); color: #fff; }
.loading { text-align: center; padding: 40px; color: var(--muted); }
.newbadge { background: var(--bad); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; border: 0; }
details > summary { cursor: pointer; color: var(--accent); margin: 6px 0; }
.bar { height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
.kv b { color: var(--muted); font-weight: 500; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; display: flex; justify-content: flex-start; }
.sheet .panel { background: var(--bg); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 14px 16px 90px;
  box-shadow: 0 0 30px rgba(0,0,0,.2); }
.sheet .close { position: sticky; top: 0; float: left; }
.switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--off); border-radius: 26px; transition: .2s; cursor: pointer; }
.switch span:before { content: ''; position: absolute; width: 20px; height: 20px; inset-inline-start: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span:before { transform: translateX(-20px); }
.switch input:disabled + span { opacity: .5; cursor: default; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
.tabs button { white-space: nowrap; }
.kanban { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 900px) { .kanban { grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); overflow-x: auto; } }
.kcol { background: var(--soft); border-radius: 12px; padding: 8px; min-height: 60px; }
.kcol h3 { font-size: 13px; margin: 2px 4px 8px; display: flex; justify-content: space-between; }
.kcol.drop { outline: 2px dashed var(--accent); }
/* ─── تقويم الدورات ─── */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 10px 0 14px; }
.cal-h { text-align: center; font-size: 11.5px; color: var(--muted); padding: 4px 0; }
.cal-c { min-height: 64px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px; overflow: hidden; }
.cal-c.off { background: transparent; border: 0; }
.cal-c.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.cal-n { font-size: 11px; color: var(--muted); }
.cal-b { color: #fff; font-size: 10.5px; border-radius: 4px; padding: 1px 4px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.cal-b.ex { background: var(--warn); color: #111; cursor: default; }
@media (min-width: 700px) { .cal-c { min-height: 88px; } .cal-b { font-size: 12px; } }

/* ─── شريط الرجوع + وصف الصفحة ─── */
.pagebar { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; }
.pagebar .back { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; cursor: pointer; color: var(--ink); }
.intro { background: var(--accent-soft); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; margin: 0 0 10px; }
.intro b { color: var(--accent); }

/* ─── INFO: مخطط النظام ─── */
.fc { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.fc-stage { border: 1px solid var(--line); border-radius: 14px; padding: 10px; background: var(--card); }
.fc-stage > .t { font-weight: 700; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
.fc-arrow { text-align: center; color: var(--accent); font-size: 22px; line-height: 1.2; }
.fc-nodes { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 700px) { .fc-nodes { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1100px) { .fc-nodes { grid-template-columns: 1fr 1fr 1fr; } }
.fc-node { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); }
.fc-node summary { cursor: pointer; font-weight: 600; list-style: none; }
.fc-node summary::-webkit-details-marker { display: none; }
.fc-node .btnrow { border-top: 1px dashed var(--line); padding: 6px 0 2px; font-size: 13px; }
.fc-node .btnrow b { color: var(--accent); }
/* ─── مخطط شجري: رأس ← فروع ─── */
.tree { margin: 12px 0 22px; }
.tr-head { max-width: 560px; margin: 0 auto; background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 10px 14px; text-align: center; position: relative; }
.tr-head .chip { background: rgba(255,255,255,.2); color: inherit; }
.tr-head a { color: inherit; text-decoration: underline; }
.tr-title { font-weight: 700; font-size: 15px; }
.tr-kids { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; padding-top: 14px; border-top: 2px solid var(--accent); position: relative; }
.tr-kids::before { content: ''; position: absolute; top: -24px; left: 50%; height: 22px; border-left: 2px solid var(--accent); }
.tr-kid { position: relative; flex: 1 1 240px; max-width: 320px; }
.tr-kid::before { content: ''; position: absolute; top: -16px; left: 50%; height: 14px; border-left: 2px solid var(--accent); }
.tr-node { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; height: 100%; box-shadow: var(--shadow); }
.tr-node .tr-title { color: var(--accent); margin-bottom: 4px; }
.fcx { display: flex; flex-direction: column; align-items: center; }
.fcx-stage { width: 100%; max-width: 820px; border: 2px solid; border-radius: 14px; overflow: hidden; background: var(--card); }
.fcx-t { color: #fff; font-weight: 700; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fcx-h { background: rgba(0,0,0,.25); border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 400; }
.fcx-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 6px; padding: 12px 10px; }
.fcx-box { border: 2px solid; background: var(--bg); color: var(--ink); border-radius: 10px; padding: 10px 14px; min-width: 96px;
  font: inherit; font-weight: 600; cursor: pointer; transition: transform .1s; }
.fcx-box:hover { transform: translateY(-2px); }
.fcx-arr { font-size: 18px; font-weight: 700; }
.fcx-down { font-size: 26px; line-height: 1.3; }
.fc-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-inline-end: 4px; }
/* ─── فقاعة الشرح الصفراء ─── */
.tipbox { position: absolute; z-index: 9999; background: #fff3b0; color: #3a2e00; border: 1px solid #e6c84f; border-radius: 10px; padding: 7px 10px;
  font-size: 13px; line-height: 1.6; box-shadow: 0 6px 18px rgba(0,0,0,.25); pointer-events: none; display: none; direction: rtl; }
/* ─── البيئة التجريبية ─── */
.sbx-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: #c0392b; color: #fff; text-align: center; font-size: 12.5px; padding: 3px 6px; }
body.is-sandbox { padding-top: 24px; }
body.is-sandbox nav.side { top: 24px; }
.sbx-fab { position: fixed; left: 14px; bottom: calc(var(--nav-h) + 14px); z-index: 60; background: #e9a23b; color: #111; border: 0; border-radius: 22px; padding: 10px 14px; font: inherit; font-weight: 700; box-shadow: 0 6px 16px rgba(0,0,0,.3); cursor: pointer; }
@media (min-width: 900px) { .sbx-fab { bottom: 18px; } }
/* ─── مبدّل اللغة ─── */
.lang-sw { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin: 4px 10px 10px; }
.lang-sw button { background: transparent; border: 0; color: var(--muted); padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.lang-sw button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
nav.side .lang-sw button { width: auto; display: inline-block; padding: 5px 12px; }
</style>

</head>

function i18nSave_() { try { localStorage.setItem('ops_i18n', JSON.stringify(I18N.dict)); } catch (e) {} }

/** ترجمة نص: كامل من القاموس، أو أجزاؤه المفصولة بـ · و — و : ، وإلا يُضاف للطلب */
function tr(s) {
  if (!i18nOn_() || !s || !I18N_AR.test(s)) return s;
  var t = String(s), key = t.trim();
  if (I18N.dict[key]) return t.replace(key, I18N.dict[key]);
  var parts = key.split(/(\s*[·—|:،]\s*|\s+←\s+|\s+→\s+)/);
  if (parts.length > 1) {
    var ok = true, outp = parts.map(function (p) {
      if (!I18N_AR.test(p)) return p;
      var k = p.trim(); if (I18N.dict[k]) return p.replace(k, I18N.dict[k]);
      ok = false; i18nQueue_(k); return p;
    });
    if (ok) return t.replace(key, outp.join(''));
  }
  i18nQueue_(key);
  return s;
}
function i18nQueue_(k) {
  if (!k || k.length > 600 || I18N.dict[k]) return;
  I18N.pending[k] = 1;
  clearTimeout(I18N.timer); I18N.timer = setTimeout(i18nFetch_, 250);
}
function i18nFetch_() {
  if (I18N.busy) { I18N.timer = setTimeout(i18nFetch_, 400); return; }
  var list = Object.keys(I18N.pending).slice(0, 120); if (!list.length) return;
  list.forEach(function (k) { delete I18N.pending[k]; });
  I18N.busy = true;
  api('action', 'i18nTranslate', { texts: list }).then(function (r) {
    I18N.busy = false;
    var n = 0; Object.keys(r.map || {}).forEach(function (k) { I18N.dict[k] = r.map[k]; n++; });
    list.forEach(function (k) { if (!I18N.dict[k]) I18N.dict[k] = k; }); // لا ترجمة ← يبقى كما هو (لا يُطلب مجدداً)
    i18nSave_(); if (n) { i18nApply_(document.body); if (typeof tipRefresh_ === 'function') tipRefresh_(); }
    if (Object.keys(I18N.pending).length) I18N.timer = setTimeout(i18nFetch_, 200);
  }).catch(function () { I18N.busy = false; });
}
var I18N_SKIP = 'script,style,textarea,code,pre,.quote,.no-tr,[contenteditable]';
function i18nApply_(root) {
  if (!i18nOn_() || !root) return;
  var w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n, list = [];
  while ((n = w.nextNode())) list.push(n);
  list.forEach(function (node) {
    if (!I18N_AR.test(node.nodeValue)) return;
    var p = node.parentElement; if (!p || p.closest(I18N_SKIP)) return;
    var v = tr(node.nodeValue); if (v !== node.nodeValue) node.nodeValue = v;
  });
  var els = root.querySelectorAll ? root.querySelectorAll('[placeholder],[title],option,input[type=button]') : [];
  Array.prototype.forEach.call(els, function (el) {
    ['placeholder', 'title'].forEach(function (a) { var v = el.getAttribute(a); if (v && I18N_AR.test(v)) { var t = tr(v); if (t !== v) el.setAttribute(a, t); } });
  });
}
/** كل تغيير في الصفحة يُترجم تلقائياً (شاشات، نوافذ، رسائل منبثقة) */
var I18N_OBS = new MutationObserver(function (muts) {
  if (!i18nOn_()) return;
  muts.forEach(function (m) {
    if (m.type === 'characterData') { var p = m.target.parentElement; if (p && !p.closest(I18N_SKIP) && I18N_AR.test(m.target.nodeValue)) { var v = tr(m.target.nodeValue); if (v !== m.target.nodeValue) m.target.nodeValue = v; } return; }
    Array.prototype.forEach.call(m.addedNodes, function (nd) { if (nd.nodeType === 1) i18nApply_(nd); else if (nd.nodeType === 3 && nd.parentElement) i18nApply_(nd.parentElement); });
  });
});
function i18nSetDir_() {
  document.documentElement.setAttribute('lang', i18nOn_() ? 'en' : 'ar');
  document.documentElement.setAttribute('dir', i18nOn_() ? 'ltr' : 'rtl');
}
(function () {
  var _confirm = window.confirm, _prompt = window.prompt;
  window.confirm = function (m) { return _confirm.call(window, tr(m)); };
  window.prompt = function (m, d) { return _prompt.call(window, tr(m), d); };
})();
function i18nStart_() {
  i18nSetDir_();
  I18N_OBS.observe(document.body, { childList: true, subtree: true, characterData: true });
  if (i18nOn_()) {
    i18nApply_(document.body);
    setTimeout(function () { if (typeof tipsPrefetch_ === 'function') tipsPrefetch_(); }, 3000);
    api('action', 'i18nAll', {}).then(function (r) { Object.keys(r.map || {}).forEach(function (k) { if (!I18N_BASE[k]) I18N.dict[k] = r.map[k]; }); i18nSave_(); i18nApply_(document.body); }).catch(function () {});
  }
}

};

function postMediaUpload_(input, ids) {

      '</span>' + (FLOW.present ? '<button class="btn sm" data-act="flowPresent">خروج</button> <button class="btn sm pri" data-act="flowPng">تصدير PNG</button>' : '') + '</h1>' +
      '<div class="qbar">' +
      '<div><div class="lab"><span>تشغيل اليوم: ' + Math.round(u.sec / 60 * 10) / 10 + ' من ' + u.quota_min + ' دقيقة</span><span>' + u.pct + '%</span></div>' +
      '<div class="bar ' + qCls + '"><i style="width:' + Math.min(100, u.pct) + '%"></i></div>' +
      '<div class="lab"><span>الـ tick الخامل: ' + u.idle_avg_sec + ' ث</span><span>ticks: ' + u.ticks + '</span></div></div>' +
      '<div><div class="lab"><span>Claude اليوم: ' + c.spent + '$ من ' + c.budget + '$</span><span>' + cPct + '%</span></div>' +
      '<div class="bar ' + (cPct >= 100 ? 'bad' : cPct >= 70 ? 'warn' : '') + '"><i style="width:' + Math.min(100, cPct) + '%"></i></div></div>' +
      '<div class="master ' + (d.paused ? 'paused' : '') + '"><b>' + (d.paused ? '⏸ الأتمتة موقوفة' : 'كل الأتمتة تعمل') + '</b>' +
      switchHtml(!d.paused, 'flowMaster', 'all') + '</div></div>' +
      (d.raise_tick_hint ? '<div class="card small" style="border-color:var(--warn)">الاستهلاك تجاوز ٦٠٪ — ارفع tick_minutes إلى 15 من <a href="#" data-go="settings">الإعدادات</a>.</div>' : '') +
      (u.pct >= 70 ? '<div class="card small" style="border-color:var(--bad)">تجاوز ٧٠٪: الوحدات غير الحرجة مؤجّلة لليوم التالي.</div>' : '') +
      '<div class="legend">' + [['ok', 'var(--good)'], ['off', 'var(--off)'], ['error', 'var(--bad)'], ['never', '#e0b100'], ['deferred', 'var(--orange)'], ['owner', 'var(--owner)']]
        .map(function (x) { return '<span><i style="background:' + x[1] + '"></i>' + STATUS_TXT[x[0]] + '</span>'; }).join('') + '</div>' +
      '<div class="flow" id="flow"><svg class="edges" id="edges"></svg>' + d.groups.map(function (g) {
        return '<div class="fstage"><h3>' + esc(g.stage) + '</h3><div class="fnodes">' + g.nodes.map(nodeHtml).join('') + '</div></div>';
      }).join('') + '</div></div>';
    return html;
  },
  after: function () { requestAnimationFrame(drawEdges); }
};

function nodeHtml(n) {
  var sub = n.kind === 'human' ? 'كل رد غير مُرقّى يمر من هنا' :
    (n.last_run ? fmtDate(n.last_run, true) + ' · ' + (n.last_items || 0) + ' عنصر' : (n.phase1 ? 'المرحلة الأولى' : 'لم تُشغَّل')) +
    (n.schedule && n.kind !== 'human' ? ' · ' + esc(n.schedule) : '');
  return '<button class="node ' + n.status + '" data-node="' + esc(n.key) + '" data-act="flowNode" data-id="' + esc(n.key) + '">' +
    '<span class="nm">' + esc(n.name) + '</span><span class="sub">' + sub + '</span>' +
    (n.badges.length ? '<span class="bd">' + n.badges.map(function (b) { return '<span>' + esc(b.name) + '</span>'; }).join('') + '</span>' : '') + '</button>';
}

/** الأسهم: المصادر → أول عقدة في الاستقبال، ثم سلسلة داخل كل مرحلة، ثم آخر المرحلة → أول التالية */
function drawEdges() {
  var root = $('flow'), svg = $('edges');
  if (!root || !svg || !FLOW.data) return;
  var box = root.getBoundingClientRect();
  var horiz = window.innerWidth >= 900;
  var groups = FLOW.data.groups;
  var edges = [];
  groups.forEach(function (g, i) {
    var next = groups[i + 1];
    if (i === 0 && next) g.nodes.forEach(function (n) { edges.push([n, next.nodes[0]]); });
    else {
      for (var k = 0; k + 1 < g.nodes.length; k++) edges.push([g.nodes[k], g.nodes[k + 1]]);
      if (next) edges.push([g.nodes[g.nodes.length - 1], next.nodes[0]]);
    }
  });
  var rect = function (key) {
    var el = root.querySelector('[data-node="' + key + '"]');
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return { l: r.left - box.left, r: r.right - box.left, t: r.top - box.top, b: r.bottom - box.top, cx: (r.left + r.right) / 2 - box.left, cy: (r.top + r.bottom) / 2 - box.top };
  };
  var col = getComputedStyle(document.documentElement).getPropertyValue('--muted') || '#888';
  var out = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="' + col + '"/></marker></defs>';
  edges.forEach(function (e) {
    var a = rect(e[0].key), b = rect(e[1].key);
    if (!a || !b) return;
    var sameCol = Math.abs(a.cx - b.cx) < 30;
    var x1, y1, x2, y2, path;
    if (horiz && !sameCol) {           // RTL: من اليمين إلى اليسار
      x1 = a.l; y1 = a.cy; x2 = b.r; y2 = b.cy;
      var mx = (x1 + x2) / 2;
      path = 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2;
    } else {                           // عمودياً: من الأسفل إلى الأعلى التالي
      x1 = a.cx; y1 = a.b; x2 = b.cx; y2 = b.t;
      if (y2 < y1) { y1 = a.cy; x1 = a.l; x2 = b.r; y2 = b.cy; }
      var my = (y1 + y2) / 2;
      path = 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + y2;
    }
    var dim = !e[1].enabled && e[1].kind !== 'human';
    out += '<path d="' + path + '" fill="none" stroke="' + col + '" stroke-width="1.4" opacity="' + (dim ? 0.18 : 0.55) + '"' +
      (dim ? ' stroke-dasharray="4 4"' : '') + ' marker-end="url(#ah)"/>';
  });
  svg.setAttribute('viewBox', '0 0 ' + box.width + ' ' + box.height);
  svg.innerHTML = out;
}
window.addEventListener('resize', function () { if (S.screen === 'flow') drawEdges(); });

ACT.flowPresent = function () { FLOW.present = !FLOW.present; $('main').innerHTML = SCREENS.flow.render(FLOW.data); requestAnimationFrame(drawEdges); };
ACT.flowMaster = function (el) {
  var paused = !el.checked;
  if (paused && !confirm('إيقاف كل الأتمتة الآن؟ (موافقتك على الردود تبقى متاحة)')) { el.checked = true; return; }
  act('pauseAll', { paused: paused }, paused ? '⏸ أُوقفت كل الأتمتة' : '▶ استُؤنفت الأتمتة');
};

/* ─── اللوحة الجانبية لعقدة ─── */
ACT.flowNode = function (el) {
  if (FLOW.present) return;
  openSheet('<div class="loading">…</div>');
  api('screen', 'node', { module_key: el.dataset.id }).then(renderNodePanel).catch(function (e) { toast(errMsg(e), true); closeSheet(); });
};

function schedEditor(s) {
  var p = String(s || '').trim(), type = 'manual', hm = '06:00', day = 'SUN';
  var m;
  if (/^\d+\s*m$/i.test(p)) type = p.toLowerCase().replace(/\s/g, '') === '10m' ? '10m' : 'custom';
  else if (/^1h$/i.test(p)) type = '1h';
  else if ((m = p.match(/^daily\s+(\d{1,2}:\d{2})/i))) { type = 'daily'; hm = m[1]; }
  else if ((m = p.match(/^weekly\s+([A-Z]{3})\s+(\d{1,2}:\d{2})/i))) { type = 'weekly'; day = m[1].toUpperCase(); hm = m[2]; }
  var days = [['SUN', 'الأحد'], ['MON', 'الاثنين'], ['TUE', 'الثلاثاء'], ['WED', 'الأربعاء'], ['THU', 'الخميس'], ['FRI', 'الجمعة'], ['SAT', 'السبت']];
  return '<div class="row"><select id="stype" class="grow">' + [['10m', 'كل ١٠ دقائق'], ['1h', 'كل ساعة'], ['daily', 'يومي'], ['weekly', 'أسبوعي'], ['manual', 'يدوي']]
    .map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === type ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
    '<select id="sday" style="width:auto">' + days.map(function (d) { return '<option value="' + d[0] + '"' + (d[0] === day ? ' selected' : '') + '>' + d[1] + '</option>'; }).join('') + '</select>' +
    '<input id="shm" type="text" value="' + esc(hm) + '" style="width:80px" inputmode="numeric"></div>' +
    '<div class="muted small">الحالية: ' + esc(s) + ' — التغيير يعدّل صف Modules فقط، ويبقى الـ Trigger واحداً.</div>';
}

function renderNodePanel(d) {
  var m = d.module;
  var st = m.kind === 'human' ? 'owner' : (m.enabled !== 'مفعّل' ? 'off' : (m.last_status === 'error' ? 'error' : m.last_status === 'deferred' ? 'deferred' : (!m.last_run ? 'never' : 'ok')));
  var html = '<h1>' + esc(m.module_name_ar) + '</h1><div class="chips">' + chip(STATUS_TXT[st], st === 'ok' ? 'good' : st === 'error' ? 'bad' : st === 'owner' ? 'owner' : 'warn') +
    chip(m.kind) + (m.critical === 'نعم' ? chip('حرجة', 'acc') : chip('غير حرجة')) + chip(m.module_key) + '</div>' +
    (m.notes ? '<div class="muted small" style="margin-top:6px">' + esc(m.notes) + '</div>' : '');
  if (d.locked) {
    html += '<div class="card" style="border-color:var(--owner);margin-top:10px"><b style="color:var(--owner)">نقطة التحكم البشري — لا تُعطَّل</b>' +
      '<div class="small">إلغاء المراجعة البشرية يتم فقط بترقية كل جواب على حدة في بنك الأجوبة (٣ اعتمادات متتالية بلا تعديل). ' +
      'ولا يُرسل آلياً أبداً أي رد فيه سعر أو خصم أو تاريخ أو تعهّد.</div></div>';
  } else {
    html += '<div class="card" style="margin-top:10px"><div class="row between"><b>تشغيل / إيقاف</b>' + switchHtml(m.enabled === 'مفعّل', 'nodeEnable', m.module_key) + '</div>' +
      (m.handler ? '<div class="btns"><button class="btn pri" data-act="nodeRun" data-id="' + esc(m.module_key) + '">شغّلها الآن</button></div><div id="runres" class="small"></div>' : '') + '</div>';
    if (m.handler) html += '<div class="card"><b>الجدولة</b>' + schedEditor(m.schedule) +
      '<div class="btns"><button class="btn" data-act="nodeSched" data-id="' + esc(m.module_key) + '">حفظ الجدولة</button></div></div>';
  }
  d.prompts.forEach(function (p, i) {
    html += '<div class="card"><div class="row between"><b>الأوامر: ' + esc(p.title || p.key) + '</b>' + chip('v' + p.version) + '</div>' +
      '<textarea class="mono" id="pr' + i + '" style="min-height:220px">' + esc(p.text) + '</textarea>' +
      '<div class="muted small">متغيّرات متاحة: {{settings.x}} {{options.segment}} {{courses.active}} {{rules.x}}</div>' +
      '<div class="btns"><button class="btn pri" data-act="nodePrompt" data-id="' + esc(p.key) + '" data-i="' + i + '">حفظ نسخة جديدة</button>' +
      (p.versions > 1 ? '<button class="btn" data-act="nodeRollback" data-id="' + esc(p.key) + '">رجوع للنسخة السابقة</button>' : '') + '</div></div>';
  });
  if (d.rules.length) html += '<div class="card"><b>العتبات</b>' + d.rules.map(function (r) {
    return '<label class="f">' + esc(r.description_ar) + ' (' + esc(r.unit) + ')</label><div class="row"><input type="number" step="any" class="grow" id="rl_' + esc(r.rule_key) +
      '" value="' + esc(r.value) + '"><button class="btn sm" data-act="nodeRule" data-id="' + esc(r.rule_key) + '">حفظ</button></div>';
  }).join('') + '</div>';
  if (d.settings.length) html += '<div class="card"><b>إعدادات الوحدة</b>' + d.settings.map(function (s) {
    return '<label class="f">' + esc(s.description || s.key) + ' <code>' + esc(s.key) + '</code></label><div class="row"><input type="text" class="grow" id="st_' + esc(s.key) +
      '" value="' + esc(s.value) + '"><button class="btn sm" data-act="nodeSetting" data-id="' + esc(s.key) + '">حفظ</button></div>';
  }).join('') + '</div>';
  if (d.extra && d.extra.search_terms) html += '<div class="card"><b>مصطلحات البحث (من NewsSources)</b>' + d.extra.search_terms.map(function (t) {
    return '<div class="row between small"><span>' + esc(t.url) + '</span>' + chip(t.enabled) + '</div>';
  }).join('') + '<div class="btns"><button class="btn sm" data-go="news">إضافة مصطلح من شاشة الأخبار</button></div></div>';
  html += '<div class="card"><b>آخر ١٠ عمليات</b>' + (d.logs.length ? d.logs.map(function (l) {
    return '<div class="logrow">' + fmtDate(l.ts, true) + ' · ' + esc(l.action) + ' · <b style="color:var(--' + (l.status === 'error' ? 'bad' : 'muted') + ')">' + esc(l.status) + '</b> · ' +
      esc(l.message) + (l.duration_sec !== '' ? ' · ' + esc(l.duration_sec) + 'ث' : '') + '</div>';
  }).join('') : empty('لا عمليات بعد')) + '</div>';
  openSheet(html);
  var sel = $('stype');
  if (sel) { var upd = function () { $('sday').style.display = sel.value === 'weekly' ? '' : 'none'; $('shm').style.display = /daily|weekly/.test(sel.value) ? '' : 'none'; }; sel.onchange = upd; upd(); }
}

function refreshNode(key) { api('screen', 'node', { module_key: key }).then(renderNodePanel); }
ACT.nodeEnable = function (el) {
  api('action', 'setEnabled', { module_key: el.dataset.id, enabled: el.checked }).then(function (r) {
    toast(r.enabled === 'مفعّل' ? 'فُعّلت' : 'أُوقفت'); refreshFlowBg();
  }).catch(function (e) { el.checked = !el.checked; toast(errMsg(e), true); });
};
ACT.nodeRun = function (el) {
  el.disabled = true; $('runres').textContent = 'تعمل…';
  api('action', 'runNow', { module_key: el.dataset.id }).then(function (r) {
    $('runres').innerHTML = '<div class="quote">' + esc(r.status) + ' · ' + esc(r.items) + ' عنصر · ' + esc(r.duration_sec) + 'ث<br>' + esc(r.message) + '</div>';

ACT.nodeSched = function (el) {

ACT.nodeRollback = function (el) {

  api('action', 'rollbackPrompt', { key: el.dataset.id }).then(function (r) { toast('استُعيدت — v' + r.version); var k = document.querySelector('.sheet h1'); closeSheet(); })

};
ACT.nodeRule = function (el) {
  api('action', 'saveRule', { rule_key: el.dataset.id, value: $('rl_' + el.dataset.id).value }).then(function () { toast('حُفظت العتبة'); })
    .catch(function (e) { toast(errMsg(e), true); });
};
ACT.nodeSetting = function (el) {
  api('action', 'saveSetting', { key: el.dataset.id, value: $('st_' + el.dataset.id).value }).then(function () { toast('حُفظ'); })
    .catch(function (e) { toast(errMsg(e), true); });

function refreshFlowBg() {
  if (S.screen !== 'flow') return;

    FLOW.data = d;

/* ─── تصدير PNG من وضع العرض: رسم مستقل على canvas بنفس المواقع ─── */
ACT.flowPng = function () {
  var root = $('flow'); if (!root) return;
  var box = root.getBoundingClientRect(), scale = 2;
  var cv = document.createElement('canvas');
  cv.width = Math.ceil(box.width * scale); cv.height = Math.ceil(box.height * scale) + 60 * scale;
  var g = cv.getContext('2d'); g.scale(scale, scale);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, box.width, box.height + 60);
  g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#14181f'; g.font = '700 18px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  g.fillText('تدفق نظام التسويق والتشغيل', box.width / 2, 24);
  g.translate(0, 50);
  var img = new Image();
  var svg = $('edges').outerHTML.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg" width="' + box.width + '" height="' + box.height + '"')
    .replace(/var\(--muted\)/g, '#667085');
  img.onload = function () {
    g.drawImage(img, 0, 0);
    root.querySelectorAll('.fstage > h3').forEach(function (h) {
      var r = h.getBoundingClientRect();
      g.fillStyle = '#667085'; g.font = '600 12.5px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      g.fillText(h.textContent, r.left - box.left + r.width / 2, r.top - box.top + r.height / 2);
    });
    root.querySelectorAll('.node').forEach(function (n) {
      var r = n.getBoundingClientRect(), x = r.left - box.left, y = r.top - box.top, own = n.classList.contains('owner');
      g.fillStyle = own ? '#efe7fd' : '#ffffff'; g.strokeStyle = own ? '#6d28d9' : '#0b6e7f'; g.lineWidth = own ? 2.5 : 1.5;
      roundRect(g, x, y, r.width, r.height, 12); g.fill(); g.stroke();
      g.fillStyle = own ? '#6d28d9' : '#14181f'; g.font = (own ? '700 15px' : '600 13.5px') + ' "IBM Plex Sans Arabic", Tahoma, sans-serif';
      g.fillText(n.querySelector('.nm').textContent, x + r.width / 2, y + r.height / 2);
    });
    var url = cv.toDataURL('image/png');
    openSheet('<h1>صورة المخطط</h1><div class="muted small">إن لم يبدأ التنزيل: اضغط مطولاً على الصورة (الجوال) أو زر الفأرة الأيمن ← حفظ.</div>' +
      '<a class="btn pri" download="academy-flow.png" href="' + url + '">تنزيل PNG</a><img src="' + url + '" style="width:100%;margin-top:10px;border-radius:12px;border:1px solid var(--line)">');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

  }).join('') : empty('لا مواعيد بعد — تُجلب يومياً');
  html += '<details class="card"><summary>أضف موعداً يدوياً (مرجّح)</summary><label class="f">الصنف</label><select id="ext">' +
    d.types.map(function (t) { return '<option value="' + esc(t.exam_type_id) + '">' + esc(t.name_ar) + '</option>'; }).join('') + '</select>' +
    '<label class="f">اسم الدورة</label><input type="text" id="exc">' +

    }).join('') + '<label class="f">المصدر (رابط)</label><input type="url" id="exs"><div class="btns"><button class="btn pri" data-act="exAdd">إضافة</button></div></details>';
  html += '<h2>الأصناف</h2>' + d.types.map(function (t) {

      '<label class="f">دورة التهيئة المرتبطة</label><select id="tpc_' + esc(t.exam_type_id) + '"><option value="">—</option>' +
      d.courses.map(function (c) { return '<option value="' + esc(c.course_id) + '"' + (String(c.course_id) === String(t.prep_course_id) ? ' selected' : '') + '>' + esc(c.name_ar) + '</option>'; }).join('') + '</select>' +

  return html;

function kidsOf(d, id) { return d.people.filter(function (p) { return (p.reports_to || '') === id && p.contact_id !== id; }); }
function roots(d) {
  var ids = {}; d.people.forEach(function (p) { ids[p.contact_id] = 1; });
  return d.people.filter(function (p) { return !p.reports_to || !ids[p.reports_to]; }).sort(function (a, b) { return a.level - b.level; });
}
function relColor(r) { var o = ORG.data.relationships.filter(function (x) { return x.value === r; })[0]; return o ? o.description : '#8a94a3'; }
function pnodeHtml(p, top) {
  var kids = kidsOf(ORG.data, p.contact_id);
  var hidden = kids.filter(function (k) { return Number(k.level) >= 3; }).length;
  var folded = ORG.folded[p.contact_id] !== undefined ? ORG.folded[p.contact_id] : hidden > 0;
  return '<button class="pnode' + (top ? ' top' : '') + '" draggable="true" data-pid="' + esc(p.contact_id) + '" data-act="personCard" data-id="' + esc(p.contact_id) + '">' +
    '<span class="st" style="background:' + (STATUS_COLOR[p.status] || '#e0b100') + '"></span>' + pframe(p, false) +
    '<span><span class="nm">' + esc(p.full_name) + '</span><span class="tt">' + esc(p.title_ar) + '</span></span>' +
    '<span class="rel" style="background:' + relColor(p.relationship) + '"></span>' +
    (kids.length ? '<span class="fold" data-act="orgFold" data-id="' + esc(p.contact_id) + '">' + (folded ? '+' + kids.length : '▴') + '</span>' : '') + '</button>';
}
function subtree(p, top) {
  var kids = kidsOf(ORG.data, p.contact_id);
  var hidden = kids.filter(function (k) { return Number(k.level) >= 3; }).length;
  var folded = ORG.folded[p.contact_id] !== undefined ? ORG.folded[p.contact_id] : hidden > 0;
  return '<div class="tn">' + pnodeHtml(p, top) + (kids.length && !folded ? '<div class="kids">' + kids.map(function (k) { return subtree(k, false); }).join('') + '</div>' : '') + '</div>';
}
function orgTree(d) {
  var rs = roots(d), top = rs.filter(function (p) { return Number(p.level) === 1; })[0];
  var covered = {}; d.people.forEach(function (p) { covered[p.department] = 1; });
  var empties = d.departments.filter(function (x) { return x.value !== 'أخرى' && !covered[x.value]; }).map(function (x) {
    return '<div class="tn"><button class="dnode" data-act="orgAdd" data-dept="' + esc(x.value) + '" style="border-color:' + esc(x.description) + '">' + esc(x.value) + '<br>＋ أضف</button></div>';
  }).join('');
  if (top) {
    var others = rs.filter(function (p) { return p !== top; });
    var kids = kidsOf(d, top.contact_id).concat(others);
    return '<div class="tn">' + pnodeHtml(top, true) + '<div class="kids">' + kids.map(function (k) { return subtree(k, false); }).join('') + empties + '</div></div>';

/** شريط الرجوع + السطر التعريفي أعلى كل صفحة */
function pageHead_(screen) {
  var p = PAGE_INFO[screen];
  var back = (S.hist && S.hist.length) ? '<button class="back" data-act="goBack">→ رجوع</button>' : '';
  var intro = p ? '<div class="intro"><b>' + esc(navName_(screen)) + ':</b> ' + esc(p.what) +
    '<details class="small" style="margin-top:4px"><summary>لماذا تهمك؟ وماذا يفعل كل زر؟</summary><div style="margin:4px 0"><b>في التسويق والبيع:</b> ' + esc(p.why) + '</div>' +
    (p.btns || []).map(function (b) { return '<div style="margin:3px 0"><b>[' + esc(b[0]) + ']</b> ' + esc(b[1]) + ' <span class="muted">— ' + esc(b[2]) + '</span></div>'; }).join('') +
    '<a href="#" data-go="info" data-args="' + attr({ focus: screen }) + '">مخطط النظام كاملاً ←</a></details></div>' : '';
  return (back ? '<div class="pagebar">' + back + '</div>' : '') + intro;
}
ACT.goBack = function () {
  var h = S.hist.pop(); if (!h) return;
  S.backing = true; go(h.screen, h.args);
};

/** الاسم الرسمي للصفحة = نفس اسمها في القائمة (مصدر واحد) */
function navName_(k) {
  var all = NAV_MAIN.concat(NAV_MORE);
  for (var i = 0; i < all.length; i++) if (all[i][0] === k) return all[i][1];
  return (PAGE_INFO[k] || {}).t || k;
}

var INFO = { data: null };
SCREENS.info = { render: function (d, args) {
  INFO.data = d;
  var html = north(d.north) + '<h1>' + esc(navName_('info')) + '</h1>' +
    '<div class="card small">المخطط يبيّن رحلة العميل والمال داخل النظام. <b>اضغط أي مربع</b> لترى وظيفة الصفحة وأزرارها، والعوامل الآلية التي تغذيها وحالتها الآن: ' +
    '<span class="fc-dot" style="background:var(--good)"></span>يعمل <span class="fc-dot" style="background:var(--warn)"></span>ينتظر Claude ' +

}, after: function (d, args) {

/** المخطط الانسيابي: كل مرحلة صندوق ملوّن، داخله صفحاتها بالترتيب (→)، وسهم ⬇ إلى المرحلة التالية. كل مربع قابل للضغط */
function infoDraw_() {
  var box = $('infoChart'); if (!box) return;
  var mods = {}; ((INFO.data || {}).modules || []).forEach(function (m) { mods[m.module_key] = m; });
  var health = function (st) {
    var list = st.mods.map(function (k) { return mods[k]; }).filter(Boolean);
    var on = list.filter(function (m) { return m.enabled === 'مفعّل'; });
    var bad = on.filter(function (m) { return m.last_status === 'error'; }).length, wait = on.filter(function (m) { return m.last_status === 'deferred'; }).length;
    return '<span class="fcx-h">' + '<span class="fc-dot" style="background:var(--good)"></span>' + (on.length - bad - wait) +
      (wait ? ' <span class="fc-dot" style="background:var(--warn)"></span>' + wait : '') + (bad ? ' <span class="fc-dot" style="background:var(--bad)"></span>' + bad : '') +
      (list.length - on.length ? ' <span class="fc-dot" style="background:var(--off)"></span>' + (list.length - on.length) : '') + '</span>';
  };
  box.classList.remove('muted');
  box.innerHTML = '<div class="fcx">' + INFO_STAGES.map(function (st, i) {
    return (i ? '<div class="fcx-down" style="color:' + st.c + '">⬇</div>' : '') +
      '<div class="fcx-stage" style="border-color:' + st.c + '"><div class="fcx-t" style="background:' + st.c + '">' + esc(st.t) + health(st) + '</div>' +
      '<div class="fcx-row">' + st.pages.map(function (k, j) {
        return (j ? '<span class="fcx-arr" style="color:' + st.c + '">←</span>' : '') +
          '<button class="fcx-box" style="border-color:' + st.c + '" onclick="infoPick(\'' + k + '\')">' + esc(navName_(k)) + '</button>';
      }).join('') + '</div></div>';
  }).join('') + '</div>';
}

/** تفاصيل صفحة عند الضغط على مربعها */
window.infoPick = function (k) {
  var p = PAGE_INFO[k], d = INFO.data || {}, box = $('infoDetail');
  if (!p || !box) return;
  var mods = {}; (d.modules || []).forEach(function (m) { mods[m.module_key] = m; });
  var st = INFO_STAGES.filter(function (x) { return x.pages.indexOf(k) > -1; })[0] || { mods: [], c: 'var(--accent)' };
  var color = function (m) {
    if (!m) return 'var(--muted)';
    if (m.enabled !== 'مفعّل') return 'var(--off)';
    return { error: 'var(--bad)', deferred: 'var(--warn)' }[m.last_status] || 'var(--good)';
  };
  var state = function (m) {
    if (!m) return '';
    if (m.enabled !== 'مفعّل') return 'متوقفة';
    return { ok: 'تعمل', error: 'خطأ', deferred: 'تنتظر Claude', never: 'لم تعمل بعد', skipped: 'تخطّت' }[m.last_status] || m.last_status;
  };
  box.innerHTML = '<div class="card" style="border-inline-start:6px solid ' + st.c + '"><div class="row between"><b style="font-size:17px">' + esc(navName_(k)) + '</b>' +
    (k !== 'info' && k !== 'operator' && k !== 'lead' ? '<button class="btn sm pri" data-go="' + k + '">افتح الصفحة ←</button>' : '') + '</div>' +
    '<div style="margin:6px 0">' + esc(p.what) + '</div>' +
    '<div class="small" style="margin-bottom:6px"><b>قيمتها في التسويق والبيع:</b> ' + esc(p.why) + '</div>' +
    ((p.btns || []).length ? '<div class="fc-nodes">' + p.btns.map(function (b) {
      return '<div class="fc-node small"><b>[' + esc(b[0]) + ']</b><div>' + esc(b[1]) + '</div><div class="muted">💡 ' + esc(b[2]) + '</div></div>'; }).join('') + '</div>' : '') +
    '<div class="muted small" style="margin:10px 0 4px">العوامل الآلية في هذه المرحلة (' + esc(st.t || '') + '):</div><div class="fc-nodes">' +
    st.mods.map(function (mk) {
      var m = mods[mk];
      return '<div class="fc-node small"><span class="fc-dot" style="background:' + color(m) + '"></span><b>' + esc(m ? m.module_name_ar : mk) + '</b> ' +
        '<span class="muted">(' + esc(state(m)) + (m && m.schedule ? ' · ' + esc(schedAr_(m.schedule)) : '') + ')</span><div>' + esc(MODULE_INFO[mk] || '') + '</div></div>';
    }).join('') + '</div></div>';
  box.scrollIntoView({ behavior: 'smooth', block: 'start' });
};

/* ═══════════ شرح عند الوقوف: فقاعة صفراء تشرح أي زر أو خانة (تُشغَّل/تُطفأ من الإعدادات) ═══════════ */
var TIP_EXTRA = {

  'إلغاء': 'يغلق النموذج بلا حفظ.', 'أرشفة': 'يخفيه من القائمة دون حذفه (يبقى في الشيت).', 'تصدير CSV': 'ينزّل القائمة كملف يُفتح في إكسل.',
  'رجوع': 'يعود للصفحة السابقة.', 'المزيد': 'خيارات إضافية لهذا العنصر.', 'قرأته': 'يعلّم الخبر كمقروء فيخفت لونه.',

  'تطبيق التغييرات الآن': 'يطبّق أي تعديل في الإعدادات فوراً ويكمل الأجزاء الناقصة في النظام.', 'إعادة المحاولة': 'يعيد تحميل الصفحة من النظام.',
  'راجعته': 'يخفي الحساب من مراجعة اليوم حتى الغد.', 'سجّل عرضاً': 'يسجّل عرض منافس رأيته ليدخل مخطط المقارنة.',
  'أرسلت': 'تسجّل أنك أرسلت الرسالة بنفسك — تبدأ المتابعة.', 'تواصلت معه': 'تسجّل تواصلك الفردي مع المدرب.', 'ردّ': 'تسجّل أن الشخص ردّ عليك.',
  'لا تراسل': 'يوقف أي تواصل مع هذا الشخص نهائياً (احترام طلبه).', 'أضف كعميل': 'ينقله إلى قائمة العملاء ليمر بمسار البيع حتى الدفع.',
  'ابحث عنه': 'يفتح بحث Google باسمه وإيميله لتكمل معلوماته بنفسك.', 'واتساب': 'يفتح واتساب والرسالة مكتوبة — ترسلها أنت.',
  'إيميل': 'يفتح بريدك والرسالة مكتوبة — ترسلها أنت.', 'مهم': 'الحساب المهم يظهر لك يومياً في شاشة «اليوم» لمراجعته.',
  'تحديد الظاهرين': 'يحدد كل الأشخاص الظاهرين في القائمة دفعة واحدة.', 'جدول الإرسال الآلي للمحدَّدين': 'يضع المحدَّدين في طابور الإرسال الآلي — يُرسل بالتدريج وبحد يومي لمن وافق فقط.',
  'إلغاء الجدولة': 'يخرجهم من طابور الإرسال الآلي.', 'صورة للرسالة': 'صورة تُرسل مع رسالة واتساب (رأس القالب).',
  'تكرار': 'ينسخ الدفعة بتواريخ جديدة بعد الحالية.', 'ورقة الدورة': 'صفحة كاملة للطباعة أو PDF: تفاصيل الدفعة وجدول الجلسات.',
  'للمُركِّب': 'ينقل الاستعلام إلى المُركِّب لتضيف عليه طبقات تضييق أو توسيع.', 'افتح في Google وسجّل النتائج': 'يفتح البحث في Google ثم نموذج لتسجيل ما وجدته.',
  'تشغيل عبر Claude': 'Claude يبحث ويستخرج النتائج تلقائياً (يحتاج رصيداً).', 'مسح': 'يفرّغ المُركِّب لتبدأ من جديد.'
};
var TIP_FIELDS = [
  [/رابط المصدر/, 'من أين عرفت هذه المعلومة؟ رابط يثبتها (إلزامي للتوثيق).'], [/السعر الأساسي/, 'سعر الدورة المعلن قبل أي خصم.'],
  [/بعد الخصم/, 'السعر بعد الخصم إن وُجد — يظهر في المخطط بنسبة الخصم.'], [/نوع الدورة/, 'يحدد في أي مقارنة يظهر هذا العرض.'],
  [/الاستعلام الأساسي/, 'نقطة البداية للبحث — أضف عليها طبقات للتضييق.'], [/اسم المصدر/, 'اسم يميّز هذه القائمة (معرض، عملاء قدامى…).'],
  [/حالة الموافقة/, 'هل وافق هؤلاء على التواصل؟ الإرسال الآلي فقط لمن «وافق» أو «عميل سابق».'], [/الصق الجدول/, 'انسخ الجدول من إكسل (مع العناوين) والصقه هنا.'],
  [/رمز الوصول|Access Token|رمز المستخدم/, 'مفتاح سري من حساب الأعمال — يُحفظ مخفياً ولا يُعرض بعد الحفظ.'], [/القالب/, 'اسم رسالة الترحيب التي وافق عليها واتساب.'],
  [/البداية/, 'تاريخ أول جلسة.'], [/النهاية/, 'تاريخ آخر جلسة.'], [/المقاعد/, 'عدد المقاعد الحقيقي — يُستخدم في الإلحاح الصادق.'],
  [/أيام الجلسات/, 'أيام الأسبوع التي تُعقد فيها الجلسات — تُحسب منها الجلسات وجدول الورقة.']
];
function tipNorm_(s) { return String(s || '').replace(/[＋➕🔎📥🔄⏱🖼️📄🔁⭐★☆✓✕📷🤖⚡→←\[\]()«»]/g, '').replace(/\s+/g, ' ').trim(); }
var TIP_MAP = null;
function tipMap_() {
  if (TIP_MAP) return TIP_MAP;
  TIP_MAP = {};
  Object.keys(TIP_EXTRA).forEach(function (k) { TIP_MAP[tipNorm_(k)] = TIP_EXTRA[k]; });
  Object.keys(PAGE_INFO).forEach(function (pg) {
    (PAGE_INFO[pg].btns || []).forEach(function (b) {
      tipNorm_(b[0]).split(/\s*\/\s*|\s*\+\s*/).forEach(function (part) { if (part) TIP_MAP[part] = b[1] + ' — ' + b[2]; });
    });
  });
  NAV_MAIN.concat(NAV_MORE).forEach(function (n) { var p = PAGE_INFO[n[0]]; if (p) TIP_MAP[tipNorm_(n[1])] = 'صفحة: ' + p.what; });
  return TIP_MAP;
}
function tipsOn_() { try { return localStorage.getItem('ops_tips') !== '0'; } catch (e) { return true; } }
function tipFor_(el) {
  if (el.dataset && el.dataset.tip) return el.dataset.tip;
  var tag = el.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') {
    var lab = el.closest('label'), prev = el.previousElementSibling;
    var text = (lab && lab.textContent) || (prev && prev.tagName === 'LABEL' && prev.textContent) || el.placeholder || '';
    for (var i = 0; i < TIP_FIELDS.length; i++) if (TIP_FIELDS[i][0].test(text)) return TIP_FIELDS[i][1];
    return text ? 'خانة: ' + tipNorm_(text).slice(0, 60) : '';
  }
  var t = tipNorm_(el.textContent), m = tipMap_();
  if (!t) return el.title || '';
  if (m[t]) return m[t];
  var keys = Object.keys(m);
  for (var j = 0; j < keys.length; j++) if (keys[j].length > 3 && (t.indexOf(keys[j]) === 0 || keys[j].indexOf(t) === 0)) return m[keys[j]];
  return el.title || '';
}
var TIP = { el: null, timer: null };
function tipShow_(target) {
  var txt = tipFor_(target); if (!txt) return;
  var shown = typeof tr === 'function' ? tr(txt) : txt;
  var b = TIP.el || (TIP.el = document.createElement('div'));
  b.className = 'tipbox'; b.textContent = shown; b.dataset.src = txt; document.body.appendChild(b);
  b.style.direction = (typeof i18nOn_ === 'function' && i18nOn_()) ? 'ltr' : 'rtl';
  var r = target.getBoundingClientRect(), bw = Math.min(300, window.innerWidth - 16);
  b.style.maxWidth = bw + 'px';
  var left = Math.max(8, Math.min(window.innerWidth - bw - 8, r.left + r.width / 2 - bw / 2));
  var top = r.bottom + 8 + window.scrollY;
  if (r.bottom + 90 > window.innerHeight) top = r.top + window.scrollY - b.offsetHeight - 8;
  b.style.left = left + 'px'; b.style.top = top + 'px'; b.style.display = 'block';
}
function tipHide_() { clearTimeout(TIP.timer); if (TIP.el) TIP.el.style.display = 'none'; }
var TIP_SEL = 'button, .btn, a.btn, .chip[data-act], input, select, textarea, nav button, [data-go], [data-act], [data-tip]';
document.addEventListener('mouseover', function (e) {
  if (!tipsOn_()) return;
  var t = e.target.closest && e.target.closest(TIP_SEL); if (!t || t === TIP.cur) return;
  TIP.cur = t; tipHide_(); TIP.timer = setTimeout(function () { tipShow_(t); }, 350);
});
document.addEventListener('mouseout', function (e) { var t = e.target.closest && e.target.closest(TIP_SEL); if (t && t === TIP.cur && !t.contains(e.relatedTarget)) { TIP.cur = null; tipHide_(); } });
document.addEventListener('focusin', function (e) { if (tipsOn_() && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) { tipHide_(); tipShow_(e.target); } });
document.addEventListener('focusout', tipHide_);
// الجوال: ضغطة مطوّلة (نصف ثانية) تعرض الشرح
document.addEventListener('touchstart', function (e) {
  if (!tipsOn_()) return; var t = e.target.closest && e.target.closest(TIP_SEL); if (!t) return;
  clearTimeout(TIP.timer); TIP.timer = setTimeout(function () { tipShow_(t); setTimeout(tipHide_, 3500); }, 500);
}, { passive: true });
document.addEventListener('touchend', function () { clearTimeout(TIP.timer); }, { passive: true });
document.addEventListener('scroll', tipHide_, { passive: true });
/** بالإنجليزية: تُترجم كل نصوص الشرح مسبقاً ليظهر أول وقوف مترجماً */
function tipsPrefetch_() {
  if (typeof i18nOn_ !== 'function' || !i18nOn_()) return;
  var all = [];
  Object.keys(TIP_EXTRA).forEach(function (k) { all.push(TIP_EXTRA[k]); });
  TIP_FIELDS.forEach(function (f) { all.push(f[1]); });
  Object.keys(PAGE_INFO).forEach(function (pg) {
    var p = PAGE_INFO[pg]; all.push(p.what, p.why, p.t);
    (p.btns || []).forEach(function (b) { all.push(b[0], b[1], b[2], b[1] + ' — ' + b[2]); });
  });
  Object.keys(MODULE_INFO).forEach(function (k) { all.push(MODULE_INFO[k]); });
  all.forEach(function (t) { if (t && !I18N.dict[t.trim()]) i18nQueue_(t.trim()); });
}
/** وصول ترجمة جديدة أثناء ظهور الفقاعة ← تتحدّث فوراً */
function tipRefresh_() { var b = TIP.el; if (b && b.style.display === 'block' && b.dataset.src) b.textContent = tr(b.dataset.src); }
function tipsToggleHtml_() {
  return '<div class="card row between small"><span>💡 <b>شرح الأزرار والخانات عند الوقوف عليها</b> (فقاعة صفراء — على الجوال: ضغطة مطوّلة)</span>' + switchHtml(tipsOn_(), 'tipsToggle', 'x') + '</div>';
}
ACT.tipsToggle = function (el) { try { localStorage.setItem('ops_tips', el.checked ? '1' : '0'); } catch (e) {} tipHide_(); toast(el.checked ? 'الشرح عند الوقوف: مفعّل' : 'الشرح عند الوقوف: متوقف'); };

/** الجدول الزمني بلغة بسيطة */
function schedAr_(s) {
  s = String(s || '');
  var dayAr = { SUN: 'الأحد', MON: 'الاثنين', TUE: 'الثلاثاء', WED: 'الأربعاء', THU: 'الخميس', FRI: 'الجمعة', SAT: 'السبت' };
  var m;
  if (s === '10m') return 'كل ١٠ دقائق';
  if ((m = s.match(/^(\d+)m$/))) return 'كل ' + m[1] + ' دقيقة';
  if ((m = s.match(/^(\d+)h$/))) return 'كل ' + m[1] + ' ساعة';
  if ((m = s.match(/^daily (\d\d:\d\d)$/))) return 'يومياً ' + m[1];
  if ((m = s.match(/^weekly (\w+) (\d\d:\d\d)$/))) return 'أسبوعياً ' + (dayAr[m[1]] || m[1]) + ' ' + m[2];
  if (s === 'manual') return 'يدوي';
  if (s === 'realtime' || s === 'event') return 'فوري';
  return s;
}
