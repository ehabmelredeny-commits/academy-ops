<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <title>Academy OPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <meta charset="utf-8">
  <meta name="theme-color" content="#0b6e7f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #14181f; --muted: #667085; --line: #e3e6eb; --soft: #f0f2f5;
  --accent: #0b6e7f; --accent-ink: #ffffff; --accent-soft: #e2f1f3;
  --good: #15803d; --good-soft: #e3f5e8; --warn: #b45309; --warn-soft: #fdf1dc;
  --bad: #c62828; --bad-soft: #fde6e6; --orange: #d9580f; --orange-soft: #fde9dc;
  --off: #8a94a3; --off-soft: #eceef1; --owner: #6d28d9; --owner-soft: #efe7fd;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --card: #171b21; --ink: #e8ebef; --muted: #9aa4b2; --line: #2a303a; --soft: #1e232b;
    --accent: #3fb6c8; --accent-ink: #081418; --accent-soft: #123138;
    --good: #4ade80; --good-soft: #13301f; --warn: #f5b454; --warn-soft: #3a2a10;
    --bad: #f87171; --bad-soft: #3a1616; --orange: #fb923c; --orange-soft: #3a2110;
    --off: #7c8696; --off-soft: #22272f; --owner: #b48cff; --owner-soft: #2a1d47;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body { font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; font-size: 15px; line-height: 1.6;
  -webkit-text-size-adjust: 100%; overflow-x: hidden; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { display: flex; min-height: 100vh; }
main { flex: 1; min-width: 0; padding: 12px 16px calc(var(--nav-h) + 24px); max-width: 1100px; margin: 0 auto; width: 100%; }

/* ─── التنقل: شريط سفلي على الجوال، جانبي على الكومبيوتر ─── */
nav.bottom { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--card);
  border-top: 1px solid var(--line); display: flex; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
nav.bottom button { flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font-size: 11.5px; color: var(--muted); cursor: pointer; position: relative; min-width: 0; }
nav.bottom button.on { color: var(--accent); font-weight: 600; }
nav.bottom svg { width: 22px; height: 22px; }
.dot { position: absolute; top: 8px; inset-inline-end: calc(50% - 20px); min-width: 17px; height: 17px; border-radius: 9px;
  background: var(--bad); color: #fff; font-size: 10.5px; line-height: 17px; padding: 0 4px; text-align: center; }
nav.side { display: none; }
@media (min-width: 900px) {
  nav.bottom { display: none; }
  nav.side { display: block; width: 220px; flex-shrink: 0; background: var(--card); border-inline-start: 1px solid var(--line);
    padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav.side .brand { font-weight: 700; padding: 4px 10px 14px; }
  nav.side button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: start; background: none; border: 0;
    padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--ink); position: relative; }
  nav.side button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav.side .dot { position: static; margin-inline-start: auto; }
  main { padding-bottom: 32px; }
}

/* ─── المؤشر الشمالي ─── */
.north { background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.north .n { font-size: 34px; font-weight: 700; line-height: 1; }
.north .l { font-size: 13px; opacity: .92; }
.north .side-stats { font-size: 12.5px; text-align: end; opacity: .92; }

h1 { font-size: 20px; margin: 4px 0 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h2 { font-size: 15.5px; margin: 18px 0 8px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
  margin-bottom: 10px; box-shadow: var(--shadow); overflow-wrap: anywhere; }
.card.click { cursor: pointer; }
.card.click:active { transform: scale(.995); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12.5px; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px;
  background: var(--soft); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.owner { background: var(--owner-soft); color: var(--owner); border-color: transparent; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; flex: 1; min-width: 120px; }
.stat .v { font-size: 22px; font-weight: 700; }
.stat .k { font-size: 12px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--card); padding: 9px 14px; border-radius: 11px; cursor: pointer;
  font-weight: 500; min-height: 40px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { background: var(--good); color: #fff; border-color: var(--good); }
.btn.bad { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 5px 10px; min-height: 32px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btns .btn { flex: 1 1 auto; }

input[type=text], input[type=number], input[type=date], input[type=url], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 9px 11px; }
textarea { min-height: 150px; resize: vertical; line-height: 1.7; }
textarea.mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; direction: auto; }
label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 10px 0 4px; }
.quote { background: var(--soft); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; }
.toast { position: fixed; bottom: calc(var(--nav-h) + 14px); left: 16px; right: 16px; margin: auto; max-width: 480px;
  background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 12px; z-index: 60; text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast.err { background: var(--bad); color: #fff; }
.loading { text-align: center; padding: 40px; color: var(--muted); }
.newbadge { background: var(--bad); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; border: 0; }
details > summary { cursor: pointer; color: var(--accent); margin: 6px 0; }
.bar { height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
.kv b { color: var(--muted); font-weight: 500; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; display: flex; justify-content: flex-start; }
.sheet .panel { background: var(--bg); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 14px 16px 90px;
  box-shadow: 0 0 30px rgba(0,0,0,.2); }
.sheet .close { position: sticky; top: 0; float: left; }
.switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--off); border-radius: 26px; transition: .2s; cursor: pointer; }
.switch span:before { content: ''; position: absolute; width: 20px; height: 20px; inset-inline-start: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span:before { transform: translateX(-20px); }
.switch input:disabled + span { opacity: .5; cursor: default; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
.tabs button { white-space: nowrap; }
.kanban { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 900px) { .kanban { grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); overflow-x: auto; } }
.kcol { background: var(--soft); border-radius: 12px; padding: 8px; min-height: 60px; }
.kcol h3 { font-size: 13px; margin: 2px 4px 8px; display: flex; justify-content: space-between; }
.kcol.drop { outline: 2px dashed var(--accent); }
</style>

</head>
<body>
<script>
  var EXEC_URL = "https://script.google.com/macros/s/AKfycbxi0KbhfDt4Uu7CNd19KlJ6F84vUJY9SEhbyA2Qggz_Ic5X-SGdeSUKzOD7dGVDpya2/exec";
  var CLAUDE_GET = ['runNow', 'postGenerate', 'angleRegen', 'kwUpload'];
  (function () {
    var m = /[#&]k=([\w-]+)/.exec(location.hash);
    if (m) { try { localStorage.setItem('ops_k', m[1]); } catch (e) {} history.replaceState(null, '', location.pathname + location.search); }
  })();
  function opsKey_() { try { return localStorage.getItem('ops_k') || ''; } catch (e) { return ''; } }
  var google = { script: {} };
  Object.defineProperty(google.script, 'run', { get: function () {
    var r = { s: null, f: null };
    r.withSuccessHandler = function (x) { r.s = x; return r; };
    r.withFailureHandler = function (x) { r.f = x; return r; };
    function done(p) {
      p.then(function (res) { return res.json(); })
        .then(function (j) { if (j && j.ok) r.s && r.s(j.data); else r.f && r.f(new Error((j && j.error) || 'خطأ')); })
        .catch(function (e) { r.f && r.f(new Error('تعذّر الاتصال بالنظام — تحقق من الإنترنت')); });
    }
    function viaGet(fn, name, args) {
      var a = Object.assign({}, args || {}); delete a.__k;
      done(fetch(EXEC_URL + '?api=1&fn=' + fn + '&name=' + encodeURIComponent(name) + '&k=' + encodeURIComponent(opsKey_()) +
        '&args=' + encodeURIComponent(JSON.stringify(a))));
    }
    r.apiScreen = function (name, args) { viaGet('screen', name, args); };
    r.apiAction = function (name, args) {
      if (CLAUDE_GET.indexOf(name) > -1) return viaGet('action', name, args);
      var a = Object.assign({}, args || {}); delete a.__k;
      done(fetch(EXEC_URL + '?api=1', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ name: name, args: a, k: opsKey_() }) }));
    };
    return r;
  } });
</script>
<script>
  if (!opsKey_()) document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('main').innerHTML = '<div class="card" style="margin:40px auto;max-width:480px"><b>افتح رابطك الخاص مرة واحدة</b>' +
      '<div class="muted small">الرابط الذي وصلك بالبريد (ينتهي بـ #k=...). بعدها يتذكّرك هذا المتصفح.</div></div>';
  });
</script>
  <div class="wrap">
    <nav class="side" id="side"></nav>
    <main id="main"><div class="loading">…</div></main>
  </div>
  <nav class="bottom" id="bottom"></nav>
  <div id="toast"></div>
  <script>
    var START_SCREEN = (new URLSearchParams(location.search).get('s') || 'today');
    var POLL_SECONDS = 60;
    var UI_KEY = '';
  </script>
  <script>
/* ═══════════ الإطار: الاستدعاء، التنقل، الأدوات ═══════════ */
var S = { screen: null, args: {}, data: null, sig: null, fresh: false, pollTimer: null };
var SCREENS = {};   // name → { title, render(data, args) }
var ACT = {};       // data-act="name" → function(el)

var ICON = {
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  reply: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  post: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12h8M12 8v8"/></svg>',
  flow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h6a3 3 0 0 1 3 3v6"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>'
};
var NAV_MAIN = [['today', 'اليوم', 'today'], ['reply', 'الرد', 'reply'], ['dailyPost', 'منشور اليوم', 'post'], ['flow', 'المخطط', 'flow'], ['more', 'المزيد', 'more']];
var NAV_MORE = [['targets', 'الأهداف'], ['radar', 'الرادار'], ['discovery', 'الاكتشافات'], ['news', 'الأخبار'], ['modules', 'الوحدات'],
  ['campaigns', 'الحملات'], ['content', 'المحتوى'], ['b2b', 'B2B'], ['alumni', 'الخرّيجون'], ['kpis', 'المؤشرات'],
  ['keywords', 'الكلمات'], ['courses', 'الدورات'], ['settings', 'الإعدادات']];

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function attr(o) { return esc(JSON.stringify(o)); }
function $(id) { return document.getElementById(id); }

function api(kind, name, args) {
  return new Promise(function (resolve, reject) {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); })
      [kind === 'screen' ? 'apiScreen' : 'apiAction'](name, Object.assign({}, args || {}, { __k: UI_KEY }));
  });
}

function toast(msg, err) {
  var t = $('toast');
  t.innerHTML = '<div class="toast' + (err ? ' err' : '') + '">' + esc(msg) + '</div>';
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { t.innerHTML = ''; }, err ? 6000 : 3000);
}
function errMsg(e) { return (e && e.message) ? e.message.replace(/^Exception:\s*/, '') : String(e); }

/** تنفيذ إجراء ثم إعادة تحميل الشاشة */
function act(name, args, okMsg, reload) {
  return api('action', name, args).then(function (r) {
    if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg);
    if (reload !== false) go(S.screen, S.args, true);
    return r;
  }).catch(function (e) { toast(errMsg(e), true); throw e; });
}

function go(screen, args, keepScroll) {
  if (screen === 'more') { renderMore(); return; }
  S.screen = screen; S.args = args || {};
  renderNav();
  var y = window.scrollY;
  var ck = cacheKey_(screen, S.args), token = S.token = (S.token || 0) + 1;
  var draw = function (data, stale) {
    if (token !== S.token) return; // المستخدم انتقل لشاشة أخرى
    var typing = document.activeElement && /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
    if (!stale && S.shownStale && typing) return; // لا نمسح ما يكتبه المستخدم فوق النسخة المحفوظة
    S.data = data; S.fresh = false;
    var sc = SCREENS[screen], sy = window.scrollY;
    $('main').innerHTML = sc.render(data, S.args) + (stale ? '<div class="muted small" id="staleNote" style="text-align:center">يتحدّث…</div>' : '');
    if (sc.after) sc.after(data, S.args);
    if (stale || !S.shownStale) window.scrollTo(0, keepScroll ? y : 0); else window.scrollTo(0, sy);
    if (data && data.poll) S.sig = data.poll.sig;
  };
  // عرض فوري من آخر نسخة محفوظة، ثم التحديث من النظام (ثوانٍ في Google)
  var cached = keepScroll ? null : cacheGet_(ck); // بعد إجراء: لا نعرض نسخة قديمة قبل التغيير
  S.shownStale = false;
  if (cached) { draw(cached, true); S.shownStale = true; }
  else if (!keepScroll) $('main').innerHTML = '<div class="loading">جارٍ التحميل…</div>';
  api('screen', screen, S.args).then(function (data) {
    cachePut_(ck, data);
    draw(data, false);
  }).catch(function (e) {
    if (token !== S.token) return;
    if (cached) { var n = $('staleNote'); if (n) n.textContent = 'تعذّر التحديث — تعرض آخر نسخة محفوظة'; return; }
    $('main').innerHTML = '<div class="card"><b>تعذّر التحميل</b><div class="muted">' + esc(errMsg(e)) + '</div>' +
      '<div class="btns"><button class="btn" data-go="' + esc(screen) + '">إعادة المحاولة</button></div></div>';
  });
}

/* نسخة محلية من كل شاشة (في هذا المتصفح فقط) لفتح فوري */
function cacheKey_(screen, args) { return 'ops_scr_' + screen + '_' + JSON.stringify(args || {}); }
function cacheGet_(k) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
function cachePut_(k, data) {
  try { localStorage.setItem(k, JSON.stringify(data)); }
  catch (e) { try { Object.keys(localStorage).forEach(function (x) { if (x.indexOf('ops_scr_') === 0) localStorage.removeItem(x); }); } catch (e2) {} }
}
/** تجهيز الشاشات الرئيسية في الخلفية بعد أول فتح */
function prefetch_() {
  // واحدة بعد الأخرى (لا طلبات متزامنة تزاحم الشاشة المفتوحة)
  var list = ['today', 'reply', 'dailyPost', 'targets'];
  (function next(i) {
    if (i >= list.length) return;
    var s = list[i];
    if (S.screen === s || cacheGet_(cacheKey_(s, {}))) return next(i + 1);
    api('screen', s, {}).then(function (d) { cachePut_(cacheKey_(s, {}), d); }).catch(function () {})
      .then(function () { setTimeout(function () { next(i + 1); }, 800); });
  })(0);
}

var BADGES = {};
function renderNav() {
  var cur = S.screen;
  var inMore = NAV_MORE.some(function (x) { return x[0] === cur; });
  $('bottom').innerHTML = NAV_MAIN.map(function (n) {
    var on = n[0] === cur || (n[0] === 'more' && inMore);
    var b = BADGES[n[0]] ? '<span class="dot">' + BADGES[n[0]] + '</span>' : '';
    return '<button class="' + (on ? 'on' : '') + '" data-go="' + n[0] + '">' + ICON[n[2]] + '<span>' + n[1] + '</span>' + b + '</button>';
  }).join('');
  $('side').innerHTML = '<div class="brand">Academy OPS</div>' + NAV_MAIN.filter(function (n) { return n[0] !== 'more'; })
    .concat(NAV_MORE).map(function (n) {
      var b = BADGES[n[0]] ? '<span class="dot">' + BADGES[n[0]] + '</span>' : '';
      return '<button class="' + (n[0] === cur ? 'on' : '') + '" data-go="' + n[0] + '">' + n[1] + b + '</button>';
    }).join('');
}

function renderMore() {
  S.screen = 'more'; renderNav();
  $('main').innerHTML = '<h1>المزيد</h1><div class="grid2">' + NAV_MORE.map(function (n) {
    return '<div class="card click" data-go="' + n[0] + '"><b>' + n[1] + '</b></div>';
  }).join('') + '</div>';
}

/* ─── أدوات العرض ─── */
function fmtDate(iso, withTime) {
  if (!iso) return '—';
  var d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  var o = { day: 'numeric', month: 'short', timeZone: 'Asia/Riyadh' };
  if (withTime) { o.hour = '2-digit'; o.minute = '2-digit'; }
  return d.toLocaleString('ar-SA-u-nu-latn', o);
}
function ago(min) {
  min = Number(min) || 0;
  if (min < 60) return min + ' د';
  if (min < 1440) return Math.round(min / 60) + ' س';
  return Math.round(min / 1440) + ' ي';
}
function chip(text, cls) { return text === '' || text === null || text === undefined ? '' : '<span class="chip ' + (cls || '') + '">' + esc(text) + '</span>'; }
function north(n) {
  if (!n) return '';
  return '<div class="north"><div><div class="l">التسجيلات المدفوعة هذا الأسبوع</div><div class="n">' + esc(n.enrolled_paid_week) + '</div></div>' +
    '<div class="side-stats">عملاء جدد: ' + esc(n.leads_week) + '<br>الإيراد: ' + esc(Number(n.revenue_week || 0).toLocaleString('en')) + ' ر.س</div></div>' +
    (n.claude_ready === false ? '<div class="card small" style="border-color:var(--warn);margin-top:-6px">⏸ <b>الميزات الذكية متوقفة مؤقتاً</b> — ' +
      (n.claude_reason === 'nokey' ? 'لا يوجد رصيد/مفتاح Claude بعد (مؤجّل للإطلاق الرسمي).' : esc(n.claude_reason)) +
      ' تتوقف: الردود المقترحة، المنشور التلقائي، الرادار، الأخبار، الاكتشافات. كل الإدخال اليدوي يعمل.</div>' : '');
}
function empty(t) { return '<div class="empty">' + esc(t) + '</div>'; }
function section(title, items, fn, emptyText) {
  return '<h2>' + esc(title) + ' ' + chip(items.length) + '</h2>' + (items.length ? items.map(fn).join('') : (emptyText ? empty(emptyText) : ''));
}
function switchHtml(checked, dataAct, dataId, disabled) {
  return '<label class="switch"><input type="checkbox" ' + (checked ? 'checked ' : '') + (disabled ? 'disabled ' : '') +
    'data-act="' + dataAct + '" data-id="' + esc(dataId) + '"><span></span></label>';
}
function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function () { toast('نُسخ النص'); }, fallback);
  } catch (e) { }
  fallback();
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('نُسخ النص'); } catch (e) { toast('انسخ يدوياً: حدّد النص', true); }
    document.body.removeChild(ta);
  }
}
function openSheet(html) {
  var d = document.createElement('div');
  d.className = 'sheet'; d.id = 'sheet';
  d.innerHTML = '<div class="panel"><button class="btn sm close" data-act="closeSheet">✕</button>' + html + '</div>';
  d.addEventListener('click', function (e) { if (e.target === d) closeSheet(); });
  closeSheet(); document.body.appendChild(d);
}
function closeSheet() { var s = $('sheet'); if (s) s.remove(); }
ACT.closeSheet = closeSheet;

/* ─── النقر: data-go للتنقل، data-act للإجراءات ─── */
document.addEventListener('click', function (e) {
  var g = e.target.closest('[data-go]');
  if (g) { e.preventDefault(); closeSheet(); go(g.getAttribute('data-go'), g.dataset.args ? JSON.parse(g.dataset.args) : {}); return; }
  var a = e.target.closest('[data-act]');
  if (a && a.tagName !== 'INPUT' && a.tagName !== 'SELECT') {
    e.preventDefault();
    var f = ACT[a.getAttribute('data-act')];
    if (f) f(a);
  }
});
document.addEventListener('change', function (e) {
  var a = e.target.closest('[data-act]');
  if (a && (a.tagName === 'INPUT' || a.tagName === 'SELECT')) { var f = ACT[a.getAttribute('data-act')]; if (f) f(a); }
});

/* ─── التحديث الحي: استدعاء خفيف كل ٦٠ ثانية، شارة «جديد» بدل إعادة التحميل ─── */
function poll() {
  if (document.hidden) return;
  api('action', 'poll').then(function (p) {
    BADGES.reply = (p.awaiting + p.escalated) || '';
    BADGES.today = p.failed || '';
    renderNav();
    if (S.sig && p.sig !== S.sig && (S.screen === 'today' || S.screen === 'reply') && !S.fresh) {
      S.fresh = true;
      var h = document.querySelector('#main h1');
      if (h && !$('newb')) h.insertAdjacentHTML('beforeend', '<button id="newb" class="newbadge" data-act="reload">جديد</button>');
    }
  }).catch(function () { });
}
ACT.reload = function () { go(S.screen, S.args); };

function sendPanel(m, l, outbound) {
  var text = m.final_text || m.draft || '';
  var phone = String(l.phone || '').replace(/[^\d]/g, '');
  var email = l.email || (/@/.test(m.sender_contact) ? m.sender_contact : '');
  return '<div class="card" style="border-color:var(--good)"><b>' + (outbound ? 'معتمد — سيُرسل آلياً' : 'معتمد — أرسله بنفسك ثم اضغط «أرسلتها»') + '</b>' +
    '<div class="quote" id="ftext">' + esc(text) + '</div><div class="btns">' +
    '<button class="btn" data-act="copy">نسخ النص</button>' +
    (phone ? '<a class="btn" target="_blank" href="https://wa.me/' + esc(phone) + '?text=' + encodeURIComponent(text) + '">فتح واتساب</a>' : '') +
    (email ? '<a class="btn" target="_blank" href="mailto:' + esc(email) + '?subject=' + encodeURIComponent('رد: ' + (m.subject || '')) + '&body=' + encodeURIComponent(text) + '">فتح البريد</a>' : '') +
    '<button class="btn good" data-act="markSent" data-id="' + esc(m.msg_id) + '">أرسلتها ✓</button></div></div>';
}

function postMediaUpload_(input, ids) {

  <style>

<script>
/* ═══════════ المخطط — لوحة التحكم الرئيسية (٤.٨) ═══════════ */
var FLOW = { present: false, data: null };
var STATUS_TXT = { ok: 'تعمل', off: 'معطّلة', error: 'فشل آخر تشغيل', never: 'لم تُشغَّل بعد', deferred: 'مؤجّلة (الحصة)', owner: 'نقطة التحكم البشري' };

SCREENS.flow = {
  render: function (d) {
    FLOW.data = d;
    var u = d.usage, c = d.claude;
    var qCls = u.pct >= 70 ? 'bad' : (u.pct >= 60 ? 'warn' : '');
    var cPct = c.budget ? Math.round(c.spent / c.budget * 100) : 0;
    var html = '<div id="flowroot" class="' + (FLOW.present ? 'present' : '') + '">' + north(d.north) +
      '<h1>المخطط <span class="ctl row" style="margin-inline-start:auto;gap:6px">' +
      '<button class="btn sm" data-act="flowPresent">' + (FLOW.present ? 'خروج من العرض' : 'عرض للاجتماع') + '</button>' +
      '</span>' + (FLOW.present ? '<button class="btn sm" data-act="flowPresent">خروج</button> <button class="btn sm pri" data-act="flowPng">تصدير PNG</button>' : '') + '</h1>' +
      '<div class="qbar">' +
      '<div><div class="lab"><span>تشغيل اليوم: ' + Math.round(u.sec / 60 * 10) / 10 + ' من ' + u.quota_min + ' دقيقة</span><span>' + u.pct + '%</span></div>' +
      '<div class="bar ' + qCls + '"><i style="width:' + Math.min(100, u.pct) + '%"></i></div>' +
      '<div class="lab"><span>الـ tick الخامل: ' + u.idle_avg_sec + ' ث</span><span>ticks: ' + u.ticks + '</span></div></div>' +
      '<div><div class="lab"><span>Claude اليوم: ' + c.spent + '$ من ' + c.budget + '$</span><span>' + cPct + '%</span></div>' +
      '<div class="bar ' + (cPct >= 100 ? 'bad' : cPct >= 70 ? 'warn' : '') + '"><i style="width:' + Math.min(100, cPct) + '%"></i></div></div>' +
      '<div class="master ' + (d.paused ? 'paused' : '') + '"><b>' + (d.paused ? '⏸ الأتمتة موقوفة' : 'كل الأتمتة تعمل') + '</b>' +
      switchHtml(!d.paused, 'flowMaster', 'all') + '</div></div>' +
      (d.raise_tick_hint ? '<div class="card small" style="border-color:var(--warn)">الاستهلاك تجاوز ٦٠٪ — ارفع tick_minutes إلى 15 من <a href="#" data-go="settings">الإعدادات</a>.</div>' : '') +
      (u.pct >= 70 ? '<div class="card small" style="border-color:var(--bad)">تجاوز ٧٠٪: الوحدات غير الحرجة مؤجّلة لليوم التالي.</div>' : '') +
      '<div class="legend">' + [['ok', 'var(--good)'], ['off', 'var(--off)'], ['error', 'var(--bad)'], ['never', '#e0b100'], ['deferred', 'var(--orange)'], ['owner', 'var(--owner)']]
        .map(function (x) { return '<span><i style="background:' + x[1] + '"></i>' + STATUS_TXT[x[0]] + '</span>'; }).join('') + '</div>' +
      '<div class="flow" id="flow"><svg class="edges" id="edges"></svg>' + d.groups.map(function (g) {
        return '<div class="fstage"><h3>' + esc(g.stage) + '</h3><div class="fnodes">' + g.nodes.map(nodeHtml).join('') + '</div></div>';
      }).join('') + '</div></div>';
    return html;
  },
  after: function () { requestAnimationFrame(drawEdges); }
};

function nodeHtml(n) {
  var sub = n.kind === 'human' ? 'كل رد غير مُرقّى يمر من هنا' :
    (n.last_run ? fmtDate(n.last_run, true) + ' · ' + (n.last_items || 0) + ' عنصر' : (n.phase1 ? 'المرحلة الأولى' : 'لم تُشغَّل')) +
    (n.schedule && n.kind !== 'human' ? ' · ' + esc(n.schedule) : '');
  return '<button class="node ' + n.status + '" data-node="' + esc(n.key) + '" data-act="flowNode" data-id="' + esc(n.key) + '">' +
    '<span class="nm">' + esc(n.name) + '</span><span class="sub">' + sub + '</span>' +
    (n.badges.length ? '<span class="bd">' + n.badges.map(function (b) { return '<span>' + esc(b.name) + '</span>'; }).join('') + '</span>' : '') + '</button>';
}

/** الأسهم: المصادر → أول عقدة في الاستقبال، ثم سلسلة داخل كل مرحلة، ثم آخر المرحلة → أول التالية */
function drawEdges() {
  var root = $('flow'), svg = $('edges');
  if (!root || !svg || !FLOW.data) return;
  var box = root.getBoundingClientRect();
  var horiz = window.innerWidth >= 900;
  var groups = FLOW.data.groups;
  var edges = [];
  groups.forEach(function (g, i) {
    var next = groups[i + 1];
    if (i === 0 && next) g.nodes.forEach(function (n) { edges.push([n, next.nodes[0]]); });
    else {
      for (var k = 0; k + 1 < g.nodes.length; k++) edges.push([g.nodes[k], g.nodes[k + 1]]);
      if (next) edges.push([g.nodes[g.nodes.length - 1], next.nodes[0]]);
    }
  });
  var rect = function (key) {
    var el = root.querySelector('[data-node="' + key + '"]');
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return { l: r.left - box.left, r: r.right - box.left, t: r.top - box.top, b: r.bottom - box.top, cx: (r.left + r.right) / 2 - box.left, cy: (r.top + r.bottom) / 2 - box.top };
  };
  var col = getComputedStyle(document.documentElement).getPropertyValue('--muted') || '#888';
  var out = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="' + col + '"/></marker></defs>';
  edges.forEach(function (e) {
    var a = rect(e[0].key), b = rect(e[1].key);
    if (!a || !b) return;
    var sameCol = Math.abs(a.cx - b.cx) < 30;
    var x1, y1, x2, y2, path;
    if (horiz && !sameCol) {           // RTL: من اليمين إلى اليسار
      x1 = a.l; y1 = a.cy; x2 = b.r; y2 = b.cy;
      var mx = (x1 + x2) / 2;
      path = 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2;
    } else {                           // عمودياً: من الأسفل إلى الأعلى التالي
      x1 = a.cx; y1 = a.b; x2 = b.cx; y2 = b.t;
      if (y2 < y1) { y1 = a.cy; x1 = a.l; x2 = b.r; y2 = b.cy; }
      var my = (y1 + y2) / 2;
      path = 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + y2;
    }
    var dim = !e[1].enabled && e[1].kind !== 'human';
    out += '<path d="' + path + '" fill="none" stroke="' + col + '" stroke-width="1.4" opacity="' + (dim ? 0.18 : 0.55) + '"' +
      (dim ? ' stroke-dasharray="4 4"' : '') + ' marker-end="url(#ah)"/>';
  });
  svg.setAttribute('viewBox', '0 0 ' + box.width + ' ' + box.height);
  svg.innerHTML = out;
}
window.addEventListener('resize', function () { if (S.screen === 'flow') drawEdges(); });

ACT.flowPresent = function () { FLOW.present = !FLOW.present; $('main').innerHTML = SCREENS.flow.render(FLOW.data); requestAnimationFrame(drawEdges); };
ACT.flowMaster = function (el) {
  var paused = !el.checked;
  if (paused && !confirm('إيقاف كل الأتمتة الآن؟ (موافقتك على الردود تبقى متاحة)')) { el.checked = true; return; }
  act('pauseAll', { paused: paused }, paused ? '⏸ أُوقفت كل الأتمتة' : '▶ استُؤنفت الأتمتة');
};

/* ─── اللوحة الجانبية لعقدة ─── */
ACT.flowNode = function (el) {
  if (FLOW.present) return;
  openSheet('<div class="loading">…</div>');
  api('screen', 'node', { module_key: el.dataset.id }).then(renderNodePanel).catch(function (e) { toast(errMsg(e), true); closeSheet(); });
};

function schedEditor(s) {
  var p = String(s || '').trim(), type = 'manual', hm = '06:00', day = 'SUN';
  var m;
  if (/^\d+\s*m$/i.test(p)) type = p.toLowerCase().replace(/\s/g, '') === '10m' ? '10m' : 'custom';
  else if (/^1h$/i.test(p)) type = '1h';
  else if ((m = p.match(/^daily\s+(\d{1,2}:\d{2})/i))) { type = 'daily'; hm = m[1]; }
  else if ((m = p.match(/^weekly\s+([A-Z]{3})\s+(\d{1,2}:\d{2})/i))) { type = 'weekly'; day = m[1].toUpperCase(); hm = m[2]; }
  var days = [['SUN', 'الأحد'], ['MON', 'الاثنين'], ['TUE', 'الثلاثاء'], ['WED', 'الأربعاء'], ['THU', 'الخميس'], ['FRI', 'الجمعة'], ['SAT', 'السبت']];
  return '<div class="row"><select id="stype" class="grow">' + [['10m', 'كل ١٠ دقائق'], ['1h', 'كل ساعة'], ['daily', 'يومي'], ['weekly', 'أسبوعي'], ['manual', 'يدوي']]
    .map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === type ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
    '<select id="sday" style="width:auto">' + days.map(function (d) { return '<option value="' + d[0] + '"' + (d[0] === day ? ' selected' : '') + '>' + d[1] + '</option>'; }).join('') + '</select>' +
    '<input id="shm" type="text" value="' + esc(hm) + '" style="width:80px" inputmode="numeric"></div>' +
    '<div class="muted small">الحالية: ' + esc(s) + ' — التغيير يعدّل صف Modules فقط، ويبقى الـ Trigger واحداً.</div>';
}

function renderNodePanel(d) {
  var m = d.module;
  var st = m.kind === 'human' ? 'owner' : (m.enabled !== 'مفعّل' ? 'off' : (m.last_status === 'error' ? 'error' : m.last_status === 'deferred' ? 'deferred' : (!m.last_run ? 'never' : 'ok')));
  var html = '<h1>' + esc(m.module_name_ar) + '</h1><div class="chips">' + chip(STATUS_TXT[st], st === 'ok' ? 'good' : st === 'error' ? 'bad' : st === 'owner' ? 'owner' : 'warn') +
    chip(m.kind) + (m.critical === 'نعم' ? chip('حرجة', 'acc') : chip('غير حرجة')) + chip(m.module_key) + '</div>' +

/* ─── تصدير PNG من وضع العرض: رسم مستقل على canvas بنفس المواقع ─── */
ACT.flowPng = function () {
  var root = $('flow'); if (!root) return;
  var box = root.getBoundingClientRect(), scale = 2;
  var cv = document.createElement('canvas');
  cv.width = Math.ceil(box.width * scale); cv.height = Math.ceil(box.height * scale) + 60 * scale;
  var g = cv.getContext('2d'); g.scale(scale, scale);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, box.width, box.height + 60);
  g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#14181f'; g.font = '700 18px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  g.fillText('تدفق نظام التسويق والتشغيل', box.width / 2, 24);
  g.translate(0, 50);
  var img = new Image();
  var svg = $('edges').outerHTML.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg" width="' + box.width + '" height="' + box.height + '"')
    .replace(/var\(--muted\)/g, '#667085');
  img.onload = function () {
    g.drawImage(img, 0, 0);
    root.querySelectorAll('.fstage > h3').forEach(function (h) {
      var r = h.getBoundingClientRect();
      g.fillStyle = '#667085'; g.font = '600 12.5px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      g.fillText(h.textContent, r.left - box.left + r.width / 2, r.top - box.top + r.height / 2);
    });
    root.querySelectorAll('.node').forEach(function (n) {
      var r = n.getBoundingClientRect(), x = r.left - box.left, y = r.top - box.top, own = n.classList.contains('owner');
      g.fillStyle = own ? '#efe7fd' : '#ffffff'; g.strokeStyle = own ? '#6d28d9' : '#0b6e7f'; g.lineWidth = own ? 2.5 : 1.5;
      roundRect(g, x, y, r.width, r.height, 12); g.fill(); g.stroke();
      g.fillStyle = own ? '#6d28d9' : '#14181f'; g.font = (own ? '700 15px' : '600 13.5px') + ' "IBM Plex Sans Arabic", Tahoma, sans-serif';
      g.fillText(n.querySelector('.nm').textContent, x + r.width / 2, y + r.height / 2);
    });
    var url = cv.toDataURL('image/png');
    openSheet('<h1>صورة المخطط</h1><div class="muted small">إن لم يبدأ التنزيل: اضغط مطولاً على الصورة (الجوال) أو زر الفأرة الأيمن ← حفظ.</div>' +
      '<a class="btn pri" download="academy-flow.png" href="' + url + '">تنزيل PNG</a><img src="' + url + '" style="width:100%;margin-top:10px;border-radius:12px;border:1px solid var(--line)">');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

    '<label class="f">علاقتك به</label><select id="pe_rel">' + opt(ORG.data.relationships.map(function (x) { return x.value; }), p.relationship) + '</select>' +
    '<label class="f">من يوصلك إليه</label><input type="text" id="pe_i" value="' + esc(p.intro_path) + '">' +
    '<label class="f">لينكدإن</label><input type="url" id="pe_li" value="' + esc(p.linkedin_url) + '"><label class="f">البريد المهني</label><input type="text" id="pe_e" value="' + esc(p.work_email) + '">' +
    '<label class="f">الحالة</label><select id="pe_s">' + opt(['متحقق', 'غير متحقق', 'غادر الجهة؟'], p.status) + '</select>' +
    '<div class="btns"><button class="btn pri" data-act="personSave" data-id="' + esc(p.contact_id) + '">حفظ (يُعدّ تحققاً)</button></div></details>' +
    '<div class="btns"><button class="btn bad" data-act="personDelete" data-id="' + esc(p.contact_id) + '">احذف بيانات هذا الشخص</button></div>');
};
ACT.personPaste = function (el) {
  api('action', 'contactPaste', { contact_id: el.dataset.id, text: val('pp_t'), url: val('pp_u') }).then(function (r) {
    toast(r.refused ? 'حُجب محتوى غير مهني: ' + (r.reason || '') : 'حُفظت الملاحظة'); closeSheet(); go('operator', S.args, true);
  }).catch(function (e) { toast(errMsg(e), true); });
};
ACT.personSave = function (el) {
  var id = el.dataset.id;
  api('action', 'contactReportsTo', { contact_id: id, boss_id: val('pe_r') }).then(function () {
    return act('contactUpdate', { contact: { contact_id: id, title_ar: val('pe_t'), department: val('pe_d'), level: val('pe_l'), relationship: val('pe_rel'),
      intro_path: val('pe_i'), linkedin_url: val('pe_li'), work_email: val('pe_e'), status: val('pe_s') } }, 'حُفظ');
  }).then(closeSheet).catch(function (e) { toast(errMsg(e), true); });
};
ACT.personDelete = function (el) {
  if (!confirm('حذف نهائي لبيانات هذا الشخص: الصف والإشارات والصورة والتواصلات. متأكد؟')) return;
  closeSheet(); act('contactDelete', { contact_id: el.dataset.id }, 'حُذفت البيانات نهائياً');
};
ACT.photoPick = function (el) {
  var id = el.dataset.id, inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp';
  inp.onchange = function () {
    var f = inp.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () { // تصغير على الجهاز قبل الرفع (٢٥٦ بكسل)
        var c = document.createElement('canvas'), s = Math.min(1, 256 / Math.max(img.width, img.height));
        c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var b64 = c.toDataURL('image/jpeg', 0.85).split(',')[1];
        closeSheet(); act('contactPhoto', { contact_id: id, base64: b64, mime: 'image/jpeg' }, 'رُفعت الصورة');
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  inp.click();
};
ACT.orgPng = function () {
  var z = $('orgzoom'); if (!z) { toast('وضع العرض على الكومبيوتر فقط', true); return; }
  var box = z.getBoundingClientRect(), s = ORG.zoom, cv = document.createElement('canvas'), k = 2;
  cv.width = box.width * k; cv.height = box.height * k + 60 * k;
  var g = cv.getContext('2d'); g.scale(k, k); g.fillStyle = '#fff'; g.fillRect(0, 0, box.width, box.height + 60);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#14181f'; g.font = '700 18px Tahoma'; g.fillText(ORG.data.op.company, box.width / 2, 24); g.translate(0, 50);
  var svg = $('orgsvg').outerHTML.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg" width="' + box.width / s + '" height="' + box.height / s + '"').replace(/var\(--muted\)/g, '#667085');
  var img = new Image();
  img.onload = function () {
    g.save(); g.scale(s, s); g.drawImage(img, 0, 0); g.restore();
    var jobs = [];
    Array.prototype.forEach.call(z.querySelectorAll('.pnode'), function (n) {
      var r = n.getBoundingClientRect(), x = r.left - box.left, y = r.top - box.top, top = n.classList.contains('top');
      g.fillStyle = '#fff'; g.strokeStyle = top ? '#6d28d9' : '#0b6e7f'; g.lineWidth = top ? 2.5 : 1.5;
      g.beginPath(); g.rect(x, y, r.width, r.height); g.fill(); g.stroke();
      g.fillStyle = '#14181f'; g.font = '600 12px Tahoma'; g.fillText(n.querySelector('.nm').textContent, x + r.width / 2 + 18, y + r.height / 2 - 7);
      g.fillStyle = '#667085'; g.font = '11px Tahoma'; g.fillText(n.querySelector('.tt').textContent, x + r.width / 2 + 18, y + r.height / 2 + 9);
      var ph = n.querySelector('img.pframe');
      if (ph) jobs.push(function () { try { g.save(); g.beginPath(); g.arc(x + r.width - 30, y + r.height / 2, 20, 0, Math.PI * 2); g.clip(); g.drawImage(ph, x + r.width - 50, y + r.height / 2 - 20, 40, 40); g.restore(); } catch (e) { } });
    });
    jobs.forEach(function (f) { f(); });
    var url = cv.toDataURL('image/png');
    openSheet('<h1>صورة الهيكل</h1><a class="btn pri" download="org-' + esc(ORG.data.op.op_id) + '.png" href="' + url + '">تنزيل PNG</a><img src="' + url + '" style="width:100%;margin-top:10px">');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};
window.addEventListener('resize', function () { if (S.screen === 'operator') requestAnimationFrame(orgLines); });

/* ─── صنّاع القرار ─── */
SCREENS.people = { render: function (d, args) {
  var f = args || {};
  var rows = d.rows.filter(function (r) {
    return (!f.etype || r.entity_type === f.etype) && (!f.company || r.company === f.company) && (!f.department || r.department === f.department) && (!f.relationship || r.relationship === f.relationship) && (!f.status || r.status === f.status);
  });
  var companies = []; d.rows.forEach(function (r) { if (companies.indexOf(r.company) === -1) companies.push(r.company); });
  var html = north(d.north) + '<h1>صنّاع القرار ' + chip(rows.length) + '</h1><div class="muted small">' + esc(d.purpose) + '</div>' +
    '<div class="row" style="margin:8px 0"><select id="pf_e" class="grow" data-act="pplFilter">' + opt(d.entityTypes, f.etype, true) + '</select><select id="pf_c" class="grow" data-act="pplFilter">' + opt(companies, f.company, true) + '</select>' +
    '<select id="pf_d" class="grow" data-act="pplFilter">' + opt(d.departments, f.department, true) + '</select>' +
    '<select id="pf_r" class="grow" data-act="pplFilter">' + opt(d.relationships, f.relationship, true) + '</select>' +
    '<select id="pf_s" class="grow" data-act="pplFilter">' + opt(['متحقق', 'غير متحقق', 'غادر الجهة؟'], f.status, true) + '</select>' +
    '<button class="btn sm" data-act="pplCsv">تصدير CSV</button></div>';
  html += rows.length ? rows.map(function (r) {
    return '<div class="card click" ' + (r.entity_type === 'مشغّل' && /^\d+$/.test(r.op_id) ? 'data-go="operator" data-args="' + attr({ op_id: r.op_id }) + '"' : '') + '><div class="row">' + pframe(r, false) +
      '<div class="grow"><b>' + esc(r.full_name) + '</b><div class="muted small">' + esc(r.title_ar) + ' · ' + esc(r.company) + ' · ' + esc(r.department) + '</div>' + (r.role_for_us ? '<div class="small">دوره لنا: ' + esc(r.role_for_us) + '</div>' : '') +
      '<div class="chips">' + chip(r.relationship) + chip(r.status, r.status === 'متحقق' ? 'good' : r.status === 'غادر الجهة؟' ? 'bad' : 'warn') +
      (r.stale ? chip('معرّض للانتهاء', 'warn') : '') + chip('تحقق: ' + fmtDate(r.last_verified_at)) + '</div></div></div></div>';
  }).join('') : empty('لا أشخاص بعد — تُبنى الخريطة تدريجياً (مشغّلان يومياً)');
  if (d.review.length) html += section('مراجعة الحذف (لم يُتحقق منهم منذ سنة)', d.review, function (r) {
    return '<div class="card"><b>' + esc(r.full_name) + '</b> — ' + esc(r.company) + '<div class="btns"><button class="btn sm" data-act="pplKeep" data-id="' + esc(r.contact_id) + '">ما زال صحيحاً</button>' +
      '<button class="btn sm bad" data-act="pplDel" data-id="' + esc(r.contact_id) + '">احذف</button></div></div>';
  });
  return html;
} };
ACT.pplFilter = function () { go('people', { etype: val('pf_e'), company: val('pf_c'), department: val('pf_d'), relationship: val('pf_r'), status: val('pf_s') }); };
ACT.pplKeep = function (el) { act('contactUpdate', { contact: { contact_id: el.dataset.id } }, 'سُجّل التحقق'); };
ACT.pplDel = function (el) { if (confirm('حذف نهائي؟')) act('contactDelete', { contact_id: el.dataset.id }, 'حُذف'); };
ACT.pplCsv = function () {
  var cols = ['full_name', 'title_ar', 'company', 'department', 'relationship', 'status', 'last_verified_at'];
  var csv = '﻿' + cols.join(',') + '\n' + S.data.rows.map(function (r) { return cols.map(function (c) { return '"' + String(r[c] || '').replace(/"/g, '""') + '"'; }).join(','); }).join('\n');
  var a = document.createElement('a'); a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv); a.download = 'decision-makers.csv'; document.body.appendChild(a); a.click(); a.remove();
};

/* ─── الفرص ─── */
SCREENS.opps = { render: function (d) {
  return north(d.north) + '<h1>الفرص ' + chip(d.rows.length) + '</h1><div class="muted small">كل فرصة: مشغّل + سبب للاتصال الآن + شخص + زاوية. «ابدأ» يصنع مسودة تمر بموافقتك — لا يُرسل شيء آلياً.</div>' +
    (d.rows.length ? d.rows.map(function (o) {
      return '<div class="card"><div class="row between"><b class="click" data-go="operator" data-args="' + attr({ op_id: o.op_id }) + '">' + esc(o.company) + '</b>' + chip(o.score, 'good') + '</div>' +
        '<div class="chips">' + chip(o.trigger, 'acc') + chip(o.status) + chip((o.branches || '?') + ' فرعاً') + (o.window_to ? chip('حتى ' + fmtDate(o.window_to), 'warn') : '') + '</div>' +
        '<div class="row" style="margin:6px 0">' + (o.contact ? pframe(o.contact, false) + '<span><b>' + esc(o.contact.name) + '</b><br><span class="muted small">' + esc(o.contact.title) + '</span></span>'
          : '<span class="pframe empty">؟</span><span class="muted small">لا صانع قرار معروف — الخريطة ناقصة</span>') + '</div>' +
        '<div class="quote small">' + esc(o.angle) + '</div>' +
        '<div class="btns">' + (o.contact && o.status !== 'قيد العمل' ? '<button class="btn good" data-act="oppStart" data-id="' + esc(o.opp_id) + '">ابدأ</button>' : '') +
        (!o.contact ? '<button class="btn" data-go="operator" data-args="' + attr({ op_id: o.op_id }) + '">أكمل الخريطة</button>' : '') +
        '<button class="btn" data-act="oppDefer" data-id="' + esc(o.opp_id) + '">أجّل</button><button class="btn bad" data-act="oppReject" data-id="' + esc(o.opp_id) + '">ارفض مع السبب</button></div></div>';
    }).join('') : empty('لا فرص الآن — تُركّب يومياً من الاختبارات وصنّاع القرار والتجديدات'));
} };
ACT.oppStart = function (el) { el.disabled = true; act('oppStart', { opp_id: el.dataset.id }, 'أُنشئت مسودة B2B — راجعها في شاشة «الرد»'); };
ACT.oppDefer = function (el) { act('oppStatus', { opp_id: el.dataset.id, status: 'مؤجّلة' }, 'أُجّلت'); };
ACT.oppReject = function (el) { var r = prompt('سبب الرفض:'); if (r) act('oppStatus', { opp_id: el.dataset.id, status: 'مرفوضة', reason: r }, 'رُفضت'); };
</script>

</body>
</html>
