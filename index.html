<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <title>Academy OPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <meta charset="utf-8">
  <meta name="theme-color" content="#0b6e7f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #14181f; --muted: #667085; --line: #e3e6eb; --soft: #f0f2f5;
  --accent: #0b6e7f; --accent-ink: #ffffff; --accent-soft: #e2f1f3;
  --good: #15803d; --good-soft: #e3f5e8; --warn: #b45309; --warn-soft: #fdf1dc;
  --bad: #c62828; --bad-soft: #fde6e6; --orange: #d9580f; --orange-soft: #fde9dc;
  --off: #8a94a3; --off-soft: #eceef1; --owner: #6d28d9; --owner-soft: #efe7fd;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --card: #171b21; --ink: #e8ebef; --muted: #9aa4b2; --line: #2a303a; --soft: #1e232b;
    --accent: #3fb6c8; --accent-ink: #081418; --accent-soft: #123138;
    --good: #4ade80; --good-soft: #13301f; --warn: #f5b454; --warn-soft: #3a2a10;
    --bad: #f87171; --bad-soft: #3a1616; --orange: #fb923c; --orange-soft: #3a2110;
    --off: #7c8696; --off-soft: #22272f; --owner: #b48cff; --owner-soft: #2a1d47;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
/* اختيار صريح من زر 🌙 (يغلب إعداد الجهاز) */
:root[data-theme="dark"] {
    --bg: #0f1216; --card: #171b21; --ink: #e8ebef; --muted: #9aa4b2; --line: #2a303a; --soft: #1e232b;
    --accent: #3fb6c8; --accent-ink: #081418; --accent-soft: #123138;
    --good: #4ade80; --good-soft: #13301f; --warn: #f5b454; --warn-soft: #3a2a10;
    --bad: #f87171; --bad-soft: #3a1616; --orange: #fb923c; --orange-soft: #3a2110;
    --off: #7c8696; --off-soft: #22272f; --owner: #b48cff; --owner-soft: #2a1d47;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body { font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; font-size: 14.5px; line-height: 1.6;
  -webkit-text-size-adjust: 100%; overflow-x: hidden; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { display: flex; min-height: 100vh; }
main { flex: 1; min-width: 0; padding: 12px 16px calc(var(--nav-h) + 24px); max-width: none; margin: 0; width: 100%; }

/* ─── التنقل: شريط سفلي على الجوال، جانبي على الكومبيوتر ─── */
nav.bottom { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--card);
  border-top: 1px solid var(--line); display: flex; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
nav.bottom button { flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font-size: 11.5px; color: var(--muted); cursor: pointer; position: relative; min-width: 0; }
nav.bottom button.on { color: var(--accent); font-weight: 600; }
nav.bottom svg { width: 22px; height: 22px; }
.dot { position: absolute; top: 8px; inset-inline-end: calc(50% - 20px); min-width: 17px; height: 17px; border-radius: 9px;
  background: var(--bad); color: #fff; font-size: 10.5px; line-height: 17px; padding: 0 4px; text-align: center; }
nav.side { display: none; }
details.navg { margin: 2px 0; }
details.navg > summary { list-style: none; font-weight: 700; color: var(--ink); padding: 6px 10px; border-radius: 8px; margin: 0; }
details.navg > summary::-webkit-details-marker { display: none; }
details.navg > summary::before { content: '◂'; display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
details.navg[open] > summary::before { transform: rotate(-90deg); }
details.navg > summary:hover { background: var(--soft); }
nav.side details.navg button { padding-inline-start: 26px !important; }
main details.navg { margin-bottom: 8px; }
main details.navg > summary { font-size: 15.5px; }
@media (min-width: 900px) {
  nav.bottom { display: none; }
  nav.side { display: block; width: 220px; flex-shrink: 0; background: var(--card); border-inline-start: 1px solid var(--line);
    padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav.side .brand { font-weight: 700; padding: 4px 10px 14px; }
  nav.side button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: start; background: none; border: 0;
    padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--ink); position: relative; }
  nav.side button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav.side .dot { position: static; margin-inline-start: auto; }
  main { padding-bottom: 32px; }
}

/* ─── المؤشر الشمالي ─── */
.north { background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 8px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.north .n { font-size: 26px; font-weight: 700; line-height: 1; }
.north .l { font-size: 13px; opacity: .92; }
.north .side-stats { font-size: 12.5px; text-align: end; opacity: .92; }

h1 { font-size: 19px; margin: 2px 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h2 { font-size: 15px; margin: 12px 0 6px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 11px;
  margin-bottom: 7px; box-shadow: var(--shadow); overflow-wrap: anywhere; }
.card.click { cursor: pointer; }
.card.click:active { transform: scale(.995); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12.5px; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 7px; }
@media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px;
  background: var(--soft); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.owner { background: var(--owner-soft); color: var(--owner); border-color: transparent; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; flex: 1; min-width: 100px; }
.stat .v { font-size: 18px; font-weight: 700; }
.stat .k { font-size: 12px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 10px; cursor: pointer;
  font-weight: 500; min-height: 34px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { background: var(--good); color: #fff; border-color: var(--good); }
.btn.bad { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 9px; min-height: 28px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.btns .btn { flex: 1 1 auto; }

input[type=text], input[type=number], input[type=date], input[type=url], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 6px 9px; }
textarea { min-height: 90px; resize: vertical; line-height: 1.7; }
textarea.mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; direction: auto; }
label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 6px 0 3px; }
.quote { background: var(--soft); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }
.empty { text-align: center; color: var(--muted); padding: 12px 8px; }
.toast { position: fixed; bottom: calc(var(--nav-h) + 14px); left: 16px; right: 16px; margin: auto; max-width: 480px;
  background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 12px; z-index: 60; text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast.err { background: var(--bad); color: #fff; }
.loading { text-align: center; padding: 40px; color: var(--muted); }
.tabsbar { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 0 6px; border-bottom: 1px solid var(--line, #ddd); padding-bottom: 4px; }
.tabsbar .tabb { background: transparent; border: 1px solid var(--line, #ccc); border-radius: 8px; padding: 3px 12px; font: inherit; font-size: 13px; color: inherit; cursor: pointer; }
.tabsbar .tabb.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.tabsbar .tabb .dot { position: static; display: inline-block; }
.newbadge { background: var(--bad); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; border: 0; }
details > summary { cursor: pointer; color: var(--accent); margin: 6px 0; }
.bar { height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
.kv b { color: var(--muted); font-weight: 500; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; display: flex; justify-content: flex-start; }
.sheet .panel { background: var(--bg); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 14px 16px 90px;
  box-shadow: 0 0 30px rgba(0,0,0,.2); }
.sheet .close { position: sticky; top: 0; float: left; }
.switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--off); border-radius: 26px; transition: .2s; cursor: pointer; }
.switch span:before { content: ''; position: absolute; width: 20px; height: 20px; inset-inline-start: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span:before { transform: translateX(-20px); }
.switch input:disabled + span { opacity: .5; cursor: default; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
.tabs button { white-space: nowrap; }
.kanban { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 900px) { .kanban { grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); overflow-x: auto; } }
.kcol { background: var(--soft); border-radius: 12px; padding: 8px; min-height: 60px; }
.ib { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 900px) { .ib { grid-template-columns: 300px 1fr; } }
.ib-list { max-height: 70vh; overflow-y: auto; }
.ib-thread { max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 4px; }
.ib-on { border-color: var(--accent) !important; background: var(--accent-soft); }
.ib-in, .ib-out { max-width: 82%; padding: 7px 10px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.ib-in { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
.ib-out { align-self: flex-end; background: var(--accent-soft); }
.ttags { margin-inline-start: auto; font-size: 10px; opacity: .7; letter-spacing: -1px; white-space: nowrap; flex-shrink: 0; }
/* الشريط الجانبي: عنوان القائمة مميّز، والعناصر تحته أصغر ومُزاحة بخط عمودي */
nav.side details.navg > summary { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; padding: 7px 8px; }
nav.side details.navg.here > summary { color: var(--accent); }
.navg-t { flex: 1; } .navg-n { font-size: 10.5px; font-weight: 400; color: var(--muted); background: var(--soft); border-radius: 999px; padding: 0 6px; }
nav.side .navg-kids { margin: 2px 0 6px; margin-inline-start: 14px; border-inline-start: 2px solid var(--line); padding-inline-start: 4px; }
nav.side details.navg.here .navg-kids { border-color: var(--accent); }
nav.side .navg-kids button.navi { font-size: 12.5px; font-weight: 400; padding: 5px 8px !important; color: var(--muted); border-radius: 7px; }
nav.side .navg-kids button.navi:hover { background: var(--soft); color: var(--ink); }
nav.side .navg-kids button.navi.on { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.navi-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ltr-table { direction: ltr; text-align: left; }
.cgrp { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.var { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 6px; font-size: 12px; cursor: pointer; }
.two { display: grid; grid-template-columns: 1fr; gap: 12px; } @media (min-width: 900px) { .two { grid-template-columns: 1.15fr 1fr; } }
.prev { background: var(--soft); border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; font-size: 13.5px; min-height: 60px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 3px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink); } .seg button.on { background: var(--accent); color: var(--accent-ink); }
.cgrps { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: flex-start; }
.cnt.go { border-color: var(--accent); } .cnt.ok b { color: var(--good); } .cnt.bad b { color: var(--bad); }
.bstrip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; margin-bottom: 5px; }
.bstrip.hl { border-color: var(--accent); }
.bs-name { min-width: 150px; display: flex; flex-direction: column; line-height: 1.2; }
.bs-g, .bs-s, .bs-act { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.bs-g { padding-inline-end: 8px; border-inline-end: 1px dashed var(--line); }
.bs-s { flex: 1; } .bs-act { margin-inline-start: auto; }
.cnt { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 12px; cursor: pointer; }
.cnt b { color: var(--accent); } .cnt:hover { border-color: var(--accent); } .cnt.on { background: var(--accent-soft); border-color: var(--accent); }
.envtag { font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 2px 8px; margin: -8px 10px 8px; display: inline-block; }
.envtag.main { background: rgba(42,157,143,.15); color: #2a9d8f; } .envtag.sbx { background: rgba(214,69,69,.15); color: #d64545; }
.pcount { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--line); border-radius: 999px; padding: 0 2px 0 8px; font-size: 12px; }
.pc-n { border: 0; border-radius: 999px; min-width: 22px; height: 20px; font-weight: 700; background: var(--soft); color: var(--muted); cursor: pointer; }
.pc-n.on { background: var(--accent); color: var(--accent-ink); }
.ctl { border: 1px solid var(--line); border-radius: 10px; padding: 6px; background: var(--card); overflow-x: auto; }
.ctl-row { display: flex; align-items: center; min-height: 24px; border-bottom: 1px dashed var(--line); min-width: 640px; }
.ctl-row.ours { background: rgba(42,157,143,.08); }
.ctl-head { border-bottom: 1px solid var(--line); min-height: 20px; }
.ctl-lbl { width: 190px; flex-shrink: 0; font-size: 11.5px; line-height: 1.25; overflow: hidden; padding-inline-end: 6px; }
.ctl-lbl b, .ctl-lbl span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctl-lbl span { color: var(--muted); }
.ctl-track { position: relative; flex: 1; height: 20px; }
.ctl-head .ctl-track span { position: absolute; top: 2px; font-size: 10px; color: var(--muted); }
.ctl-bar { position: absolute; top: 3px; height: 14px; border-radius: 4px; color: #fff; font-size: 9.5px; line-height: 14px; text-align: center; overflow: hidden; white-space: nowrap; cursor: pointer; min-width: 6px; }
.ctl-bar.est { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.25) 0 4px, transparent 4px 8px); }
.ctl-now { position: absolute; top: 0; bottom: 0; width: 2px; background: #d64545; opacity: .7; }
table.ltr-table { border-collapse: collapse; font-size: 12px; } table.ltr-table th, table.ltr-table td { border: 1px solid var(--line); padding: 2px 6px; white-space: nowrap; }
.ttag-p { background: #efe7ff; color: #6d28d9; border-color: transparent; }
.ttag-a { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.ttag-m { background: var(--soft); }
.adot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
.amap { display: flex; flex-direction: column; align-items: stretch; gap: 2px; max-width: 760px; margin: 8px auto; }
.amap-stage { border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--card); }
.amap-h { font-weight: 700; margin-bottom: 6px; color: var(--accent); }
.amap-node { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; margin: 4px 0; background: var(--bg); }
.amap-arrow { text-align: center; color: var(--accent); font-size: 18px; line-height: 1.1; }
.dp-split { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 1000px) { .dp-split { grid-template-columns: 1fr 2fr; } .dp-comp { border-inline-start: 1px dashed var(--line); padding-inline-start: 12px; } }
.tl { border-inline-start: 2px solid var(--accent); padding-inline-start: 10px; }
.tl-item { position: relative; margin: 6px 0; }
.tl-item::before { content: ''; position: absolute; inset-inline-start: -16px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.kcol.drop { outline: 2px dashed var(--accent); }
.kcard[draggable] { cursor: grab; }
.kcol h3 { font-size: 13px; margin: 2px 4px 8px; display: flex; justify-content: space-between; }

/* ── وضع مضغوط (طلب المالك): أزرار ومربعات بحجم محتواها ── */body { font-size: 14px; line-height: 1.5; }.btns .btn { flex: 0 0 auto; }.btn { padding: 4px 11px; min-height: 30px; font-size: 13.5px; border-radius: 8px; }.btn.sm { padding: 2px 8px; min-height: 26px; font-size: 12.5px; }.stat { flex: 0 1 auto; min-width: 88px; padding: 4px 10px; }.stat .v { font-size: 16px; line-height: 1.3; }.stat .k { font-size: 11.5px; }.card { padding: 7px 10px; margin-bottom: 6px; border-radius: 10px; }.north { padding: 6px 12px; margin-bottom: 8px; }.north .n { font-size: 22px; }input[type=text], input[type=number], input[type=date], input[type=url], select { padding: 4px 8px; }textarea { padding: 5px 8px; min-height: 70px; line-height: 1.55; }label.f { margin: 5px 0 2px; }.intro { padding: 6px 10px; margin-bottom: 8px; }.row { gap: 6px; }@media (max-width: 600px) { .btns .btn { flex: 1 1 auto; } }

/* ── شريط علوي نحيف + أرقام على شكل كبسولات في سطر واحد ── */.north { padding: 4px 12px; margin-bottom: 6px; font-size: 13px; flex-wrap: wrap; gap: 4px 12px; }.north .n { font-size: 16px; }.north .side-stats { font-size: 12.5px; }.north-off { background: rgba(0,0,0,.22); border-radius: 999px; padding: 1px 8px; cursor: help; }.stat { display: inline-flex; align-items: baseline; gap: 5px; flex: 0 0 auto; min-width: 0; padding: 2px 10px; border-radius: 999px; box-shadow: none; }.stat .v { font-size: 14.5px; line-height: 1.4; }.stat .k { font-size: 12px; }.row:has(> .stat) { gap: 5px; margin-bottom: 6px; }

function postMediaUpload_(input, ids) {
  var f = input.files && input.files[0]; if (!f) return;
  if (!/^image\//.test(f.type)) return toast('اختر صورة', true);
  if (f.size > 10 * 1024 * 1024) return toast('الصورة أكبر من ١٠ ميغا', true);
  var r = new FileReader();
  r.onload = function () { toast('جارٍ رفع الصورة…'); act('postMedia', { post_ids: ids, data: String(r.result).split(',')[1], mime: f.type, name: f.name.replace(/\.[^.]+$/, '') }, 'رُفعت الصورة'); };
  r.readAsDataURL(f);
}
document.addEventListener('change', function (e) {
  var t = e.target; if (!t || !t.dataset) return;
  if (t.id === 'pm_img') {
    var f = t.files && t.files[0], pv = $('pm_prev');
    if (f && pv) { var u = URL.createObjectURL(f); pv.innerHTML = '<img src="' + u + '" style="max-width:100%;max-height:180px;border-radius:10px"><div>' + esc(f.name) + '</div>'; }
    return;
  }
  if (t.dataset.mediaAll) postMediaUpload_(t, S.postIds || []);
  else if (t.dataset.media) postMediaUpload_(t, [t.dataset.media]);
});
ACT.postOne = function (el) { act('postToggle', { post_ids: [el.dataset.id], on: el.dataset.on === '1' }, el.dataset.on === '1' ? 'شُغّل' : 'أُلغي'); };

/** الأسهم: المصادر → أول عقدة في الاستقبال، ثم سلسلة داخل كل مرحلة، ثم آخر المرحلة → أول التالية */
function drawEdges() {
  var root = $('flow'), svg = $('edges');
  if (!root || !svg || !FLOW.data) return;
  var box = root.getBoundingClientRect();
  var horiz = window.innerWidth >= 900;
  var groups = FLOW.data.groups;
  var edges = [];
  groups.forEach(function (g, i) {
    var next = groups[i + 1];
    if (i === 0 && next) g.nodes.forEach(function (n) { edges.push([n, next.nodes[0]]); });
    else {
      for (var k = 0; k + 1 < g.nodes.length; k++) edges.push([g.nodes[k], g.nodes[k + 1]]);
      if (next) edges.push([g.nodes[g.nodes.length - 1], next.nodes[0]]);
    }
  });
  var rect = function (key) {
    var el = root.querySelector('[data-node="' + key + '"]');
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return { l: r.left - box.left, r: r.right - box.left, t: r.top - box.top, b: r.bottom - box.top, cx: (r.left + r.right) / 2 - box.left, cy: (r.top + r.bottom) / 2 - box.top };
  };
  var col = getComputedStyle(document.documentElement).getPropertyValue('--muted') || '#888';
  var out = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="' + col + '"/></marker></defs>';
  edges.forEach(function (e) {
    var a = rect(e[0].key), b = rect(e[1].key);
    if (!a || !b) return;
    var sameCol = Math.abs(a.cx - b.cx) < 30;
    var x1, y1, x2, y2, path;
    if (horiz && !sameCol) {           // RTL: من اليمين إلى اليسار
      x1 = a.l; y1 = a.cy; x2 = b.r; y2 = b.cy;
      var mx = (x1 + x2) / 2;
      path = 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2;
    } else {                           // عمودياً: من الأسفل إلى الأعلى التالي
      x1 = a.cx; y1 = a.b; x2 = b.cx; y2 = b.t;
      if (y2 < y1) { y1 = a.cy; x1 = a.l; x2 = b.r; y2 = b.cy; }
      var my = (y1 + y2) / 2;
      path = 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + y2;
    }
    var dim = !e[1].enabled && e[1].kind !== 'human';
    out += '<path d="' + path + '" fill="none" stroke="' + col + '" stroke-width="1.4" opacity="' + (dim ? 0.18 : 0.55) + '"' +
      (dim ? ' stroke-dasharray="4 4"' : '') + ' marker-end="url(#ah)"/>';
  });
  svg.setAttribute('viewBox', '0 0 ' + box.width + ' ' + box.height);
  svg.innerHTML = out;
}

/* ─── تصدير PNG من وضع العرض: رسم مستقل على canvas بنفس المواقع ─── */
ACT.flowPng = function () {
  var root = $('flow'); if (!root) return;
  var box = root.getBoundingClientRect(), scale = 2;
  var cv = document.createElement('canvas');
  cv.width = Math.ceil(box.width * scale); cv.height = Math.ceil(box.height * scale) + 60 * scale;
  var g = cv.getContext('2d'); g.scale(scale, scale);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, box.width, box.height + 60);
  g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#14181f'; g.font = '700 18px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  g.fillText('تدفق نظام التسويق والتشغيل', box.width / 2, 24);
  g.translate(0, 50);
  var img = new Image();
  var svg = $('edges').outerHTML.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg" width="' + box.width + '" height="' + box.height + '"')
    .replace(/var\(--muted\)/g, '#667085');
  img.onload = function () {
    g.drawImage(img, 0, 0);
    root.querySelectorAll('.fstage > h3').forEach(function (h) {
      var r = h.getBoundingClientRect();
      g.fillStyle = '#667085'; g.font = '600 12.5px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      g.fillText(h.textContent, r.left - box.left + r.width / 2, r.top - box.top + r.height / 2);
    });
    root.querySelectorAll('.node').forEach(function (n) {
      var r = n.getBoundingClientRect(), x = r.left - box.left, y = r.top - box.top, own = n.classList.contains('owner');
      g.fillStyle = own ? '#efe7fd' : '#ffffff'; g.strokeStyle = own ? '#6d28d9' : '#0b6e7f'; g.lineWidth = own ? 2.5 : 1.5;
      roundRect(g, x, y, r.width, r.height, 12); g.fill(); g.stroke();
      g.fillStyle = own ? '#6d28d9' : '#14181f'; g.font = (own ? '700 15px' : '600 13.5px') + ' "IBM Plex Sans Arabic", Tahoma, sans-serif';
      g.fillText(n.querySelector('.nm').textContent, x + r.width / 2, y + r.height / 2);
    });
    var url = cv.toDataURL('image/png');
    openSheet('<h1>صورة المخطط</h1><div class="muted small">إن لم يبدأ التنزيل: اضغط مطولاً على الصورة (الجوال) أو زر الفأرة الأيمن ← حفظ.</div>' +
      '<a class="btn pri" download="academy-flow.png" href="' + url + '">تنزيل PNG</a><img src="' + url + '" style="width:100%;margin-top:10px;border-radius:12px;border:1px solid var(--line)">');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

  return '<details class="card" style="margin-top:6px"' + (ST.open === '__m' ? ' open' : '') + '><summary><b>🧠 ما تعلّمه العقل من السوق</b> <span class="muted tiny">— من ' + m.n + ' دورة مقروءة في صفحات الدفع · يغذّي بناء متجرنا وتسويقنا</span></summary>' +
    '<div style="margin-top:6px"><b class="small">نطاقات الأسعار لكل فئة</b>' + bands + '</div><div class="small" style="margin-top:6px">طريقة التقديم: ' + mix + ' · نساء فقط ' + m.women + ' · رجال فقط ' + m.men + ' · باقات ' + m.bundles + '</div>' +
    '<div style="margin-top:6px"><b class="small">💡 قرارات لمتجرنا (من الأرقام)</b>' + tips + '</div>' + (m.accred && m.accred.phrases && m.accred.phrases.length ? '<div style="margin-top:6px"><b class="small">🎓 كيف يكتب المنافسون الاعتماد</b> <span class="muted tiny">— يُذكر في ' + m.accred.pct + '% من دوراتهم، والجهة الحكومية في ' + m.accred.gov_pct + '% فقط · جملنا: «معتمدة من وزارة الرياضة ومعهد إعداد القادة (LDI)»</span>' +
    m.accred.phrases.map(function (p) { return '<div class="small" style="margin:2px 0">«' + esc(p.text) + '» <span class="muted tiny">— ' + esc(p.who) + (p.n > 1 ? ' ×' + p.n : '') + '</span></div>'; }).join('') + '</div>' : '') +
    '<div style="margin-top:6px"><b class="small">⚠️ أخطاء عند المنافسين لنتجنبها</b>' + mis + '</div>' + nar + sw + '</details>';
}
SCREENS.storecourses = { render: function (d) {
  ST.data = d;
  if (ST.open === null) ST.open = d.groups[0] ? d.groups[0].ac_id : '';
  var f = ST.f, all = []; d.groups.forEach(function (g) { all = all.concat(g.courses); });
  var cities = {}; all.forEach(function (c) { if (c.city) cities[c.city] = 1; });
  var html = north(d.north) + '<div class="row between" style="align-items:center;gap:8px;flex-wrap:wrap"><h1 style="margin:0">🛒 دورات المنافسين بمواقع الدفع <span class="muted tiny">· من صفحة الشراء نفسها فقط · ' + d.total + ' دورة · ' + d.groups.length + ' متجراً</span></h1><span class="row" style="gap:6px;flex-wrap:wrap">' +
    '<input id="st_q" placeholder="🔍 ابحث في الدورات" value="' + esc(f.q) + '" style="width:160px">' +
    '<select id="st_d"><option value="">الطريقة: الكل</option>' + ['حضوري', 'عن بعد', 'دراسة ذاتية', 'مدمج'].map(function (x) { return '<option' + (f.deliv === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' +
    '<select id="st_g"><option value="">الفئة: الكل</option>' + ['نساء فقط', 'رجال فقط'].map(function (x) { return '<option' + (f.gender === x ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' +
    '<select id="st_c"><option value="">المدينة: الكل</option>' + Object.keys(cities).map(function (x) { return '<option' + (f.city === x ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select>' +
    '<label class="chip"><input type="checkbox" id="st_o"' + (f.other ? ' checked' : '') + '> منتجات أخرى</label>' +
    '<button class="btn sm pri" data-act="stRead" data-tip="يقرأ المتاجر التي تسمح لخوادم جوجل. المتاجر التي تحجبها (سلة على Cloudflare…) تُقرأ من جهازك بالجامع المحلي: scripts/store-collector.js">🔄 اقرأ المتاجر الآن</button></span></div>' + stMarket_(d);
  html += d.groups.map(function (g) {
    var open = ST.open === g.ac_id, shown = g.courses.filter(stFilter_).length;
    return '<div class="card" style="margin-top:6px"><div class="st-hd" data-act="stToggle" data-id="' + esc(g.ac_id) + '"><span>' + (open ? '▾' : '▸') + '</span><b>' + esc(g.name) + '</b><span class="tag acc">' + esc(g.platform) + '</span><span class="tag">' + g.n + ' دورة' + (shown !== g.n ? ' · ' + shown + ' مطابقة' : '') + '</span>' +
      (g.changed ? '<span class="tag bad">🔻 تغيّر ' + g.changed + '</span>' : '') + '<span class="muted tiny" style="margin-inline-start:auto">قُرئ ' + esc(stAgo_(g.seen)) + '</span></div>' + (open ? stRows_(g) : '') + '</div>';
  }).join('') || empty('لم تُقرأ متاجر بعد — اضغط «اقرأ المتاجر الآن» أو شغّل الجامع المحلي');
  if (d.without && d.without.length) html += '<div class="card" style="margin-top:8px"><b>⚠️ منافسون لا نقرأ متجرهم (' + d.without.length + ')</b> <span class="muted tiny">— السبب، وأين تضع رابط صفحة الشراء</span>' + d.without.map(function (w) {
    return '<div class="st-wo"><b>' + esc(String(w.name).split(/\s[—–-]\s/)[0]) + '</b><span class="muted tiny">' + esc(w.why) + '</span><span class="row" style="gap:4px"><input id="sw_' + esc(w.ac_id) + '" dir="ltr" placeholder="رابط صفحة الشراء/الدورات" value="' + esc(w.site) + '" style="width:230px"><button class="btn sm pri" data-act="stSetUrl" data-id="' + esc(w.ac_id) + '">حفظ</button><button class="btn sm" data-act="cmpCapture" data-id="' + esc(w.ac_id) + '">📸 أضف من لقطة</button></span></div>'; }).join('') + '</div>';
  return html;
} };
document.addEventListener('input', function (e) { if (e.target && e.target.id === 'st_q') { ST.f.q = e.target.value; clearTimeout(ST.t); ST.t = setTimeout(function () { go('storecourses', {}, true); var q = $('st_q'); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 350); } });
document.addEventListener('change', function (e) {
  if (!e.target || S.screen !== 'storecourses') return;
  var id = e.target.id; if (id === 'st_d') ST.f.deliv = e.target.value; else if (id === 'st_g') ST.f.gender = e.target.value; else if (id === 'st_c') ST.f.city = e.target.value; else if (id === 'st_o') ST.f.other = e.target.checked; else return;
  go('storecourses', {}, true);
});
ACT.stToggle = function (el) { ST.open = ST.open === el.dataset.id ? '' : el.dataset.id; go('storecourses', {}, true); };
ACT.stSetUrl = function (el) { act('storeSetUrl', { ac_id: el.dataset.id, url: val('sw_' + el.dataset.id) }, 'حُفظ — يُقرأ في أقرب تشغيل'); };
ACT.stRead = function (el) { el.disabled = true; el.textContent = '⏳ يقرأ…'; act('storeReadNow', {}, function (r) { return r && r.message ? r.message : 'اكتملت القراءة'; }); };
</script>

</body>
</html>
