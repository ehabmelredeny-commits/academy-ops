<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <title>Academy OPS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  
  <meta charset="utf-8">
  <meta name="theme-color" content="#0b6e7f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #14181f; --muted: #667085; --line: #e3e6eb; --soft: #f0f2f5;
  --accent: #0b6e7f; --accent-ink: #ffffff; --accent-soft: #e2f1f3;
  --good: #15803d; --good-soft: #e3f5e8; --warn: #b45309; --warn-soft: #fdf1dc;
  --bad: #c62828; --bad-soft: #fde6e6; --orange: #d9580f; --orange-soft: #fde9dc;
  --off: #8a94a3; --off-soft: #eceef1; --owner: #6d28d9; --owner-soft: #efe7fd;
  --radius: 14px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1216; --card: #171b21; --ink: #e8ebef; --muted: #9aa4b2; --line: #2a303a; --soft: #1e232b;
    --accent: #3fb6c8; --accent-ink: #081418; --accent-soft: #123138;
    --good: #4ade80; --good-soft: #13301f; --warn: #f5b454; --warn-soft: #3a2a10;
    --bad: #f87171; --bad-soft: #3a1616; --orange: #fb923c; --orange-soft: #3a2110;
    --off: #7c8696; --off-soft: #22272f; --owner: #b48cff; --owner-soft: #2a1d47;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
/* اختيار صريح من زر 🌙 (يغلب إعداد الجهاز) */
:root[data-theme="dark"] {
    --bg: #0f1216; --card: #171b21; --ink: #e8ebef; --muted: #9aa4b2; --line: #2a303a; --soft: #1e232b;
    --accent: #3fb6c8; --accent-ink: #081418; --accent-soft: #123138;
    --good: #4ade80; --good-soft: #13301f; --warn: #f5b454; --warn-soft: #3a2a10;
    --bad: #f87171; --bad-soft: #3a1616; --orange: #fb923c; --orange-soft: #3a2110;
    --off: #7c8696; --off-soft: #22272f; --owner: #b48cff; --owner-soft: #2a1d47;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body { font-family: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; font-size: 14.5px; line-height: 1.6;
  -webkit-text-size-adjust: 100%; overflow-x: hidden; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { display: flex; min-height: 100vh; }
main { flex: 1; min-width: 0; padding: 12px 16px calc(var(--nav-h) + 24px); max-width: none; margin: 0; width: 100%; }

/* ─── التنقل: شريط سفلي على الجوال، جانبي على الكومبيوتر ─── */
nav.bottom { position: fixed; bottom: 0; left: 0; right: 0; height: var(--nav-h); background: var(--card);
  border-top: 1px solid var(--line); display: flex; z-index: 30; padding-bottom: env(safe-area-inset-bottom); }
nav.bottom button { flex: 1; background: none; border: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font-size: 11.5px; color: var(--muted); cursor: pointer; position: relative; min-width: 0; }
nav.bottom button.on { color: var(--accent); font-weight: 600; }
nav.bottom svg { width: 22px; height: 22px; }
.dot { position: absolute; top: 8px; inset-inline-end: calc(50% - 20px); min-width: 17px; height: 17px; border-radius: 9px;
  background: var(--bad); color: #fff; font-size: 10.5px; line-height: 17px; padding: 0 4px; text-align: center; }
nav.side { display: none; }
details.navg { margin: 2px 0; }
details.navg > summary { list-style: none; font-weight: 700; color: var(--ink); padding: 6px 10px; border-radius: 8px; margin: 0; }
details.navg > summary::-webkit-details-marker { display: none; }
details.navg > summary::before { content: '◂'; display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
details.navg[open] > summary::before { transform: rotate(-90deg); }
details.navg > summary:hover { background: var(--soft); }
nav.side details.navg button { padding-inline-start: 26px !important; }
main details.navg { margin-bottom: 8px; }
main details.navg > summary { font-size: 15.5px; }
@media (min-width: 900px) {
  nav.bottom { display: none; }
  nav.side { display: block; width: 220px; flex-shrink: 0; background: var(--card); border-inline-start: 1px solid var(--line);
    padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  nav.side .brand { font-weight: 700; padding: 4px 10px 14px; }
  nav.side button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: start; background: none; border: 0;
    padding: 8px 10px; border-radius: 10px; cursor: pointer; color: var(--ink); position: relative; }
  nav.side button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav.side .dot { position: static; margin-inline-start: auto; }
  main { padding-bottom: 32px; }
}

/* ─── المؤشر الشمالي ─── */
.north { background: var(--accent); color: var(--accent-ink); border-radius: var(--radius); padding: 8px 12px;
  display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.north .n { font-size: 26px; font-weight: 700; line-height: 1; }
.north .l { font-size: 13px; opacity: .92; }
.north .side-stats { font-size: 12.5px; text-align: end; opacity: .92; }

h1 { font-size: 19px; margin: 2px 0 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
h2 { font-size: 15px; margin: 12px 0 6px; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 11px;
  margin-bottom: 7px; box-shadow: var(--shadow); overflow-wrap: anywhere; }
.card.click { cursor: pointer; }
.card.click:active { transform: scale(.995); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.between { justify-content: space-between; }
.muted { color: var(--muted); font-size: 13px; }
.small { font-size: 12.5px; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 7px; }
@media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px;
  background: var(--soft); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.chip.owner { background: var(--owner-soft); color: var(--owner); border-color: transparent; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; flex: 1; min-width: 100px; }
.stat .v { font-size: 18px; font-weight: 700; }
.stat .k { font-size: 12px; color: var(--muted); }

.btn { border: 1px solid var(--line); background: var(--card); padding: 6px 12px; border-radius: 10px; cursor: pointer;
  font-weight: 500; min-height: 34px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { background: var(--good); color: #fff; border-color: var(--good); }
.btn.bad { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 4px 9px; min-height: 28px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.btns .btn { flex: 1 1 auto; }

input[type=text], input[type=number], input[type=date], input[type=url], select, textarea {
  width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 9px; padding: 6px 9px; }
textarea { min-height: 90px; resize: vertical; line-height: 1.7; }
textarea.mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; direction: auto; }
label.f { display: block; font-size: 12.5px; color: var(--muted); margin: 6px 0 3px; }
.quote { background: var(--soft); border-radius: 10px; padding: 10px 12px; white-space: pre-wrap; }
.empty { text-align: center; color: var(--muted); padding: 12px 8px; }
.toast { position: fixed; bottom: calc(var(--nav-h) + 14px); left: 16px; right: 16px; margin: auto; max-width: 480px;
  background: var(--ink); color: var(--bg); padding: 11px 14px; border-radius: 12px; z-index: 60; text-align: center;
  box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast.err { background: var(--bad); color: #fff; }
.loading { text-align: center; padding: 40px; color: var(--muted); }
.newbadge { background: var(--bad); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; border: 0; }
details > summary { cursor: pointer; color: var(--accent); margin: 6px 0; }
.bar { height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }
.bar.warn > i { background: var(--warn); } .bar.bad > i { background: var(--bad); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 13.5px; }
.kv b { color: var(--muted); font-weight: 500; }
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; display: flex; justify-content: flex-start; }
.sheet .panel { background: var(--bg); width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 14px 16px 90px;
  box-shadow: 0 0 30px rgba(0,0,0,.2); }
.sheet .close { position: sticky; top: 0; float: left; }
.switch { position: relative; width: 46px; height: 26px; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--off); border-radius: 26px; transition: .2s; cursor: pointer; }
.switch span:before { content: ''; position: absolute; width: 20px; height: 20px; inset-inline-start: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
.switch input:checked + span { background: var(--good); }
.switch input:checked + span:before { transform: translateX(-20px); }
.switch input:disabled + span { opacity: .5; cursor: default; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; }
.tabs button { white-space: nowrap; }
.kanban { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 900px) { .kanban { grid-auto-flow: column; grid-auto-columns: minmax(200px, 1fr); overflow-x: auto; } }
.kcol { background: var(--soft); border-radius: 12px; padding: 8px; min-height: 60px; }
.ib { display: grid; grid-template-columns: 1fr; gap: 8px; }
@media (min-width: 900px) { .ib { grid-template-columns: 300px 1fr; } }
.ib-list { max-height: 70vh; overflow-y: auto; }
.ib-thread { max-height: 70vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 4px; }
.ib-on { border-color: var(--accent) !important; background: var(--accent-soft); }
.ib-in, .ib-out { max-width: 82%; padding: 7px 10px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
.ib-in { align-self: flex-start; background: var(--card); border: 1px solid var(--line); }
.ib-out { align-self: flex-end; background: var(--accent-soft); }
.ttags { margin-inline-start: auto; font-size: 10px; opacity: .7; letter-spacing: -1px; white-space: nowrap; flex-shrink: 0; }
/* الشريط الجانبي: عنوان القائمة مميّز، والعناصر تحته أصغر ومُزاحة بخط عمودي */
nav.side details.navg > summary { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; padding: 7px 8px; }
nav.side details.navg.here > summary { color: var(--accent); }
.navg-t { flex: 1; } .navg-n { font-size: 10.5px; font-weight: 400; color: var(--muted); background: var(--soft); border-radius: 999px; padding: 0 6px; }
nav.side .navg-kids { margin: 2px 0 6px; margin-inline-start: 14px; border-inline-start: 2px solid var(--line); padding-inline-start: 4px; }
nav.side details.navg.here .navg-kids { border-color: var(--accent); }
nav.side .navg-kids button.navi { font-size: 12.5px; font-weight: 400; padding: 5px 8px !important; color: var(--muted); border-radius: 7px; }
nav.side .navg-kids button.navi:hover { background: var(--soft); color: var(--ink); }
nav.side .navg-kids button.navi.on { color: var(--accent); background: var(--accent-soft); font-weight: 600; }
.navi-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ltr-table { direction: ltr; text-align: left; }
.cgrp { margin-top: 5px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.var { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 6px; font-size: 12px; cursor: pointer; }
.two { display: grid; grid-template-columns: 1fr; gap: 12px; } @media (min-width: 900px) { .two { grid-template-columns: 1.15fr 1fr; } }
.prev { background: var(--soft); border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; font-size: 13.5px; min-height: 60px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: none; padding: 3px 11px; font-size: 12.5px; cursor: pointer; color: var(--ink); } .seg button.on { background: var(--accent); color: var(--accent-ink); }
.cgrps { display: flex; flex-wrap: wrap; gap: 4px 18px; align-items: flex-start; }
.cnt.go { border-color: var(--accent); } .cnt.ok b { color: var(--good); } .cnt.bad b { color: var(--bad); }
.bstrip { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; margin-bottom: 5px; }
.bstrip.hl { border-color: var(--accent); }
.bs-name { min-width: 150px; display: flex; flex-direction: column; line-height: 1.2; }
.bs-g, .bs-s, .bs-act { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.bs-g { padding-inline-end: 8px; border-inline-end: 1px dashed var(--line); }
.bs-s { flex: 1; } .bs-act { margin-inline-start: auto; }
.cnt { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 12px; cursor: pointer; }
.cnt b { color: var(--accent); } .cnt:hover { border-color: var(--accent); } .cnt.on { background: var(--accent-soft); border-color: var(--accent); }
.envtag { font-size: 11.5px; font-weight: 700; border-radius: 6px; padding: 2px 8px; margin: -8px 10px 8px; display: inline-block; }
.envtag.main { background: rgba(42,157,143,.15); color: #2a9d8f; } .envtag.sbx { background: rgba(214,69,69,.15); color: #d64545; }
.pcount { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--line); border-radius: 999px; padding: 0 2px 0 8px; font-size: 12px; }
.pc-n { border: 0; border-radius: 999px; min-width: 22px; height: 20px; font-weight: 700; background: var(--soft); color: var(--muted); cursor: pointer; }
.pc-n.on { background: var(--accent); color: var(--accent-ink); }
.ctl { border: 1px solid var(--line); border-radius: 10px; padding: 6px; background: var(--card); overflow-x: auto; }
.ctl-row { display: flex; align-items: center; min-height: 24px; border-bottom: 1px dashed var(--line); min-width: 640px; }
.ctl-row.ours { background: rgba(42,157,143,.08); }
.ctl-head { border-bottom: 1px solid var(--line); min-height: 20px; }
.ctl-lbl { width: 190px; flex-shrink: 0; font-size: 11.5px; line-height: 1.25; overflow: hidden; padding-inline-end: 6px; }
.ctl-lbl b, .ctl-lbl span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctl-lbl span { color: var(--muted); }
.ctl-track { position: relative; flex: 1; height: 20px; }
.ctl-head .ctl-track span { position: absolute; top: 2px; font-size: 10px; color: var(--muted); }
.ctl-bar { position: absolute; top: 3px; height: 14px; border-radius: 4px; color: #fff; font-size: 9.5px; line-height: 14px; text-align: center; overflow: hidden; white-space: nowrap; cursor: pointer; min-width: 6px; }
.ctl-bar.est { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.25) 0 4px, transparent 4px 8px); }
.ctl-now { position: absolute; top: 0; bottom: 0; width: 2px; background: #d64545; opacity: .7; }
table.ltr-table { border-collapse: collapse; font-size: 12px; } table.ltr-table th, table.ltr-table td { border: 1px solid var(--line); padding: 2px 6px; white-space: nowrap; }
.ttag-p { background: #efe7ff; color: #6d28d9; border-color: transparent; }
.ttag-a { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.ttag-m { background: var(--soft); }
.adot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
.amap { display: flex; flex-direction: column; align-items: stretch; gap: 2px; max-width: 760px; margin: 8px auto; }
.amap-stage { border: 1px solid var(--line); border-radius: 12px; padding: 8px; background: var(--card); }
.amap-h { font-weight: 700; margin-bottom: 6px; color: var(--accent); }
.amap-node { border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; margin: 4px 0; background: var(--bg); }
.amap-arrow { text-align: center; color: var(--accent); font-size: 18px; line-height: 1.1; }
.dp-split { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 1000px) { .dp-split { grid-template-columns: 1fr 2fr; } .dp-comp { border-inline-start: 1px dashed var(--line); padding-inline-start: 12px; } }
.tl { border-inline-start: 2px solid var(--accent); padding-inline-start: 10px; }
.tl-item { position: relative; margin: 6px 0; }
.tl-item::before { content: ''; position: absolute; inset-inline-start: -16px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.kcol.drop { outline: 2px dashed var(--accent); }
.kcard[draggable] { cursor: grab; }
.kcol h3 { font-size: 13px; margin: 2px 4px 8px; display: flex; justify-content: space-between; }
.ib { display: grid; grid-template-columns: 1fr; gap: 8px; }

    }).join('') + '</div>';
  }
  if (tab === 'settings') html += d.settings.map(function (s) {
    return '<div class="card"><label class="f"><b>' + esc(s.key) + '</b> · ' + esc(s.type) + ' — ' + esc(s.description) + '</label><div class="row">' +
      (s.type === 'boolean' ? '<select class="grow" id="set_' + esc(s.key) + '">' + opt(['true', 'false'], String(s.value)) + '</select>' :

  }).join('');
  if (tab === 'rules') html += d.rules.map(function (r) {
    return '<div class="card"><label class="f"><b>' + esc(r.rule_key) + '</b> (' + esc(r.module_key) + ') — ' + esc(r.description_ar) + '</label><div class="row">' +
      '<input type="number" step="any" class="grow" id="rul_' + esc(r.rule_key) + '" value="' + esc(r.value) + '"><span class="muted">' + esc(r.unit) + '</span>' +
      '<button class="btn sm" data-act="ruleSave" data-id="' + esc(r.rule_key) + '">حفظ</button></div></div>';
  }).join('');
  if (tab === 'options') {
    var g = {};
    d.options.forEach(function (o) { (g[o.list_key] = g[o.list_key] || []).push(o); });
    html += Object.keys(g).map(function (k) {
      return '<details class="card"><summary><b>' + esc(k) + '</b> (' + g[k].length + ')</summary><div class="chips">' +
        g[k].map(function (o) { return chip(o.value, o.active === 'لا' ? '' : 'acc'); }).join('') + '</div>' +
        '<div class="row" style="margin-top:6px"><input type="text" class="grow" id="opv_' + esc(k) + '" placeholder="قيمة جديدة"><input type="text" class="grow" id="opd_' + esc(k) + '" placeholder="الوصف">' +
        '<button class="btn sm" data-act="optAdd" data-id="' + esc(k) + '">إضافة</button></div></details>';
    }).join('');
  }
  return html;
} };
ACT.setSave = function (el) { act('saveSetting', { key: el.dataset.id, value: val('set_' + el.dataset.id) }, 'حُفظ', false); };
ACT.ruleSave = function (el) { act('saveRule', { rule_key: el.dataset.id, value: val('rul_' + el.dataset.id) }, 'حُفظ', false); };
ACT.optAdd = function (el) { act('addOption', { list_key: el.dataset.id, value: val('opv_' + el.dataset.id), description: val('opd_' + el.dataset.id) }, 'أُضيفت — ظهرت في القوائم والتوجيه'); };

/* ─── إضافات ملف العميل: العرض، الخرّيج، فرصة B2B ─── */

  <style>

@media (min-width: 900px) { .fnodes { flex-direction: column; flex-wrap: nowrap; } }

/* وضع العرض: رسم نظيف بأسماء المراحل فقط */
.present .qbar, .present .legend, .present .node .sub, .present .node .bd, .present .ctl, .present .north { display: none !important; }
.present .node { border-inline-start-color: var(--accent) !important; background: var(--card) !important; opacity: 1 !important; cursor: default; }

<script>
/* ═══════════ المخطط — لوحة التحكم الرئيسية (٤.٨) ═══════════ */
var FLOW = { present: false, data: null };
var STATUS_TXT = { ok: 'تعمل', off: 'معطّلة', error: 'فشل آخر تشغيل', never: 'لم تُشغَّل بعد', deferred: 'مؤجّلة (الحصة)', owner: 'نقطة التحكم البشري' };

SCREENS.flow = {
  render: function (d) {
    FLOW.data = d;
    var u = d.usage, c = d.claude;
    var qCls = u.pct >= 70 ? 'bad' : (u.pct >= 60 ? 'warn' : '');
    var cPct = c.budget ? Math.round(c.spent / c.budget * 100) : 0;
    var html = '<div id="flowroot" class="' + (FLOW.present ? 'present' : '') + '">' + north(d.north) +
      '<h1>المخطط <span class="ctl row" style="margin-inline-start:auto;gap:6px">' +
      '<button class="btn sm" data-act="flowPresent">' + (FLOW.present ? 'خروج من العرض' : 'عرض للاجتماع') + '</button>' +
      '</span>' + (FLOW.present ? '<button class="btn sm" data-act="flowPresent">خروج</button> <button class="btn sm pri" data-act="flowPng">تصدير PNG</button>' : '') + '</h1>' +
      '<div class="qbar">' +
      '<div><div class="lab"><span>تشغيل اليوم: ' + Math.round(u.sec / 60 * 10) / 10 + ' من ' + u.quota_min + ' دقيقة</span><span>' + u.pct + '%</span></div>' +
      '<div class="bar ' + qCls + '"><i style="width:' + Math.min(100, u.pct) + '%"></i></div>' +
      '<div class="lab"><span>الـ tick الخامل: ' + u.idle_avg_sec + ' ث</span><span>ticks: ' + u.ticks + '</span></div></div>' +
      '<div><div class="lab"><span>Claude اليوم: ' + c.spent + '$ من ' + c.budget + '$</span><span>' + cPct + '%</span></div>' +
      '<div class="bar ' + (cPct >= 100 ? 'bad' : cPct >= 70 ? 'warn' : '') + '"><i style="width:' + Math.min(100, cPct) + '%"></i></div></div>' +
      '<div class="master ' + (d.paused ? 'paused' : '') + '"><b>' + (d.paused ? '⏸ الأتمتة موقوفة' : 'كل الأتمتة تعمل') + '</b>' +
      switchHtml(!d.paused, 'flowMaster', 'all') + '</div></div>' +
      (d.raise_tick_hint ? '<div class="card small" style="border-color:var(--warn)">الاستهلاك تجاوز ٦٠٪ — ارفع tick_minutes إلى 15 من <a href="#" data-go="settings">الإعدادات</a>.</div>' : '') +
      (u.pct >= 70 ? '<div class="card small" style="border-color:var(--bad)">تجاوز ٧٠٪: الوحدات غير الحرجة مؤجّلة لليوم التالي.</div>' : '') +
      '<div class="legend">' + [['ok', 'var(--good)'], ['off', 'var(--off)'], ['error', 'var(--bad)'], ['never', '#e0b100'], ['deferred', 'var(--orange)'], ['owner', 'var(--owner)']]
        .map(function (x) { return '<span><i style="background:' + x[1] + '"></i>' + STATUS_TXT[x[0]] + '</span>'; }).join('') + '</div>' +
      '<div class="flow" id="flow"><svg class="edges" id="edges"></svg>' + d.groups.map(function (g) {
        return '<div class="fstage"><h3>' + esc(g.stage) + '</h3><div class="fnodes">' + g.nodes.map(nodeHtml).join('') + '</div></div>';
      }).join('') + '</div></div>';
    return html;
  },
  after: function () { requestAnimationFrame(drawEdges); }
};

function nodeHtml(n) {
  var sub = n.kind === 'human' ? 'كل رد غير مُرقّى يمر من هنا' :
    (n.last_run ? fmtDate(n.last_run, true) + ' · ' + (n.last_items || 0) + ' عنصر' : (n.phase1 ? 'المرحلة الأولى' : 'لم تُشغَّل')) +
    (n.schedule && n.kind !== 'human' ? ' · ' + esc(n.schedule) : '');
  return '<button class="node ' + n.status + '" data-node="' + esc(n.key) + '" data-act="flowNode" data-id="' + esc(n.key) + '">' +
    '<span class="nm">' + esc(n.name) + '</span><span class="sub">' + sub + '</span>' +
    (n.badges.length ? '<span class="bd">' + n.badges.map(function (b) { return '<span>' + esc(b.name) + '</span>'; }).join('') + '</span>' : '') + '</button>';
}

/** الأسهم: المصادر → أول عقدة في الاستقبال، ثم سلسلة داخل كل مرحلة، ثم آخر المرحلة → أول التالية */
function drawEdges() {
  var root = $('flow'), svg = $('edges');
  if (!root || !svg || !FLOW.data) return;
  var box = root.getBoundingClientRect();
  var horiz = window.innerWidth >= 900;
  var groups = FLOW.data.groups;
  var edges = [];
  groups.forEach(function (g, i) {
    var next = groups[i + 1];
    if (i === 0 && next) g.nodes.forEach(function (n) { edges.push([n, next.nodes[0]]); });
    else {
      for (var k = 0; k + 1 < g.nodes.length; k++) edges.push([g.nodes[k], g.nodes[k + 1]]);
      if (next) edges.push([g.nodes[g.nodes.length - 1], next.nodes[0]]);
    }
  });
  var rect = function (key) {
    var el = root.querySelector('[data-node="' + key + '"]');
    if (!el) return null;
    var r = el.getBoundingClientRect();
    return { l: r.left - box.left, r: r.right - box.left, t: r.top - box.top, b: r.bottom - box.top, cx: (r.left + r.right) / 2 - box.left, cy: (r.top + r.bottom) / 2 - box.top };
  };
  var col = getComputedStyle(document.documentElement).getPropertyValue('--muted') || '#888';
  var out = '<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="' + col + '"/></marker></defs>';
  edges.forEach(function (e) {
    var a = rect(e[0].key), b = rect(e[1].key);
    if (!a || !b) return;
    var sameCol = Math.abs(a.cx - b.cx) < 30;
    var x1, y1, x2, y2, path;
    if (horiz && !sameCol) {           // RTL: من اليمين إلى اليسار
      x1 = a.l; y1 = a.cy; x2 = b.r; y2 = b.cy;
      var mx = (x1 + x2) / 2;
      path = 'M' + x1 + ' ' + y1 + ' C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2;
    } else {                           // عمودياً: من الأسفل إلى الأعلى التالي
      x1 = a.cx; y1 = a.b; x2 = b.cx; y2 = b.t;
      if (y2 < y1) { y1 = a.cy; x1 = a.l; x2 = b.r; y2 = b.cy; }
      var my = (y1 + y2) / 2;
      path = 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + y2;
    }
    var dim = !e[1].enabled && e[1].kind !== 'human';
    out += '<path d="' + path + '" fill="none" stroke="' + col + '" stroke-width="1.4" opacity="' + (dim ? 0.18 : 0.55) + '"' +
      (dim ? ' stroke-dasharray="4 4"' : '') + ' marker-end="url(#ah)"/>';
  });
  svg.setAttribute('viewBox', '0 0 ' + box.width + ' ' + box.height);
  svg.innerHTML = out;
}
window.addEventListener('resize', function () { if (S.screen === 'flow') drawEdges(); });

ACT.flowPresent = function () { FLOW.present = !FLOW.present; $('main').innerHTML = SCREENS.flow.render(FLOW.data); requestAnimationFrame(drawEdges); };
ACT.flowMaster = function (el) {
  var paused = !el.checked;
  if (paused && !confirm('إيقاف كل الأتمتة الآن؟ (موافقتك على الردود تبقى متاحة)')) { el.checked = true; return; }
  act('pauseAll', { paused: paused }, paused ? '⏸ أُوقفت كل الأتمتة' : '▶ استُؤنفت الأتمتة');
};

/* ─── اللوحة الجانبية لعقدة ─── */
ACT.flowNode = function (el) {
  if (FLOW.present) return;
  openSheet('<div class="loading">…</div>');
  api('screen', 'node', { module_key: el.dataset.id }).then(renderNodePanel).catch(function (e) { toast(errMsg(e), true); closeSheet(); });
};

function schedEditor(s) {
  var p = String(s || '').trim(), type = 'manual', hm = '06:00', day = 'SUN';
  var m;
  if (/^\d+\s*m$/i.test(p)) type = p.toLowerCase().replace(/\s/g, '') === '10m' ? '10m' : 'custom';
  else if (/^1h$/i.test(p)) type = '1h';
  else if ((m = p.match(/^daily\s+(\d{1,2}:\d{2})/i))) { type = 'daily'; hm = m[1]; }
  else if ((m = p.match(/^weekly\s+([A-Z]{3})\s+(\d{1,2}:\d{2})/i))) { type = 'weekly'; day = m[1].toUpperCase(); hm = m[2]; }
  var days = [['SUN', 'الأحد'], ['MON', 'الاثنين'], ['TUE', 'الثلاثاء'], ['WED', 'الأربعاء'], ['THU', 'الخميس'], ['FRI', 'الجمعة'], ['SAT', 'السبت']];
  return '<div class="row"><select id="stype" class="grow">' + [['10m', 'كل ١٠ دقائق'], ['1h', 'كل ساعة'], ['daily', 'يومي'], ['weekly', 'أسبوعي'], ['manual', 'يدوي']]
    .map(function (o) { return '<option value="' + o[0] + '"' + (o[0] === type ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>' +
    '<select id="sday" style="width:auto">' + days.map(function (d) { return '<option value="' + d[0] + '"' + (d[0] === day ? ' selected' : '') + '>' + d[1] + '</option>'; }).join('') + '</select>' +
    '<input id="shm" type="text" value="' + esc(hm) + '" style="width:80px" inputmode="numeric"></div>' +
    '<div class="muted small">الحالية: ' + esc(s) + ' — التغيير يعدّل صف Modules فقط، ويبقى الـ Trigger واحداً.</div>';
}

function renderNodePanel(d) {
  var m = d.module;
  var st = m.kind === 'human' ? 'owner' : (m.enabled !== 'مفعّل' ? 'off' : (m.last_status === 'error' ? 'error' : m.last_status === 'deferred' ? 'deferred' : (!m.last_run ? 'never' : 'ok')));
  var html = '<h1>' + esc(m.module_name_ar) + '</h1><div class="chips">' + chip(STATUS_TXT[st], st === 'ok' ? 'good' : st === 'error' ? 'bad' : st === 'owner' ? 'owner' : 'warn') +
    chip(m.kind) + (m.critical === 'نعم' ? chip('حرجة', 'acc') : chip('غير حرجة')) + chip(m.module_key) + '</div>' +
    (m.notes ? '<div class="muted small" style="margin-top:6px">' + esc(m.notes) + '</div>' : '');
  if (d.locked) {
    html += '<div class="card" style="border-color:var(--owner);margin-top:10px"><b style="color:var(--owner)">نقطة التحكم البشري — لا تُعطَّل</b>' +
      '<div class="small">إلغاء المراجعة البشرية يتم فقط بترقية كل جواب على حدة في بنك الأجوبة (٣ اعتمادات متتالية بلا تعديل). ' +
      'ولا يُرسل آلياً أبداً أي رد فيه سعر أو خصم أو تاريخ أو تعهّد.</div></div>';
  } else {
    html += '<div class="card" style="margin-top:10px"><div class="row between"><b>تشغيل / إيقاف</b>' + switchHtml(m.enabled === 'مفعّل', 'nodeEnable', m.module_key) + '</div>' +
      (m.handler ? '<div class="btns"><button class="btn pri" data-act="nodeRun" data-id="' + esc(m.module_key) + '">شغّلها الآن</button></div><div id="runres" class="small"></div>' : '') + '</div>';
    if (m.handler) html += '<div class="card"><b>الجدولة</b>' + schedEditor(m.schedule) +
      '<div class="btns"><button class="btn" data-act="nodeSched" data-id="' + esc(m.module_key) + '">حفظ الجدولة</button></div></div>';
  }
  d.prompts.forEach(function (p, i) {
    html += '<div class="card"><div class="row between"><b>الأوامر: ' + esc(p.title || p.key) + '</b>' + chip('v' + p.version) + '</div>' +
      '<textarea class="mono" id="pr' + i + '" style="min-height:220px">' + esc(p.text) + '</textarea>' +
      '<div class="muted small">متغيّرات متاحة: {{settings.x}} {{options.segment}} {{courses.active}} {{rules.x}}</div>' +
      '<div class="btns"><button class="btn pri" data-act="nodePrompt" data-id="' + esc(p.key) + '" data-i="' + i + '">حفظ نسخة جديدة</button>' +
      (p.versions > 1 ? '<button class="btn" data-act="nodeRollback" data-id="' + esc(p.key) + '">رجوع للنسخة السابقة</button>' : '') + '</div></div>';
  });
  if (d.rules.length) html += '<div class="card"><b>العتبات</b>' + d.rules.map(function (r) {
    return '<label class="f">' + esc(r.description_ar) + ' (' + esc(r.unit) + ')</label><div class="row"><input type="number" step="any" class="grow" id="rl_' + esc(r.rule_key) +
      '" value="' + esc(r.value) + '"><button class="btn sm" data-act="nodeRule" data-id="' + esc(r.rule_key) + '">حفظ</button></div>';
  }).join('') + '</div>';
  if (d.settings.length) html += '<div class="card"><b>إعدادات الوحدة</b>' + d.settings.map(function (s) {
    return '<label class="f">' + esc(s.description || s.key) + ' <code>' + esc(s.key) + '</code></label><div class="row"><input type="text" class="grow" id="st_' + esc(s.key) +
      '" value="' + esc(s.value) + '"><button class="btn sm" data-act="nodeSetting" data-id="' + esc(s.key) + '">حفظ</button></div>';
  }).join('') + '</div>';

/* ─── تصدير PNG من وضع العرض: رسم مستقل على canvas بنفس المواقع ─── */
ACT.flowPng = function () {
  var root = $('flow'); if (!root) return;
  var box = root.getBoundingClientRect(), scale = 2;
  var cv = document.createElement('canvas');
  cv.width = Math.ceil(box.width * scale); cv.height = Math.ceil(box.height * scale) + 60 * scale;
  var g = cv.getContext('2d'); g.scale(scale, scale);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, box.width, box.height + 60);
  g.direction = 'rtl'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillStyle = '#14181f'; g.font = '700 18px "IBM Plex Sans Arabic", Tahoma, sans-serif';
  g.fillText('تدفق نظام التسويق والتشغيل', box.width / 2, 24);
  g.translate(0, 50);
  var img = new Image();
  var svg = $('edges').outerHTML.replace('<svg', '<svg xmlns="http://www.w3.org/2000/svg" width="' + box.width + '" height="' + box.height + '"')
    .replace(/var\(--muted\)/g, '#667085');
  img.onload = function () {
    g.drawImage(img, 0, 0);
    root.querySelectorAll('.fstage > h3').forEach(function (h) {
      var r = h.getBoundingClientRect();
      g.fillStyle = '#667085'; g.font = '600 12.5px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      g.fillText(h.textContent, r.left - box.left + r.width / 2, r.top - box.top + r.height / 2);
    });
    root.querySelectorAll('.node').forEach(function (n) {
      var r = n.getBoundingClientRect(), x = r.left - box.left, y = r.top - box.top, own = n.classList.contains('owner');
      g.fillStyle = own ? '#efe7fd' : '#ffffff'; g.strokeStyle = own ? '#6d28d9' : '#0b6e7f'; g.lineWidth = own ? 2.5 : 1.5;
      roundRect(g, x, y, r.width, r.height, 12); g.fill(); g.stroke();
      g.fillStyle = own ? '#6d28d9' : '#14181f'; g.font = (own ? '700 15px' : '600 13.5px') + ' "IBM Plex Sans Arabic", Tahoma, sans-serif';
      g.fillText(n.querySelector('.nm').textContent, x + r.width / 2, y + r.height / 2);
    });
    var url = cv.toDataURL('image/png');
    openSheet('<h1>صورة المخطط</h1><div class="muted small">إن لم يبدأ التنزيل: اضغط مطولاً على الصورة (الجوال) أو زر الفأرة الأيمن ← حفظ.</div>' +
      '<a class="btn pri" download="academy-flow.png" href="' + url + '">تنزيل PNG</a><img src="' + url + '" style="width:100%;margin-top:10px;border-radius:12px;border:1px solid var(--line)">');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function kidsOf(d, id) { return d.people.filter(function (p) { return (p.reports_to || '') === id && p.contact_id !== id; }); }
function roots(d) {
  var ids = {}; d.people.forEach(function (p) { ids[p.contact_id] = 1; });
  return d.people.filter(function (p) { return !p.reports_to || !ids[p.reports_to]; }).sort(function (a, b) { return a.level - b.level; });
}
function relColor(r) { var o = ORG.data.relationships.filter(function (x) { return x.value === r; })[0]; return o ? o.description : '#8a94a3'; }
function pnodeHtml(p, top) {
  var kids = kidsOf(ORG.data, p.contact_id);
  var hidden = kids.filter(function (k) { return Number(k.level) >= 3; }).length;
  var folded = ORG.folded[p.contact_id] !== undefined ? ORG.folded[p.contact_id] : hidden > 0;
  return '<button class="pnode' + (top ? ' top' : '') + '" draggable="true" data-pid="' + esc(p.contact_id) + '" data-act="personCard" data-id="' + esc(p.contact_id) + '">' +
    '<span class="st" style="background:' + (STATUS_COLOR[p.status] || '#e0b100') + '"></span>' + pframe(p, false) +
    '<span><span class="nm">' + esc(p.full_name) + '</span><span class="tt">' + esc(p.title_ar) + '</span></span>' +
    '<span class="rel" style="background:' + relColor(p.relationship) + '"></span>' +
    (kids.length ? '<span class="fold" data-act="orgFold" data-id="' + esc(p.contact_id) + '">' + (folded ? '+' + kids.length : '▴') + '</span>' : '') + '</button>';
}
function subtree(p, top) {
  var kids = kidsOf(ORG.data, p.contact_id);
  var hidden = kids.filter(function (k) { return Number(k.level) >= 3; }).length;
  var folded = ORG.folded[p.contact_id] !== undefined ? ORG.folded[p.contact_id] : hidden > 0;
  return '<div class="tn">' + pnodeHtml(p, top) + (kids.length && !folded ? '<div class="kids">' + kids.map(function (k) { return subtree(k, false); }).join('') + '</div>' : '') + '</div>';
}
function orgTree(d) {
  var rs = roots(d), top = rs.filter(function (p) { return Number(p.level) === 1; })[0];
  var covered = {}; d.people.forEach(function (p) { covered[p.department] = 1; });
  var empties = d.departments.filter(function (x) { return x.value !== 'أخرى' && !covered[x.value]; }).map(function (x) {
    return '<div class="tn"><button class="dnode" data-act="orgAdd" data-dept="' + esc(x.value) + '" style="border-color:' + esc(x.description) + '">' + esc(x.value) + '<br>＋ أضف</button></div>';
  }).join('');
  if (top) {
    var others = rs.filter(function (p) { return p !== top; });
    var kids = kidsOf(d, top.contact_id).concat(others);
    return '<div class="tn">' + pnodeHtml(top, true) + '<div class="kids">' + kids.map(function (k) { return subtree(k, false); }).join('') + empties + '</div></div>';
  }
  return '<div class="tn"><div class="dnode" style="border-color:var(--owner)">المسؤول الأول غير معروف<br><button class="btn sm" data-act="orgAdd" data-level="1">＋ أضف</button></div>' +
    '<div class="kids">' + rs.map(function (k) { return subtree(k, false); }).join('') + empties + '</div></div>';
}
function orgList(d) {
  function li(p) {
    var kids = kidsOf(d, p.contact_id);
    return '<li><div class="row" data-act="personCard" data-id="' + esc(p.contact_id) + '" style="cursor:pointer">' + pframe(p, false) +
      '<span><b>' + esc(p.full_name) + '</b><br><span class="muted small">' + esc(p.title_ar) + ' · ' + esc(p.department) + '</span></span>' +
      '<span class="chip" style="background:' + (STATUS_COLOR[p.status] || '#e0b100') + ';color:#fff">' + esc(p.status) + '</span></div>' +
      (kids.length ? '<details' + (Number(kids[0].level) >= 3 ? '' : ' open') + '><summary class="small">يتبعه ' + kids.length + '</summary><ul>' + kids.map(li).join('') + '</ul></details>' : '') + '</li>';
  }
  return '<div class="card orglist"><ul style="border:0;padding:0">' + (roots(d).map(li).join('') || empty('لا أشخاص بعد — «حدّث هذا المشغّل» أو «أضف شخصاً»')) + '</ul></div>';
}
function orgLines() {
  var z = $('orgzoom'), svg = $('orgsvg');
  if (!z || !svg) return;
  var box = z.getBoundingClientRect(), s = ORG.zoom, out = '';
  var col = getComputedStyle(document.documentElement).getPropertyValue('--muted') || '#888';
  Array.prototype.forEach.call(z.querySelectorAll('.tn'), function (tn) {
    var parent = tn.querySelector(':scope > .pnode, :scope > .dnode'), kids = tn.querySelector(':scope > .kids');
    if (!parent || !kids) return;
    var a = parent.getBoundingClientRect();
    Array.prototype.forEach.call(kids.querySelectorAll(':scope > .tn > .pnode, :scope > .tn > .dnode'), function (k) {
      var b = k.getBoundingClientRect();
      var x1 = (a.left + a.width / 2 - box.left) / s, y1 = (a.bottom - box.top) / s, x2 = (b.left + b.width / 2 - box.left) / s, y2 = (b.top - box.top) / s, my = (y1 + y2) / 2;
      out += '<path d="M' + x1 + ' ' + y1 + ' V' + my + ' H' + x2 + ' V' + y2 + '" fill="none" stroke="' + col + '" stroke-width="1.3" opacity=".6"/>';
    });
  });
  svg.innerHTML = out;
}
function bindOrgDrag() {
  var nodes = document.querySelectorAll('.pnode[draggable]');
  Array.prototype.forEach.call(nodes, function (n) {
    n.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text', n.dataset.pid); });
    n.addEventListener('dragover', function (e) { e.preventDefault(); n.classList.add('drop'); });
    n.addEventListener('dragleave', function () { n.classList.remove('drop'); });
    n.addEventListener('drop', function (e) {
      e.preventDefault(); n.classList.remove('drop');
      var who = e.dataTransfer.getData('text');
      if (who && who !== n.dataset.pid) act('contactReportsTo', { contact_id: who, boss_id: n.dataset.pid }, 'تغيّرت التبعية');
    });
  });
  var w = $('orgwrap');
  if (w) {
    w.addEventListener('wheel', function (e) { if (e.ctrlKey) { e.preventDefault(); orgSetZoom(ORG.zoom * (e.deltaY < 0 ? 1.1 : 0.9)); } }, { passive: false });
    var pinch = null;
    w.addEventListener('touchmove', function (e) {
      if (e.touches.length !== 2) return;
      var dd = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (pinch) orgSetZoom(ORG.zoom * dd / pinch);
      pinch = dd;
    }, { passive: true });
    w.addEventListener('touchend', function () { pinch = null; });
  }
}
function orgSetZoom(z) { ORG.zoom = Math.max(0.4, Math.min(2, z)); var el = $('orgzoom'); if (el) el.style.transform = 'scale(' + ORG.zoom + ')'; requestAnimationFrame(orgLines); }
ACT.orgZoom = function (el) { orgSetZoom(ORG.zoom * Number(el.dataset.z)); };
ACT.orgCenter = function () { ORG.zoom = 1; orgSetZoom(1); var w = $('orgwrap'); if (w) w.scrollLeft = (w.scrollWidth - w.clientWidth) / 2; };

var PIPE_COLORS = { 'جديد': '#3a86ff', 'تواصلنا': '#8d6cd8', 'رد': '#e9a23b', 'عرض مُرسل': '#e76f51', 'سجّل': '#2a9d8f', 'مفقود': '#8a817c' };
SCREENS.pipeline = { render: function (d) {
  PIPE.data = d;
  var due = d.rows.filter(function (r) { return r.overdue; }).length;
  var html = north(d.north) + '<h1>🧲 مراحل العملاء ' + chip(d.rows.length) + (due ? chip(due + ' متابعة مستحقة', 'bad') : '') + '</h1>';
  html += '<div class="tabs">' + [['board', 'لوحة المراحل'], ['psych', '🧠 دليل علم النفس للتقفيل']].map(function (t) {
    return '<button class="btn sm' + (PIPE.tab === t[0] ? ' pri' : '') + '" data-act="pipeTab" data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div>';
  if (PIPE.tab === 'psych') return html + pipePsychGuide_(d);
  var fl = d.flt || {};
  html += '<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:6px;align-items:center"><input type="text" id="pipe_q" class="grow" style="min-width:180px" placeholder="🔍 ابحث بالاسم، الجوال، النمط، الاعتراض، الدورة…" value="' + esc(PIPE.f) + '">' +
    '<select id="pf_days">' + [[7, 'آخر 7 أيام'], [30, 'آخر 30 يوماً'], [90, 'آخر 90 يوماً']].map(function (x) { return '<option value="' + x[0] + '"' + (d.days === x[0] ? ' selected' : '') + '>' + x[1] + '</option>'; }).join('') + '</select>' +
    '<select id="pf_course"><option value="">كل الدورات</option>' + (d.courses || []).map(function (c) { return '<option' + (fl.course === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
    '<select id="pf_src"><option value="">كل المصادر</option>' + (d.sources_list || []).map(function (c) { return '<option' + (fl.source === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select>' +
    '<span class="muted tiny">اسحب البطاقة بين الأعمدة · اضغطها لفتح الملف</span></div>';
  html += pipeFunnelHtml_(d.funnel, d.insight);
  html += '<div class="card small" style="border-color:#2a9d8f;background:#eef9f6">⚙️ <b>آلي — كود الخصم الشخصي:</b> يصدر وحده لمن يسأل عن السعر (واتساب: يُرسل فوراً · المنصات العامة: جاهز بضغطة)، ' +
    'يذكّر العميل حين يبقى ١٢ ساعة ثم قبل الانتهاء بساعة، وينتهي بعد ٢٤ ساعة. أكواد نشطة الآن: <b>' + (d.codes_active || 0) + '</b>' +
    ' · <a href="#" data-act="codeCheck">🔎 تحقق من كود عند التسجيل</a></div>';
  html += '<div class="kanban">' + d.stages.map(function (s) {
    var list = d.rows.filter(function (r) { return r.status === s; }), st = (d.funnel.stages || []).filter(function (x) { return x.name === s; })[0];
    return '<div class="kcol" data-stage="' + esc(s) + '"><h3><span><span style="display:inline-block;width:9px;height:9px;border-radius:3px;background:' + (PIPE_COLORS[s] || '#888') + '"></span> ' + esc(s) + '</span>' + chip(list.length) + '</h3>' +
      list.map(function (r) {
        var hay = [r.name, r.phone, r.psych_type, r.objection, r.course, r.source, r.step].join(' ');
        return '<div class="card click kcard' + (r.late || r.overdue ? ' kc-late' : '') + '" draggable="true" data-id="' + esc(r.lead_id) + '" data-hay="' + esc(hay) + '" data-go="lead" data-args="' + attr({ lead_id: r.lead_id }) + '" style="border-inline-start:4px solid ' + (PIPE_COLORS[r.status] || '#888') + '">' +
          '<div class="row between"><b>' + esc(r.name) + '</b>' + (r.late ? '<span class="tag bad">⏰ ' + esc(r.late) + '</span>' : r.overdue ? '<span class="tag bad">⏰ مستحقة</span>' : '') + '</div>' +
          '<div class="chips">' + chip('🧠 ' + r.psych_type, 'acc') + (r.objection ? chip('✋ ' + r.objection, 'warn') : '') + (r.opt_out === 'نعم' ? chip('لا تراسل', 'bad') : '') + (r.code ? chip('🎟 ' + r.code + (r.code_left_h !== undefined ? ' · ' + r.code_left_h + ' س' : ''), 'warn') : '') + '</div>' +
          (r.course ? '<div class="muted small">' + esc(r.course) + (r.age_h !== null && r.age_h !== undefined ? ' · في المرحلة ' + (r.age_h >= 48 ? Math.round(r.age_h / 24) + ' يوماً' : Math.round(r.age_h) + ' س') : '') + '</div>' : (r.age_h !== null && r.age_h !== undefined ? '<div class="muted small">في المرحلة ' + (r.age_h >= 48 ? Math.round(r.age_h / 24) + ' يوماً' : Math.round(r.age_h) + ' س') + '</div>' : '')) +
          (r.post_url || r.profile_url ? '<div class="chips">' + (r.post_url ? '<a class="chip acc" target="_blank" rel="noopener" href="' + esc(r.post_url) + '" onclick="event.stopPropagation()">📝 منشوره ↗</a>' : '') + (r.profile_url ? '<a class="chip" target="_blank" rel="noopener" href="' + esc(r.profile_url) + '" onclick="event.stopPropagation()">👤 ↗</a>' : '') + '</div>' : '') +
          (r.dormant_hint ? '<div class="small" style="background:var(--warn-soft);border-radius:6px;padding:2px 6px">⚠️ بلا رد منذ ' + r.dormant_hint + ' يوماً — <a href="#" data-act="leadDormant" data-id="' + esc(r.lead_id) + '" onclick="event.stopPropagation()">انقله «خامل»</a></div>' : '') +
          '<div class="small">➡️ ' + esc(r.step) + (r.due ? ' <span class="muted">· ' + fmtDate(r.due, true) + '</span>' : '') + '</div></div>';
      }).join('') + '</div>';
  }).join('') + '</div>';
  html += pipeBottom_(d.funnel);
  return html;
}, after: function () { pipeFilter_(); } };
/** قمع التحويل: كم وصل لكل مرحلة، نسبة الانتقال للتالية، زمن البقاء، وأكبر تسرّب (من العقل) */
function pipeFunnelHtml_(f, ins) {
  if (!f || !f.n) return '<div class="card small muted">🧠 لا عملاء في هذه الفترة بعد — يظهر القمع عند وصول أول العملاء</div>';
  var h = '<div class="pf">' + f.stages.map(function (s, i) {
    var w = f.stages[0].n ? Math.max(4, Math.round(100 * s.n / f.stages[0].n)) : 4;
    return '<div class="pf-st"' + (s.samples ? ' data-tip="متوسط البقاء في هذه المرحلة محسوب من ' + s.samples + ' انتقال فعلي"' : ' data-tip="لا سجل انتقالات كافٍ بعد لحساب زمن البقاء"') + '>' +
      (i ? '<span class="pf-arr' + (s.conv !== null && s.conv < 40 ? ' bad' : '') + '">' + (s.conv === null ? '—' : s.conv + '%') + ' ←</span>' : '') +
      '<b>' + s.n + '</b> ' + esc(s.name) + (s.hours !== null ? '<span class="muted tiny"> · ' + (s.hours >= 48 ? Math.round(s.hours / 24) + ' يوم' : s.hours + ' س') + '</span>' : '') +
      '<div class="pf-bar"><i style="width:' + w + '%;background:' + (PIPE_COLORS[s.name] || '#888') + '"></i></div></div>';
  }).join('') + '</div>';
  var lines = (ins || []).map(function (x) { return '<div class="small">' + esc(x.icon) + ' ' + esc(x.text) + '</div>'; }).join('');
  return h + (lines || '<div class="small muted">🧠 العقل يتعلّم: يحتاج ' + 5 + ' عملاء على الأقل في المرحلة ليحدد أكبر تسرّب</div>') + (f.note ? '<div class="muted tiny" style="margin-top:2px">ℹ️ ' + esc(f.note) + '</div>' : '');
}
function pipeBottom_(f) {
  if (!f || !f.n) return '';
  var mx = Math.max.apply(null, (f.lost || []).map(function (x) { return x.n; }).concat([1]));
  var lost = (f.lost || []).slice(0, 6).map(function (x) { return '<div class="ct-ev"><span class="ct-tx">' + esc(x.reason) + '</span><span class="pf-b"><i style="width:' + Math.round(100 * x.n / mx) + '%;background:#e5484d"></i></span><b>' + x.n + '</b></div>'; }).join('') || '<div class="muted small">لا خسائر في هذه الفترة</div>';
  var src = (f.sources || []).slice(0, 6).map(function (x) { return '<div class="ct-ev"><span class="ct-tx">' + esc(x.src) + (x.low ? ' <span class="muted tiny">(عيّنة صغيرة)</span>' : '') + '</span><span class="pf-b"><i style="width:' + Math.max(3, x.rate) + '%;background:#2bb673"></i></span><b>' + x.rate + '%</b><span class="muted tiny">' + x.reg + '/' + x.n + '</span></div>'; }).join('');
  return '<div class="ct-grid" style="grid-template-columns:1fr 1fr;margin-top:8px"><div class="card"><b>🏷️ لماذا نخسر؟</b> <span class="muted tiny">— السبب إلزامي عند «مفقود»</span>' + lost + '</div>' +
    '<div class="card"><b>📊 من أين يأتي الأفضل؟</b> <span class="muted tiny">— نسبة التسجيل حسب المصدر</span>' + src + '</div></div>';
}
document.addEventListener('change', function (e) {
  if (!e.target || ['pf_days', 'pf_course', 'pf_src'].indexOf(e.target.id) < 0) return;
  go('pipeline', { days: Number(val('pf_days')), course: val('pf_course'), source: val('pf_src') });
});
/** نقل إلى «مفقود»: يلزم سبب الخسارة (يتعلّم منه العقل) */
function pipeLostModal_(lead, then) {
  window.__pl = { lead: lead, then: then };
  openSheet('<h3 style="margin:0 0 6px">🏷️ لماذا خسرنا «' + esc(lead.name) + '»؟</h3><div class="muted tiny" style="margin-bottom:6px">اختر السبب الأقرب — يستعمله العقل ليقترح كيف نخسر أقل.</div>' +
    '<div class="chips">' + (PIPE.data.lost_reasons || []).map(function (r) { return '<button class="btn" data-act="plLost" data-r="' + esc(r) + '">' + esc(r) + '</button>'; }).join('') + '</div>' +
    '<div class="btns"><button class="btn" data-act="closeSheet">إلغاء (يبقى في مكانه)</button></div>');
}
ACT.plLost = function (el) {
  var p = window.__pl || {}; if (!p.lead) return;
  api('action', 'leadStage', { lead_id: p.lead.lead_id, status: 'مفقود', reason: el.dataset.r }).then(function () { toast('«' + p.lead.name + '» ← مفقود (' + el.dataset.r + ')'); var c = $('sheet'); if (c) c.remove(); go('pipeline', PIPE.data ? { days: PIPE.data.days, course: PIPE.data.flt.course, source: PIPE.data.flt.source } : {}, true); })
    .catch(function (e2) { toast(errMsg(e2), true); });
};
ACT.codeCheck = function () {
  openSheet('<h1>🔎 تحقق من كود خصم</h1><input type="text" id="cc_code" placeholder="AO-XXXX" style="direction:ltr"><div class="btns"><button class="btn pri" data-act="codeCheckGo">تحقق</button></div><div id="cc_out"></div>');
};
ACT.codeCheckGo = function () {
  var c = val('cc_code').trim().toUpperCase(); if (!c) return;
  api('action', 'discountCheck', { code: c }).then(function (r) {
    $('cc_out').innerHTML = !r.ok ? empty(r.error) : '<div class="card"><b>' + esc(r.code) + '</b> ' + chip(r.status, r.valid ? 'good' : 'bad') + '<div>' + esc(r.name || r.contact || '') + '</div><div>' + esc(r.course) +
      ' · <b>' + esc(r.price) + ' ر.س</b> بدل ' + esc(r.our_price) + '</div><div class="muted small">ينتهي ' + fmtDate(r.expires_at, true) + '</div>' +
      (r.valid ? '<div class="btns"><button class="btn good" data-act="codeRedeem" data-id="' + esc(r.code) + '">✅ سجّل استخدامه (تم الدفع)</button></div>' : '') + '</div>';
  }).catch(function (e) { toast(errMsg(e), true); });
};
ACT.codeRedeem = function (el) { act('discountRedeem', { code: el.dataset.id }, 'سُجّل استخدام الكود').then(closeSheet); };

function pipePsychGuide_(d) {
  return '<div class="card small">المبدأ: <b>الإقناع = صدق + توقيت + السؤال الصحيح</b>. لا ندرة مزيفة ولا أسعار أو وعود غير موجودة — كل رسالة تُبنى من بيانات دوراتك الحقيقية فقط.</div>' +
    '<h2>أنماط العملاء النفسية</h2><div class="grid2">' + d.types.map(function (t) {
      return '<div class="card"><b>🧠 ' + esc(t.key) + '</b> ' + chip(t.principle, 'acc') + '<div class="small" style="margin-top:4px">' + esc(t.tip) + '</div></div>'; }).join('') + '</div>' +
    '<h2>مكتبة الاعتراضات وكيف ترد</h2>' + d.objections.map(function (o) {
      return '<details class="card"><summary><b>✋ «' + esc(o.key) + '»</b> ' + chip(o.principle, 'acc') + '</summary><div class="small">' + esc(o.why) + '</div>' +
        '<div class="quote small" style="margin-top:6px">' + esc(o.sample) + '</div></details>'; }).join('') +
    '<h2>توقيت المتابعة</h2><div class="card small">جديد ← رد خلال ٥ دقائق · تواصلنا بلا رد ← سؤال مفتوح بعد ٢٤ ساعة ← رسالة قيمة بعد ٣ أيام · عرض مُرسل ← اكشف الاعتراض بعد ٢٤ ساعة · بدأ الدفع ولم يكمل ← ساعده خلال ساعتين · سجّل ← اطلب ترشيح صديق بعد أسبوع · مفقود ← أعد المحاولة بعد شهر بخبر حقيقي.</div>';
}
function pipeFilter_() {
  var q0 = typeof normAr_ === 'function' ? normAr_(PIPE.f) : PIPE.f;
  q('.kcard').forEach(function (c) { c.style.display = !q0 || (typeof normAr_ === 'function' ? normAr_(c.dataset.hay) : c.dataset.hay).indexOf(q0) > -1 ? '' : 'none'; });
}
ACT.pipeTab = function (el) { PIPE.tab = el.dataset.t; go('pipeline', {}, true); };
document.addEventListener('input', function (e) { if (e.target && e.target.id === 'pipe_q') { PIPE.f = e.target.value; pipeFilter_(); } });
document.addEventListener('dragstart', function (e) { var c = e.target.closest && e.target.closest('.kcard'); if (c) { e.dataTransfer.setData('text/plain', 'lead|' + c.dataset.id); } });
document.addEventListener('dragover', function (e) { var k = e.target.closest && e.target.closest('.kcol[data-stage]'); if (k) { e.preventDefault(); k.classList.add('drop'); } });
document.addEventListener('dragleave', function (e) { var k = e.target.closest && e.target.closest('.kcol[data-stage]'); if (k) k.classList.remove('drop'); });
document.addEventListener('drop', function (e) {
  var k = e.target.closest && e.target.closest('.kcol[data-stage]'); if (!k) return;
  e.preventDefault(); k.classList.remove('drop');
  var p = String(e.dataTransfer.getData('text/plain') || '').split('|'); if (p[0] !== 'lead') return;
  var r = PIPE.data.rows.filter(function (x) { return x.lead_id === p[1]; })[0]; if (!r || r.status === k.dataset.stage) return;
  if (k.dataset.stage === 'مفقود') return pipeLostModal_(r);
  api('action', 'leadStage', { lead_id: p[1], status: k.dataset.stage }).then(function () { toast('«' + r.name + '» ← ' + k.dataset.stage); go('pipeline', { days: PIPE.data.days, course: PIPE.data.flt.course, source: PIPE.data.flt.source }, true); })
    .catch(function (e2) { toast(errMsg(e2), true); });
});

/* ── لوحة علم النفس داخل ملف العميل ── */
var LPS = { lead: null, d: null };
function leadPsychLoad_(leadId, key) {
  var box = $('lead_psych'); if (!box) return;
  api('action', 'leadPsych', { lead_id: leadId, key: key || '' }).then(function (d) { LPS.d = d; box.innerHTML = leadPsychHtml_(leadId, d); })
    .catch(function (e) { box.innerHTML = '<div class="muted small">' + esc(errMsg(e)) + '</div>'; });
}
function leadPsychHtml_(id, d) {
  var l = LPS.lead || {}, st = d.step || {};
  var wa = l.phone && d.message ? 'https://wa.me/' + String(l.phone).replace(/[^0-9]/g, '') + '?text=' + encodeURIComponent(d.message) : '';
  var keys = d.types.map(function (t) { return t.key; }).concat(d.objections.map(function (o) { return o.key; }));
  return '<b>🧠 علم النفس للتقفيل</b>' +
    '<div class="card small" style="margin:6px 0;background:var(--accent-soft)">➡️ <b>الخطوة التالية:</b> ' + esc(st.title || '') + (st.principle ? ' ' + chip(st.principle, 'acc') : '') +
      (st.why ? '<div class="muted">' + esc(st.why) + '</div>' : '') + '</div>' +
    '<div class="row" style="gap:6px"><div class="grow"><label class="f">نمط العميل' + (d.saved_type ? '' : ' (مقترح من كلامه)') + '</label><select id="lp_type">' +
      d.types.map(function (t) { return '<option value="' + esc(t.key) + '"' + (t.key === d.psych_type ? ' selected' : '') + '>' + esc(t.key) + ' — ' + esc(t.principle) + '</option>'; }).join('') + '</select></div>' +
    '<div class="grow"><label class="f">اعتراضه' + (d.detected && !d.objection ? ' (اكتشفنا: «' + esc(d.detected) + '»)' : '') + '</label><select id="lp_obj"><option value="">لا يوجد</option>' +
      d.objections.map(function (o) { return '<option value="' + esc(o.key) + '"' + (o.key === (d.objection || d.detected) ? ' selected' : '') + '>' + esc(o.key) + '</option>'; }).join('') + '</select></div></div>' +
    '<label class="f">الرسالة المقترحة — حسب: <select id="lp_key" style="min-width:0">' + keys.map(function (k) { return '<option' + (k === d.key ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('') + '</select></label>' +
    (d.message ? '<textarea id="lp_msg" style="min-height:110px">' + esc(d.message) + '</textarea>' : '<div class="muted small">لا رسالة — العميل طلب عدم التواصل.</div>') +
    '<div class="btns">' + (d.message ? '<button class="btn sm good" data-act="lpCopy">📋 انسخ</button>' + (wa ? '<a class="btn sm" id="lp_wa" target="_blank" rel="noopener" href="' + esc(wa) + '">🟢 افتح في واتساب</a>' : '') : '') +
      '<button class="btn sm" data-act="lpSave" data-id="' + esc(id) + '">💾 احفظ النمط والاعتراض</button>' +
      (LPS.lead && LPS.lead.status === 'خامل' ? '<button class="btn sm good" data-act="leadWake" data-id="' + esc(id) + '">▶️ تنشيط (يعود «تواصلنا»)</button>' : '<button class="btn sm ghost" data-act="leadDormant" data-id="' + esc(id) + '" title="لم يرد بعد عدة محاولات — يوقف التذكيرات ويبقى في العمود «خامل»">⏸ اجعله خاملاً</button>') + '</div>' +
    '<label class="f">⏰ تذكير المتابعة لهذا العميل</label><div class="row" style="gap:6px"><input type="datetime-local" id="lp_date" value="' + esc(lpLocal_(d.next_action_date)) + '">' +
      '<input type="text" id="lp_next" class="grow" placeholder="ماذا ستفعل؟ مثال: أرسل له جدول الدفعة" value="' + esc(d.next_action || st.title || '') + '">' +
      '<button class="btn sm pri" data-act="lpRemind" data-id="' + esc(id) + '">ذكّرني</button>' + (d.next_action_date ? '<button class="btn sm ghost" data-act="lpRemindClear" data-id="' + esc(id) + '">إلغاء التذكير</button>' : '') + '</div>';
}
function lpLocal_(v) { var d = v ? new Date(v) : null; if (!d || isNaN(d)) return ''; d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
SCREENS.lead.after = function (d) {
  LPS.lead = d.lead;
  var h = document.querySelector('#main h1'); if (!h) return;
  h.insertAdjacentHTML('afterend', '<div class="card" id="lead_psych" style="border-color:var(--accent)"><span class="muted small">🧠 يحلّل العميل…</span></div>');
  leadPsychLoad_(d.lead.lead_id);
};
document.addEventListener('change', function (e) {
  if (!e.target || !LPS.lead) return;
  if (e.target.id === 'lp_key') leadPsychLoad_(LPS.lead.lead_id, e.target.value);
  if (e.target.id === 'lp_obj' && e.target.value) leadPsychLoad_(LPS.lead.lead_id, e.target.value);
  if (e.target.id === 'lp_type') leadPsychLoad_(LPS.lead.lead_id, e.target.value);
});
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'lp_msg' && $('lp_wa') && LPS.lead) $('lp_wa').href = 'https://wa.me/' + String(LPS.lead.phone).replace(/[^0-9]/g, '') + '?text=' + encodeURIComponent(e.target.value);
});
ACT.leadDormant = function (el) { act('leadStage', { lead_id: el.dataset.id, status: 'خامل' }, '⏸ صار خاملاً — بلا تذكيرات، ويمكن تنشيطه لاحقاً'); };
ACT.leadWake = function (el) { act('leadStage', { lead_id: el.dataset.id, status: 'تواصلنا' }, '▶️ نُشّط'); };
ACT.lpCopy = function () { copyText(val('lp_msg')); };
ACT.lpSave = function (el) { act('leadPsychSave', { lead_id: el.dataset.id, psych_type: val('lp_type'), objection: val('lp_obj') }, 'حُفظ', false); };
ACT.lpRemind = function (el) {

/** المخطط الانسيابي: كل مرحلة صندوق ملوّن، داخله صفحاتها بالترتيب (→)، وسهم ⬇ إلى المرحلة التالية. كل مربع قابل للضغط */
function infoDraw_() {
  var box = $('infoChart'); if (!box) return;
  var mods = {}; ((INFO.data || {}).modules || []).forEach(function (m) { mods[m.module_key] = m; });
  var health = function (st) {
    var list = st.mods.map(function (k) { return mods[k]; }).filter(Boolean);
    var on = list.filter(function (m) { return m.enabled === 'مفعّل'; });
    var bad = on.filter(function (m) { return m.last_status === 'error'; }).length, wait = on.filter(function (m) { return m.last_status === 'deferred'; }).length;
    return '<span class="fcx-h">' + '<span class="fc-dot" style="background:var(--good)"></span>' + (on.length - bad - wait) +
      (wait ? ' <span class="fc-dot" style="background:var(--warn)"></span>' + wait : '') + (bad ? ' <span class="fc-dot" style="background:var(--bad)"></span>' + bad : '') +
      (list.length - on.length ? ' <span class="fc-dot" style="background:var(--off)"></span>' + (list.length - on.length) : '') + '</span>';
  };
  box.classList.remove('muted');
  box.innerHTML = '<div class="fcx">' + INFO_STAGES.map(function (st, i) {
    return (i ? '<div class="fcx-down" style="color:' + st.c + '">⬇</div>' : '') +
      '<div class="fcx-stage" style="border-color:' + st.c + '"><div class="fcx-t" style="background:' + st.c + '">' + esc(st.t) + health(st) + '</div>' +
      '<div class="fcx-row">' + st.pages.map(function (k, j) {

  }).join('') + '</div>';
}

  <script>

var ST = { data: null, open: null, f: { q: '', deliv: '', gender: '', city: '', other: false } };

  var dl = m.delivery || {}, tot = m.n || 1, mix = Object.keys(dl).filter(function (k) { return dl[k]; }).map(function (k) { return '<span class="tag">' + esc(k) + ' ' + Math.round(100 * dl[k] / tot) + '%</span>'; }).join(' ');
