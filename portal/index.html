      (ss.length?ss.map(function(s){var st=s.st;return '<div class="row"'+(s.day===t?' style="background:var(--as);border-radius:8px;padding:6px"':'')+'><span><b>'+s.n+'</b> · '+DAYS[new Date(s.day+'T12:00:00').getDay()]+' '+dAr(s.day,{day:'numeric',month:'short'})+(s.topic?' · '+esc(s.topic):'')+' <span class="xs mut">'+esc(s.kind||'')+'</span></span>'+
        (st?'<span class="dots"><span class="s'+st+'">'+({P:'✓',L:'⏱',A:'✗',E:'ع'})[st]+'</span></span>':s.day<t?'<span class="xs mut">—</span>':'<span class="xs mut">قادمة</span>')+'</div>'}).join(''):'<div class="empty">يُعلن الجدول قريباً</div>')+
      '<div class="xs mut" style="margin-top:6px">✓ حاضر · ⏱ متأخر (يُحسب حضوراً) · ع عذر مقبول · ✗ غائب</div></div>';
  } else if(PANE==='study'){

      '<div class="xs mut" style="margin-top:6px">النجاح '+r.pass_min+'% · تُحتسب أفضل محاولة · لك '+r.retake_free+' إعادة مجاناً بعد المحاولة الأساسية، بعدها '+r.retake_fee_pct+'% من سعر الدورة لكل إعادة</div></div>';
  } else if(PANE==='cert'){
    html+=E.cert?certFull():'<div class="card empty">🏅<br><b>شهادتك تظهر هنا بعد الاختبار النهائي</b><div class="sm" style="margin-top:6px">الشروط: حضور '+r.attendance_min+'% على الأقل ومعدل نهائي '+r.pass_min+'% على الأقل</div><div class="two" style="margin-top:10px;text-align:start">'+bar(pct(g.attendance_pct),r.attendance_min,'حضورك','محقق')+bar(pct(g.final_score==null?g.score_now:g.final_score),r.pass_min,'معدلك','محقق')+'</div></div>';
    html+=refCard();
  } else if(PANE==='acc'){
    html+='<div class="pane on cols"><div><div class="card"><h3>👤 حسابي</h3><div class="row"><span>الاسم</span><b>'+esc(D.name)+'</b></div><div class="row"><span>البرنامج</span><span>'+esc(p.name)+'</span></div><div class="row"><span>الدفعة</span><span>'+esc(c.name)+'</span></div>'+
      '<div class="row"><span>الدفع</span>'+(E.pay_status==='مدفوع'?'<span class="chip cg">مكتمل'+(E.pay_method?' · '+esc(E.pay_method):'')+'</span>':'<span class="chip cw">'+esc(E.pay_status)+'</span>')+'</div>'+
      '<div class="row"><span>حالتك</span><span class="chip">'+esc(E.status)+'</span></div></div></div><div>'+refCard()+
      '<div class="card"><h3>📌 روابط</h3><div class="row"><span>سياسة الخصوصية</span><a href="../privacy/">قراءة ‹</a></div><div class="row"><span>أضف البوابة لشاشة جوالك</span><span class="xs mut">آيفون: زر المشاركة ← «إضافة إلى الشاشة الرئيسية»</span></div>'+
      (B.phone?'<div class="row"><span>تواصل معنا</span><a href="tel:'+esc(B.phone)+'">'+esc(B.phone)+'</a></div>':'')+'</div></div></div>';
  }
  if(D.enrollments.length>1)html+='<div class="card noprint"><h3>🎓 برامجي</h3>'+D.enrollments.map(function(x,i){return '<div class="row"><span>'+esc(x.program.name)+' <span class="xs mut">'+esc(x.cohort.name)+'</span></span><button class="btn" onclick="E=D.enrollments['+i+'];render()">'+(x===E?'✓ معروض':'عرض')+'</button></div>'}).join('')+'</div>';
  $('main').innerHTML=html+footHtml(B);
  if(PANE==='cert'&&E.cert)qr();
}
function studyCard(short){var u=E.cohort.classroom_url,a=u?'href="'+esc(u)+'" target="_blank" rel="noopener"':'href="#" onclick="alert(\'يُفتح فصل المذاكرة مع بداية البرنامج\');return false"';
  return '<div class="card"><h3>📚 المذاكرة والاختبارات</h3><div class="grid3"><a class="btn" '+a+' data-tip="كتب البرنامج (للعرض فقط) في Google Classroom"><span>📖</span>كتبي</a><a class="btn" '+a+' data-tip="الاختبارات القصيرة والنهائية — تُصحَّح تلقائياً"><span>📝</span>الاختبارات</a><a class="btn" '+a+' data-tip="المحاضرات والملخصات"><span>🎥</span>المحاضرات</a></div>'+
    '<div class="xs mut" style="margin-top:6px">'+(u?'يفتح في Google Classroom بحسابك':'⏳ يُفعَّل فصل Classroom مع بداية البرنامج')+' · المحتوى ملك الأكاديمية ولا يجوز نسخه أو مشاركته</div></div>'}
function certTeaser(){return '<div class="card" style="background:linear-gradient(135deg,#fff8e6,#fdf0cc);border:1px solid #ecd590;color:#3a2e00;text-align:center"><div style="font-size:28px">🏅</div><b>مبروك! شهادتك جاهزة</b><div><button class="btn g" style="margin-top:6px" onclick="go(\'cert\')">عرض الشهادة</button></div></div>'}
function verifyUrl(){return (B.site||location.origin+location.pathname.replace(/portal\/?.*$/,''))+'verify/?c='+encodeURIComponent(E.cert.code)}
function refUrl(){return (B.site||location.origin+location.pathname.replace(/portal\/?.*$/,''))+'register/?ref='+encodeURIComponent(D.ref_code)}
function certFull(){var c=E.cert,v=verifyUrl(),y=new Date(c.issued_at),title=E.program.cert_title||E.program.name,rev=c.status!=='صالحة';
  var fem=D.gender==='أنثى'||(!D.gender&&E.cohort.gender==='نساء'),acc=E.program.accredited&&B.acc_logo_url,an=B.name||'الأكاديمية';
  var li='https://www.linkedin.com/profile/add?startTask=CERTIFICATION_NAME&name='+encodeURIComponent(title)+'&organizationName='+encodeURIComponent(B.name_en||an)+'&issueYear='+y.getFullYear()+'&issueMonth='+(y.getMonth()+1)+'&certUrl='+encodeURIComponent(v)+'&certId='+encodeURIComponent(c.code);
  var txt=TXT.cert=(fem?'حصلتُ':'حصلت')+' على شهادة «'+title+'» من '+an+' 🎉 '+v;
  var d1=E.cohort.first_day||E.cohort.start_date,d2=E.cohort.last_day||E.cohort.end_date,bg=function(u){return u?' style="background-image:url('+esc(u)+')"':''};
  var foot=[B.legal_name,B.license?'ترخيص التدريب '+B.license:'','للتحقق: '+v.replace('https://','')].filter(Boolean).join(' · ');
  return '<div class="card'+(rev?'':' printme')+'"><h3 class="noprint">🏅 شهادتي'+(rev?' <span class="chip cb">ملغاة</span>':'')+'</h3>'+
    '<div class="paper"><div class="cert'+(rev?' rev':'')+'"><div class="wm"'+bg(B.logo_url)+'></div><div class="f1"></div><div class="f2"></div><div class="cn tl"></div><div class="cn tr"></div><div class="cn bl"></div><div class="cn br"></div>'+
    '<div class="in">'+(B.logo_url?'<div class="lg"'+bg(B.logo_url)+'></div>':'<div class="lgt">'+esc(an)+'</div>')+
    '<h4>شهادة إتمام برنامج</h4><div class="h1en">Certificate of Completion</div>'+
    '<div class="t">تشهد '+esc(an)+' بأن '+(fem?'المتدربة':'المتدرب')+'</div><div class="nm">'+esc(D.name)+'</div>'+(D.name_en?'<div class="nmen">'+esc(D.name_en)+'</div>':'')+
    '<div class="p">'+(fem?'قد أتمّت':'قد أتمّ')+' بنجاح برنامج <b>«'+esc(title)+'»</b>'+(E.program.hours?' بإجمالي <b>'+E.program.hours+'</b> ساعة تدريبية':'')+'</div>'+
    (d1?'<div class="sub">من '+dAr(d1)+(d2?' إلى '+dAr(d2):'')+'</div>':'')+
    '<div class="acc">'+(acc?'<img src="'+esc(B.acc_logo_url)+'" alt="معهد إعداد القادة ووزارة الرياضة"><span class="accbox">'+esc(B.accreditation||'معتمدة من وزارة الرياضة ومعهد إعداد القادة (LDI)')+'</span>':'<span class="accbox">شهادة صادرة ومعتمدة من '+esc(an)+'</span>')+'</div></div>'+
    '<div class="bot"><div class="sig">'+(B.sig_url?'<img src="'+esc(B.sig_url)+'" alt="">':'')+'<div class="ln"></div>مدير الأكاديمية</div>'+
    '<div class="qrw"><div class="qr" id="qr" aria-label="رمز التحقق"></div><div>رقم الشهادة<br><b>'+esc(c.code)+'</b><br>الإصدار '+dAr(c.issued_at)+'</div></div>'+
    '<div class="seal"><i'+bg(B.icon_url)+'></i></div><div class="sig"><div class="ln"></div>'+(fem?'المدربة المسؤولة':'المدرب المسؤول')+'</div></div>'+
    '<div class="foot2">'+esc(foot)+'</div></div></div>'+
    (rev?'':'<div class="share noprint"><button class="btn g" onclick="window.print()" data-tip="آيفون: اختر «طباعة» ثم «حفظ PDF» أو شارك — لابتوب: «حفظ بصيغة PDF»">⬇ PDF</button><a class="btn" target="_blank" rel="noopener" href="'+esc(li)+'" data-tip="يضيف الشهادة لقسم الشهادات في ملفك على LinkedIn">in LinkedIn</a>'+
    '<a class="btn" target="_blank" rel="noopener" href="https://x.com/intent/post?text='+encodeURIComponent(txt)+'" data-tip="انشرها على X">𝕏</a><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt)+'" data-tip="أرسلها على واتساب">💬</a>'+
    '<button class="btn" onclick="shareIt(TXT.cert)" data-tip="انستغرام وغيره: من قائمة المشاركة في جوالك">📸 مشاركة</button></div>')+'</div>'}
function refCard(){if(!D.ref_code)return '<div class="card"><h3>🤝 رشّح أصدقاءك</h3><div class="sm mut">يصلك رابط الترشيح الشخصي مع شهادتك.</div></div>';
  var r=D.rules||{},u=refUrl(),paid=(D.referrals||[]).filter(function(x){return x.status==='دفع'}),cr=paid.reduce(function(t,x){return t+Number(x.credit_pct||0)},0);
  TXT.refu=u;var msg=TXT.ref='سجّلت في '+(B.name||'الأكاديمية')+' وأنصحك بها 👌 سجّل من رابطي وتحصل على خصم '+r.ref_discount_pct+'%: '+u;
  return '<div class="card"><h3>🤝 رشّح أصدقاءك</h3><div class="sm">أرسل رابطك لمن تعرفهم. صديقك يحصل على <b>خصم '+r.ref_discount_pct+'%</b>، وأنت <b>رصيد '+r.ref_credit_pct+'%</b> عن كل صديق يدفع (حتى '+r.ref_credit_cap+'%) على دورتك القادمة.</div>'+
    '<div class="ref">'+esc(u)+'</div><div class="share"><a class="btn p" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(msg)+'">💬 أرسل على واتساب</a><button class="btn ib" onclick="copy(TXT.refu)" data-tip="نسخ الرابط">📋</button><button class="btn ib" onclick="shareIt(TXT.ref)" data-tip="مشاركة من جوالك">↗</button></div>'+
    '<div class="two" style="margin-top:10px"><div class="st"><span class="sm mut">سجّلوا عبرك</span><b>'+(D.referrals||[]).length+'</b></div><div class="st"><span class="sm mut">رصيدك</span><b style="color:#8a6a16">'+cr+'%</b>'+(cr>=r.ref_credit_cap?'<div class="xs mut">الحد الأقصى ✓</div>':'')+'</div></div>'+
    (D.referrals||[]).map(function(x){return '<div class="row"><span>'+esc(x.name)+' · '+(x.status==='دفع'?'دفع':'سجّل ولم يدفع بعد')+'</span>'+(Number(x.credit_pct)?'<span class="chip co">+'+Number(x.credit_pct)+'%</span>':'<span class="chip">بالانتظار</span>')+'</div>'}).join('')+
    ((D.next_programs||[]).length&&cr?'<div class="row"><span>🚀 '+esc(D.next_programs[0].name)+' · '+dAr(D.next_programs[0].start_date,{day:'numeric',month:'short'})+'</span><a class="btn p" href="'+esc(refUrl().replace(/\?ref=.*/,''))+'">استخدم رصيدك</a></div>':'')+
    '<div class="xs mut" style="margin-top:6px">الرصيد لدورة لاحقة ولا يُصرف نقداً · لا نطلب بيانات أصدقائك — هم من يسجّلون بأنفسهم</div></div>'}
function qr(){var el=$('qr');if(!el||!window.QRCode)return;el.innerHTML='';try{new QRCode(el,{text:verifyUrl(),width:200,height:200,colorDark:'#0B2D4B',correctLevel:QRCode.CorrectLevel.M})}catch(e){}}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){alert('✓ نُسخ')}).catch(function(){prompt('انسخ:',t)})}
function shareIt(t){if(navigator.share)navigator.share({text:t}).catch(function(){});else copy(t)}
function ics(){var c=E.cohort,p=function(n){return('0'+n).slice(-2)},lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//academy//portal//AR','CALSCALE:GREGORIAN'];
  (E.sessions||[]).forEach(function(s){var d=s.day.replace(/-/g,''),f=(c.time_from||'17:00').replace(':',''),t=(c.time_to||'20:00').replace(':','');
    lines.push('BEGIN:VEVENT','UID:'+d+'-'+s.n+'@academy','DTSTAMP:'+d+'T000000Z','DTSTART;TZID=Asia/Riyadh:'+d+'T'+f+'00','DTEND;TZID=Asia/Riyadh:'+d+'T'+t+'00','SUMMARY:'+(E.program.name+' — جلسة '+s.n).replace(/[,;]/g,' '),'LOCATION:'+String(c.place||'').replace(/[,;]/g,' '),'END:VEVENT')});
  lines.push('END:VCALENDAR');var a=document.createElement('a');a.href='data:text/calendar;charset=utf-8,'+encodeURIComponent(lines.join('\r\n'));a.download='schedule.ics';document.body.appendChild(a);a.click();a.remove()}
if(!TOK){$('hi').textContent='افتح الرابط الشخصي الذي وصلك من الأكاديمية';$('main').innerHTML='<div class="card empty">🔒 هذه البوابة تفتح برابطك الشخصي فقط (وصلك على واتساب أو البريد).</div>'}
else rpc('ac_portal',{token:TOK}).then(function(d){
  if(!d){$('hi').textContent='الرابط غير صحيح أو قديم';$('main').innerHTML='<div class="card empty">🔒 تواصل مع الأكاديمية لإرسال رابطك من جديد.</div>';try{localStorage.removeItem('ac_tok')}catch(e){}return}
  D=d;E=(d.enrollments||[]).filter(function(x){return x.status!=='منسحب'})[0]||(d.enrollments||[])[0]||null;
  // يُعرض فوراً بهوية الأكاديمي، ثم تُكمَّل بيانات المنشأة من النظام الأساسي حين تصل (لا ننتظر جوجل)
  function apply(b){B=b;document.title='بوابة المتدرب'+(b.name?' — '+b.name:'');
    $('bt').innerHTML=logoHtml(b)+'<div><b>'+esc(b.name||'الأكاديمية')+'</b><small>بوابة المتدرب</small></div>'}
  var b0={};Object.keys(d.brand||{}).forEach(function(k){b0[k]=pub(d.brand[k])});apply(b0);
  var first=esc(String(d.name).split(' ')[0]);
  $('hi').innerHTML=(E&&E.cert&&E.cert.status==='صالحة'?'مبروك يا '+first+' 🎉':'أهلاً، '+first+' 👋')+(E?'<small>'+esc(E.program.cert_title||E.program.name)+' · '+esc(E.cohort.name)+'</small>':'');
  if(E&&E.cert)PANE='cert';nav();render();
  brandMerge(d.brand).then(function(b){apply(b);render()})
}).catch(function(){$('hi').textContent='تعذّر الاتصال';$('main').innerHTML='<div class="card empty">تحقق من الإنترنت ثم <a href="#" onclick="location.reload();return false">أعد المحاولة</a></div>'});
</script></body></html>
