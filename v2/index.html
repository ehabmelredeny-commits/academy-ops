  gapi('action','personSave',a).then(function(r){$('pres').textContent=r.ok?'✓ حُفظ في النظام الحالي — يظهر هنا مع النسخ التالي (خلال ساعة)':'✗ '+(r.error||'تعذّر')}).catch(function(){$('pres').textContent='✗ تعذّر الاتصال'})}
function pOptOut(){if(!confirm('تسجيل «لا تراسل» لهذا الشخص في كل مكان (العملاء والأعضاء والقوائم)؟'))return;$('pact').innerHTML='<div class="mut">جارٍ التسجيل…</div>';
  gapi('action','personOptOut',{person_id:PCUR.id}).then(function(r){$('pact').innerHTML='<div class="mut">'+(r.ok?'✓ سُجّل «لا تراسل» في كل الجداول المربوطة':'✗ '+esc(r.error||'تعذّر'))+'</div>'}).catch(function(){$('pact').innerHTML='<div class="mut">✗ تعذّر الاتصال</div>'})}
function fullSys(){window.open(EXEC+'?k='+encodeURIComponent('v2:'+TOK),'_blank','noopener')}
home();
</script></body></html>
