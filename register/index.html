<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>التسجيل في الدورات</title><meta name="robots" content="noindex"><style>:root{--a:#0b6e7f;--bg:#f5f8f9;--ink:#15212a;--mut:#5d6b73;--line:#d9e2e6}
*{box-sizing:border-box}body{margin:0;font-family:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}.hero{background:var(--a);color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:14px}
.hero h1{margin:0 0 4px;font-size:22px}.hero p{margin:0;opacity:.92}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:14px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
textarea{min-height:80px}.chk{display:flex;gap:8px;align-items:flex-start;font-weight:400;font-size:13.5px}.chk input{width:auto;margin-top:5px}
button{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;background:var(--a);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
button:disabled{opacity:.6}.err{color:#b3261e;font-size:14px;margin-top:8px;min-height:1em}.ok{text-align:center;padding:30px 10px}.ok h2{color:var(--a)}
.wa{display:inline-block;margin-top:10px;background:#25d366;color:#fff;padding:12px 18px;border-radius:12px;text-decoration:none;font-weight:700}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin-top:18px}.foot a{color:var(--a)}.hp{position:absolute;left:-9999px}
.sbx{background:#c0392b;color:#fff;text-align:center;font-size:12.5px;padding:4px}</style></head><body>

<div class="wrap">
<div class="hero"><h1 id="t">سجّل اهتمامك بالدورة</h1><p>اترك بياناتك ونتواصل معك بالتفاصيل: الموعد، والسعر، والمقاعد المتاحة.</p></div>
<form class="card" id="f" novalidate>
<label for="name">الاسم *</label><input id="name" autocomplete="name" required>
<label for="phone">رقم الجوال (واتساب) *</label><input id="phone" type="tel" inputmode="tel" dir="ltr" placeholder="05xxxxxxxx" autocomplete="tel" required>
<label for="email">البريد الإلكتروني (اختياري)</label><input id="email" type="email" dir="ltr" autocomplete="email">
<label for="city">المدينة</label><select id="city"><option value="">اختر المدينة</option></select>
<label for="course">الدورة التي تهمك</label><select id="course"><option value="">لم أحدد بعد</option></select>
<label for="persona">وضعك الحالي</label><select id="persona"><option value="">اختر</option><option>أبدأ في المجال من الصفر</option><option>مدرب حالياً وأريد التطوير</option>
<option>أحتاج رخصة أو شهادة لعملي</option><option>أقارن بين الشهادات</option></select>
<label for="note">سؤالك أو ملاحظتك (اختياري)</label><textarea id="note"></textarea>
<label for="member_no">رقم عضوية صديق (اختياري)</label><input id="member_no" dir="ltr" placeholder="مثال: M-23456" autocomplete="off" maxlength="30">
<label class="chk"><input type="checkbox" id="member_consent"> أوافق (اختيارياً) على عضويتي في مجتمع الأكاديمية بعد إتمام دورتي، وأن يُستخدم رقم عضويتي لمنح أصدقائي خصومات تساعد الأكاديمية في التسويق. يمكنني الانسحاب في أي وقت.</label>
<input class="hp" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<label class="chk"><input type="checkbox" id="consent"> أوافق على تواصل الأكاديمية معي عبر واتساب أو الاتصال بخصوص الدورات. يمكنني إيقاف التواصل في أي وقت بكتابة «إيقاف». <a href="../privacy/" target="_blank">سياسة الخصوصية</a></label>
<button id="go" type="submit">أرسل طلبي</button><div class="err" id="err"></div></form>
<div class="card ok" id="done" style="display:none"><h2>✅ وصلنا طلبك</h2><p>سنتواصل معك قريباً بالتفاصيل.</p><a class="wa" id="wa" style="display:none" target="_blank" rel="noopener">راسلنا على واتساب الآن</a></div>
<div class="foot" id="foot"><a href="../privacy/">سياسة الخصوصية</a></div></div>
<script>
var EXEC="https://script.google.com/macros/s/AKfycbxi0KbhfDt4Uu7CNd19KlJ6F84vUJY9SEhbyA2Qggz_Ic5X-SGdeSUKzOD7dGVDpya2/exec",CFG={},P=new URLSearchParams(location.search);
function $(i){return document.getElementById(i)}
function track(ev){try{if(window.gtag)gtag('event',ev==='Lead'?'generate_lead':ev);if(window.fbq)fbq('track',ev);if(window.ttq)ttq.track(ev==='Lead'?'SubmitForm':ev)}catch(e){}}
function loadTrackers(c){
  if(c.ga4){var s=document.createElement('script');s.async=1;s.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(c.ga4);document.head.appendChild(s);
    window.dataLayer=window.dataLayer||[];window.gtag=function(){dataLayer.push(arguments)};gtag('js',new Date());gtag('config',c.ga4);}
  if(c.meta_pixel){!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');fbq('init',c.meta_pixel);fbq('track','PageView');}
  if(c.tiktok_pixel){!function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=['page','track','identify','instances','debug','on','off','once','ready','alias','group','enableCookie','disableCookie'];ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)))}};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.load=function(e){var n='https://analytics.tiktok.com/i18n/pixel/events.js';var a=d.createElement('script');a.type='text/javascript';a.async=!0;a.src=n+'?sdkid='+e+'&lib='+t;var s=d.getElementsByTagName('script')[0];s.parentNode.insertBefore(a,s)};ttq.load(c.tiktok_pixel);ttq.page()}(window,document,'ttq');}
}
fetch(EXEC+'?public=config').then(function(r){return r.json()}).then(function(j){
  CFG=j.data||{};
  if(CFG.academy){$('t').textContent='سجّل اهتمامك — '+CFG.academy;document.title='التسجيل — '+CFG.academy;}
  (CFG.cities||[]).forEach(function(c){var o=document.createElement('option');o.textContent=c;$('city').appendChild(o)});
  (CFG.courses||[]).forEach(function(c){var o=document.createElement('option');o.textContent=c.name;$('course').appendChild(o)});
  var pre=P.get('course');if(pre)$('course').value=pre;
  var b=CFG.biz||{},bits=[b.legal_name,b.cr?'س.ت '+b.cr:'',b.phone].filter(Boolean);if(bits.length)$('foot').insertAdjacentHTML('afterbegin',bits.join(' · ')+'<br>');
  loadTrackers(CFG);
}).catch(function(){});
$('f').addEventListener('submit',function(e){
  e.preventDefault();$('err').textContent='';
  if($('name').value.trim().length<2)return $('err').textContent='اكتب اسمك';
  if($('phone').value.replace(/\D/g,'').length<9)return $('err').textContent='اكتب رقم جوال صحيح';
  if(!$('consent').checked)return $('err').textContent='نحتاج موافقتك على التواصل لنرسل لك التفاصيل';
  $('go').disabled=true;$('go').textContent='جارٍ الإرسال…';
  var body={name:$('name').value,phone:$('phone').value,email:$('email').value,city:$('city').value,course:$('course').value,persona:$('persona').value,note:$('note').value,
    website:$('website').value,consent:$('consent').checked,member_no:$('member_no').value.trim(),member_consent:$('member_consent').checked,utm_source:P.get('utm_source')||'',utm_medium:P.get('utm_medium')||'',utm_campaign:P.get('utm_campaign')||'',utm_content:P.get('utm_content')||''};
  fetch(EXEC+'?public=register',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok){$('go').disabled=false;$('go').textContent='أرسل طلبي';$('err').textContent=j.error||'حدث خطأ';return}
    track('Lead');$('f').style.display='none';$('done').style.display='block';
    var w=(CFG.biz||{}).whatsapp;if(w){$('wa').href='https://wa.me/'+String(w).replace(/\D/g,'')+'?text='+encodeURIComponent('السلام عليكم، سجّلت اهتمامي بـ '+($('course').value||'الدورات')+' باسم '+$('name').value);$('wa').style.display='inline-block'}
  }).catch(function(){$('go').disabled=false;$('go').textContent='أرسل طلبي';$('err').textContent='تعذّر الإرسال — تحقق من الإنترنت وحاول مرة أخرى'});
});
</script></body></html>
